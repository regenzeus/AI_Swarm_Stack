# Core services for MVP 0: model gateway, its database, tracing, and the smoke-test model.
# Started via `make up`, which decrypts secrets with sops into the environment of this command only.
name: aistack

networks:
  backend:
    internal: true        # postgres, ollama: no internet
  edge: {}                # litellm egress to providers
  obs: {}                 # Phoenix only: lets Docker publish its UI port (internal networks cannot)
  flows: {}               # n8n only: publishes its editor on 127.0.0.1 and reaches the integrations it is given
  stepnet:                # n8n <-> Mission Control only: its step service (8099, WFL-05) and n8n's editor inside the app (WFL-13)
    internal: true
  n8ndb:                  # n8n <-> its database in Postgres only (SEC-27): n8n is off the flat backend, away from the builder's sandbox
    internal: true

volumes:
  pgdata: {}
  phoenix: {}
  ollama: {}
  litellm-auth: {}        # ChatGPT OAuth tokens (device login); backed up encrypted
  n8n: {}                 # n8n's home: settings, binary data; workflows and credentials are in Postgres

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run via make up}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend, n8ndb]   # n8ndb: n8n's database (its own role), the one thing n8n reaches there
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      retries: 10
    mem_limit: 512m
    logging: *logging

  litellm:
    image: aistack/litellm:1.105.4-p2      # LITELLM_IMAGE + tool-call streaming patch + prompt-cache affinity (images/litellm)
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run via make up}
      DATABASE_URL: postgresql://litellm:${PG_PASSWORD}@postgres:5432/litellm
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://phoenix:6006/v1/traces
      OTEL_SERVICE_NAME: litellm
      CHATGPT_TOKEN_DIR: /root/.config/litellm/chatgpt
      AISTACK_GATEWAY_TOKEN: ${AISTACK_GATEWAY_TOKEN:-}   # a gateway deployment's token, filled by make from models.yaml's name (GEN-05)
      # SEC-26: the bearer token of each of Mission Control's MCP servers (sops, make trust-keys), sent by the gateway alone
      MCP_TOKEN_MISSIONS: ${MCP_TOKEN_MISSIONS:-}
      MCP_TOKEN_CLAUDE: ${MCP_TOKEN_CLAUDE:-}
      MCP_TOKEN_HOUSE: ${MCP_TOKEN_HOUSE:-}
      MCP_TOKEN_FILES: ${MCP_TOKEN_FILES:-}
      MCP_TOKEN_MEMORY: ${MCP_TOKEN_MEMORY:-}
      MCP_TOKEN_MEMORYPUBLIC: ${MCP_TOKEN_MEMORYPUBLIC:-}
      MCP_TOKEN_STACK: ${MCP_TOKEN_STACK:-}
    volumes:
      - ${LITELLM_CONFIG:-../config/litellm/config.yaml}:/app/config.yaml:ro   # a gateway deployment's own (GEN-05)
      - litellm-auth:/root/.config/litellm
    ports: ["127.0.0.1:4000:4000"]
    networks: [backend, edge, webonly, memnet, mcnet, phonemcp, mailmcp, swarmmcp]   # memnet: Hindsight's fact extraction; mcnet: Mission Control tools; phonemcp: AI phone tools; swarmmcp: the swarm's MCP tools (apps.yaml)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    mem_limit: 1g
    logging: *logging

  phoenix:
    image: ${PHOENIX_IMAGE}
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /data
      # APP-66: Phoenix inside the app, under its address at /phoenix/ (images/mission-control/server.frames.py, behind
      # the app's gate): its pages ask for /phoenix/...; it still answers at its root, where the gateway sends its traces
      PHOENIX_HOST_ROOT_PATH: /phoenix
      PHOENIX_TELEMETRY_ENABLED: "false"   # no usage pixel from the owner's browser to Phoenix's makers
    volumes: [phoenix:/data]
    ports: ["127.0.0.1:6006:6006"]
    networks: [backend, obs]      # no longer on edge: Phoenix holds traces with prompt content
    mem_limit: 1g
    logging: *logging

  ollama:
    # Smoke-test rig only. Reachable solely through LiteLLM with vk-smoke.
    image: ${OLLAMA_IMAGE}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes: [ollama:/root/.ollama]
    networks: [backend]
    mem_limit: 2g
    logging: *logging

  # The workflow pillar (WFL-01 to WFL-04, DEC-51, docs/N8N-MIGRATION.md): n8n decides when work starts and in what
  # order; the stack's services do the work. Core on every deployment. Its role and database live in the Postgres
  # above (made by the one-shot n8n-db, safe to repeat), so the nightly pg_dumpall holds its workflows and credentials.
  n8n-db:
    image: ${POSTGRES_IMAGE}
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["sh", "/setup/db.sh"]
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?run via make up}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?run via make up}
    volumes: [../config/n8n:/setup:ro]
    networks: [n8ndb]
    restart: "no"
    logging: *logging

  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    depends_on:
      n8n-db: { condition: service_completed_successfully }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?run via make up}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run via make up}   # encrypts the credentials n8n stores
      N8N_PATH: /n8n/                     # WFL-14: the editor lives inside the app, under its address (images/mission-control/server.frames.py)
      N8N_PUSH_BACKEND: sse               # live updates as one plain HTTP answer, which the app passes through
      # the app's address: its tailnet one (tailscale serve --https=8447), or http://127.0.0.1:8090/n8n/ in a deployment
      # without the tailnet (N8N_EDITOR_URL in its deployment.env, WFL-15)
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_URL:-https://${PC_TAILNET_HOST:-localhost}:8447/n8n/}
      # webhooks and resume URLs stay at n8n's root on its own tailnet port: programs have no Tailscale login for the
      # app's gate, and the runner re-aims a resume URL's path at 127.0.0.1:5678 (ops/flows.py resume_target); without
      # the tailnet they stay on this PC: http://127.0.0.1:5678/ (N8N_WEBHOOK_URL, WFL-15)
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://${PC_TAILNET_HOST:-localhost}:8450/}
      N8N_PROXY_HOPS: "1"                 # the app in front (it passes the browser's address on)
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_DIAGNOSTICS_ENABLED: "false"    # WFL-03: nothing sent home
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'   # commands only at places (GEN-22)
      # WFL-17: customer data loads only the logic nodes and the AI Stack step (the deployment's N8N_NODES_INCLUDE, which
      # ops/dataguard.py checks against N8N_NODES); empty (home): every node but the excluded ones
      NODES_INCLUDE: ${N8N_NODES_INCLUDE:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_CUSTOM_EXTENSIONS: /home/node/custom   # WFL-06: the AI Stack step node (n8n/custom)
      AISTACK_STEP_TOKEN: ${AISTACK_STEP_TOKEN:-}   # SEC-25: the step node's token for the step service (sops, make trust-keys)
      # O4 (SEC-28): nothing of the stack uses n8n's public API (the runner uses its command line). On 2.44.7 this setting
      # makes n8n refuse every API key (its routes stay and answer 401); the second one takes its docs page away
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"      # limit: drops, an execution's data after 30 days (WFL-04); the run's result stays on Home
    volumes:
      - n8n:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro    # the repository's workflows (WFL-08)
      - ../n8n/custom:/home/node/custom:ro   # the stack's node (WFL-06)
      - {type: tmpfs, target: /home/node/.cache, tmpfs: {mode: 01777}}   # n8n compiles its static assets here at each start
    # O4 (SEC-28): a read-only root, no capabilities, no new privileges; tried on the pinned image, 11 Nov 2026
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:5678:5678"]        # the runner (webhooks, resume URLs) and tailscale serve's port 8450 for /webhook-waiting only (none without the tailnet); the editor itself is in the app
    networks: [n8ndb, flows, stepnet]     # n8ndb: its database; flows: the integrations it is given; stepnet: the step service, nothing else
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: 1g                         # n8n's guidance for a small instance is 320 MB to 1 GB
    logging: *logging
