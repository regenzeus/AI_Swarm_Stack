- id: SWM-108
  group: Run contract
  phase: 5
  title: Every agent knows the team
  statement: 'Every agent''s start-of-run pack shall hold one line per agent of the swarm (its purpose, what it owns, how
    much of its work is open, when it last wrote to the Ledger, which one is itself) and the lane rule: each agent is
    responsible for its own lane first and for the team''s goals, and gets involved in another''s lane only with a clear,
    valuable contribution its owner would not see or has missed. swarm_context with an agent''s id shall show that agent
    up close (its card and open work) and what it did lately (runs with summaries, its settled work with the reasons, the
    evidence it gave to others), as far as the asking agent may see it (SWM-67), without a new tool (the surface stays at
    12). Reading is free; nothing makes an agent contribute.'
  type: functional
  priority: should
  status: implemented
  parents: [SN-17]
  sources: [DEC-30]
