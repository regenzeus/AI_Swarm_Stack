  sources: [DEC-15, OWASP Top 10 for Agentic Applications 2026 ASI01, lethal trifecta (S. Willison)]
  rationale: Without labels the Board would join every agent's private data, untrusted input and ways out into one system,
    undoing the separation SEC-03 and SEC-04 build.
  acceptance: 'Test: Hermes main''s message quoting a vault note is refused for the scout; the scout''s research note reaches
    Hermes main wrapped as untrusted; a summary of a private artifact is private.'
