- id: SWM-107
  group: Board
  phase: 5
  title: The team room
  statement: 'The Chatroom shall be one timeline of what the agents do together, drawn from their work so that no agent
    has to post: tool calls between agents with their answers, work on another agent''s artifact marked as help, Board
    messages, work on the shared artifacts, the owner''s decisions and messages, and runs no one asked for; filtered by type,
    agent (two picked: only what passes between them), topic, time and text, with a burst of asks between the same two agents
    folded into one line; its filters come from the address on every visit and go back into it, and the run timeline
    under them shows the same agents and window.'
  type: functional
  priority: should
  status: implemented
  parents: [SN-07, SN-17]
  sources: [DEC-30]
  rationale: 'The Board had 6 messages in total and only one step into another agent''s lane had ever happened, while a
    mission asked the scout about 100 times a day through its tools: the teamwork is in the work, so the room is drawn from
    it. Broadcast group chats (AutoGen) cost every agent every message; shared work (MetaGPT''s message pool, blackboard and
    stigmergy designs) coordinates with less.'
