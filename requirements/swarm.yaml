  title: Five acts with fixed meanings
  statement: A message's act shall be inform, request, propose, handoff or ack; a request shall become a tracked request
    (SWM-12), a propose shall become a Ledger operation only when the artifact's owner agent accepts it, and a handoff shall
    make the receiver the artifact's owner.
