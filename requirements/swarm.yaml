  statement: Every message, evidence entry and artifact shall carry a sensitivity label (public, internal, private) and
    an origin, content derived from labelled inputs shall carry the highest of their labels, and the Swarm service shall
    refuse to deliver private content to an agent whose card holds a way out (web fetch, browser, AI phone, mail sending)
    and deliver external content to an agent that holds private data only labelled as untrusted.
