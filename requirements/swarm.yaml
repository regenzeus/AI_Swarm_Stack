- id: SWM-109
  group: Ledger
  phase: 5
  title: Lane discipline
  statement: 'An agent''s own write to another agent''s artifact (evidence, a link from it, an update) shall be a help: it
    shall say why the artifact''s owner would not see this (20 characters at least), shall be refused when it repeats what
    the artifact already holds, and shall fit the agent''s daily budget (3 unless its card says otherwise). The helped
    agent (in its next run) or the owner (in the Chatroom) shall judge it useful or not, the owner''s word over the agent''s;
    without a verdict, the work moving on counts as useful and the work dropped as not useful. Each agent''s scorecard shall
    count its helps, and the Coach shall propose an agent change towards quiet when at least half of 3 or more judged helps
    were not useful. Nothing makes an agent help; writes by the system, the checker, the owner and the stack''s code for host
    agents are no helps.'
  type: functional
  priority: should
  status: implemented
  parents: [SN-17, SN-05]
  sources: [DEC-30]
  rationale: 'The owner''s rule: each agent is responsible for its own lane first and for the team''s goals, and gets
    involved in another''s only with a clear, valuable contribution its owner would not see or has missed. Broadcast
    coordination costs every agent every message and the MAST study finds a third of multi-agent failures between agents;
    so a step in is rare, reasoned, new and judged, and an agent whose steps do not help learns to stay out.'
  verify:
    method: test
    by: ['tests/test_lane_discipline.py::test_a_step_into_another_lane_names_why_its_owner_would_not_see_it', 'tests/test_lane_discipline.py::test_each_agent_steps_in_only_a_few_times_a_day',
