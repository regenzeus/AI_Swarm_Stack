  trace: [images/swarm/ledger.py]
- id: SWM-12
  group: Board
  phase: 3
  title: Requests are never lost
  statement: A request between agents shall be tracked in the A2A task states submitted, working, input-required, completed,
    failed, rejected or canceled until it ends, and shall appear in the sender's and the receiver's context pack until then.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17, SN-13]
  sources: [DEC-15, 'A2A protocol v1.0 (Linux Foundation, 2026)']
  rationale: A2A v1.0 has no expired state; an expired request is canceled with the reason expired (SWM-50).
  acceptance: 'Test: an open request is in both context packs on every run until it is completed; it survives a restart.'
  verify:
    method: test
    by: ['tests/test_swarm_board.py::test_a_request_is_tracked_until_it_ends_and_expires_with_a_reason']
  trace: [images/swarm/ledger.py]
