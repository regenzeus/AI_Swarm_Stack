# The agent swarm: what it shall do before a line of it is written (DEC-15, DEC-21).
# Design: "AI Stack Agent Swarm: Design" (claude.ai artifact 18fPjMRbQnxSVikesY8w6M). Nothing here is built yet.
# planned = asked for by the owner or following from an approved need or constraint; proposed = a design choice
# that waits for his word. Every planned requirement carries its acceptance criterion and its rollout phase.
# Practice drawn on: A2A v1.0 (cards, messages, task states), MCP 2026-07-28 (stateless tools), OWASP Top 10 for
# Agentic Applications 2026 (ASI01-ASI10), the MAST multi-agent failure taxonomy, OpenTelemetry GenAI conventions,
# blackboard and event-sourcing patterns, Kanban (rank and limit work in progress), eval-driven development.
area: Agent swarm
prefix: SWM
phases: {0: Proof of the risky parts, 1: 'Ledger, registry and run contract', 2: 'Checker, scorecards and autonomy rules',
  3: Board and Chatroom, 4: 'Parallel work, wider review and the harness adapters', 5: 'Improvement loop: replay sets, the
    evaluation gate, the Coach'}
items:
- id: SWM-01
  group: Registry and identity
  phase: 1
  title: Every agent described in one place
  statement: Every agent shall be described once, as an agent card in config/agents.yaml, and its crew unit and timer, its
    gateway key with MCP grants, its Hermes profile settings, its Board contact and wake rules and its row on the Agents
    page shall be generated from that card.
  type: functional
  priority: must
  status: partial
  parents: [SN-17, SN-15]
  sources: [DEC-15, 'design: AI Stack Agent Swarm (claude.ai artifact 18fPjMRbQnxSVikesY8w6M)']
  rationale: Today an agent is wired in up to five places (crew.py, keys.sh, Hermes config, systemd units, the app), which
    is how the shared vk-mission key (FND-03) happened unnoticed.
  acceptance: 'Test: a sample agents.yaml generates every derived file; the checks fail when a unit, key grant or profile
    in the repo differs from what the file generates.'
  verify:
    method: test
    by: ['tests/test_registry.py::test_the_repo_cards_pass_the_registry_check', 'tests/test_registry.py::test_a_shared_key_and_extra_grants_are_refused']
  trace: [config/agents.yaml, ops/registry.py]
  gap: The cards exist and the checks fail on drift from keys and units; the units, Hermes profiles and the Agents page
    are not generated from them yet.
- id: SWM-22
  group: Registry and identity
  phase: 1
  title: A card states the agent's job
  statement: An agent card shall name the agent's id, purpose, responsibilities, owned artifact kinds with a definition
    of done for each, harness, model, key, schedule, roles, rooms, contact policy, wake policy, budgets, tools and autonomy,
    and the checks shall refuse a card that misses one or names an unknown harness, model, tool, role or room.
  type: interface
  priority: must
  status: implemented
  parents: [SN-17, SN-15]
  sources: [DEC-15, 'MAST failure taxonomy (Cemri et al., arXiv 2503.13657)', 'A2A protocol v1.0 (Linux Foundation, 2026)']
  rationale: Specification failures (unclear role, unclear task, no termination condition) are the largest of MAST's three
    failure categories; the card makes each agent's job explicit. The fields map onto an A2A AgentCard (name, description,
    skills) plus the stack's own.
  acceptance: 'Test: a card missing each field in turn, and a card naming an unknown value of each kind, are refused with
    the field named.'
  verify:
    method: test
    by: ['tests/test_registry.py::test_a_card_missing_a_field_or_naming_unknown_values_is_refused']
  trace: [config/agents.yaml, ops/registry.py]
- id: SWM-23
  group: Registry and identity
  phase: 1
  title: One identity per agent
  statement: Each agent shall have its own gateway key and its own swarm token, no key or token shall be listed by two cards,
    and the Swarm service shall take the actor of every event and the sender of every message from the token of the call,
    never from its arguments.
  type: functional
  priority: must
  status: implemented
  parents: [SN-05, SN-07, SEC-07]
  sources: [DEC-15, OWASP Top 10 for Agentic Applications 2026 ASI03 identity and privilege abuse]
  rationale: 'Phase 0 (docs/SWARM-PHASE0.md): the gateway''s per-user BYOK credentials carry each agent''s own token to
    an MCP server; a key needs a LiteLLM user for it, so phase 1 gives every agent one.'
  verify:
    method: test
    by: ['tests/test_swarm_service.py::test_identity_comes_only_from_the_stored_credential', 'tests/test_registry.py::test_a_shared_key_and_extra_grants_are_refused',
      'tests/test_swarm_phase4.py::test_no_agent_config_or_environment_holds_a_swarm_token']
  trace: [images/swarm/swarm.py, ops/registry.py, ops/swarm_setup.py]
  findings: [FND-03]
- id: SWM-24
  group: Registry and identity
  phase: 1
  title: Least privilege from the card
  statement: Each agent's gateway key shall grant exactly the MCP servers and swarm tools its card lists, and the checks
    shall refuse a key grant that no card lists.
  type: constraint
  priority: must
  status: implemented
  parents: [SN-05, SEC-07]
  sources: [DEC-15, OWASP Top 10 for Agentic Applications 2026 ASI02 tool misuse]
  acceptance: 'Test: the key grants generated from a sample card equal its tool list; an extra grant in ops/keys.sh fails
    the checks.'
  verify:
    method: test
    by: ['tests/test_registry.py::test_a_shared_key_and_extra_grants_are_refused', 'tests/test_registry.py::test_the_repo_cards_pass_the_registry_check']
  trace: [ops/registry.py]
- id: SWM-89
  group: Registry and identity
  phase: 1
  title: Swarm tokens stay in the gateway
  statement: Each agent's swarm token shall be stored only as the agent's per-user credential in the gateway, never in an
    agent's environment, configuration or prompt, and the Swarm service shall take a caller's identity only from that stored
    credential and refuse a call that carries a client-supplied credential header.
  type: constraint
  priority: must
  status: implemented
  parents: [SN-05, SWM-23]
  sources: [DEC-15, docs/SWARM-PHASE0.md]
  rationale: Phase 0 found that a credential header sent by the client replaces the stored one, so an agent that knew another
    agent's token could act as that agent; agents therefore never see tokens.
  verify:
    method: test
    by: ['tests/test_swarm_service.py::test_identity_comes_only_from_the_stored_credential', 'tests/test_swarm_phase4.py::test_no_agent_config_or_environment_holds_a_swarm_token']
  trace: [images/swarm/swarm.py, ops/swarm_setup.py, ops/update-keys.py]
  findings: [FND-32]
- id: SWM-25
  group: Registry and identity
  phase: 1
  title: Each run names the card it ran with
  statement: Every agent run shall record the content hash of the card it ran with in its run manifest, so that the run
    view names what changed in the card since the agent's previous run.
  type: functional
  priority: must
  status: implemented
  parents: [SN-07, OBS-08]
  sources: [DEC-15, DEC-05]
  acceptance: 'Test: two runs with different cards show the changed fields in the second run''s drift line.'
  verify:
    method: test
    by: ['tests/test_registry.py::test_the_card_hash_changes_with_any_field', 'tests/test_registry.py::test_a_run_names_its_card_and_the_next_run_shows_a_change']
  trace: [ops/registry.py, ops/crew.py, ops/missions.py, images/mission-control/runrecord.py]
- id: SWM-26
  group: Registry and identity
  phase: 1
  title: Pause any agent, a role or the whole swarm
  statement: When the owner pauses an agent, a role or the whole swarm in Mission Control, the Swarm service shall refuse
    the paused agents' swarm tool calls and the runner shall start none of their runs within 60 seconds, until the owner
    resumes them.
  type: functional
  priority: must
  status: implemented
  parents: [SN-05, SN-11]
  sources: [DEC-15, OWASP Top 10 for Agentic Applications 2026 ASI10 rogue agents]
  acceptance: 'Test: after a pause, a swarm tool call from the agent is refused and a due timer run is skipped with the
    reason paused; demonstration on the phone.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_paused_agents_are_refused', 'tests/test_swarm_client.py::test_the_owner_pauses_and_resumes_agents_from_the_app',
      'tests/test_runner.py::test_a_paused_agents_runs_are_skipped']
  trace: [images/swarm/ledger.py, ops/swarm_client.py, ops/missions.py, ops/crew.py, ops/improve.py, images/mission-control/web/static/app.js]
- id: SWM-27
  group: Registry and identity
  phase: 4
  title: Agent cards in the A2A format
  statement: The Registry shall serve each card as an A2A v1.0 AgentCard document, on the Docker network only.
  type: interface
  priority: could
  status: implemented
  parents: [SN-17, CST-04]
  sources: [DEC-15, 'A2A protocol v1.0 (Linux Foundation, 2026)', DEC-25]
  verify:
    method: test
    by: ['tests/test_swarm_phase4.py::test_each_card_is_an_a2a_agent_card_on_the_internal_network']
  trace: [images/swarm/ledger.py, images/swarm/swarm.py]
- id: SWM-02
  group: Harnesses and models
  phase: 4
  title: Different harnesses and models
  statement: An agent shall run on any of the harnesses Hermes profile, Claude Code, OpenCode, Python job or script without
    a model, with any model the gateway serves or the Claude subscription, when only its card changes.
  type: functional
  priority: must
  status: planned
  parents: [SN-17, CST-02]
  sources: [DEC-15, DEC-16]
  acceptance: 'Test: changing a sample card''s harness changes only the generated unit and adapter; the adapter conformance
    suite (SWM-28) passes for each harness.'
- id: SWM-28
  group: Harnesses and models
  phase: 4
  title: One adapter contract, tested for every harness
  statement: Each harness adapter shall give its agent the swarm tools, run the start and finish steps of the run contract
    and start the agent when it is woken, and one conformance test suite shall run against every adapter.
  type: interface
  priority: must
  status: partial
  parents: [SN-17, SN-15]
  sources: [DEC-15, 'design: AI Stack Agent Swarm (claude.ai artifact 18fPjMRbQnxSVikesY8w6M)']
  verify:
    method: test
    by: ['tests/test_swarm_phase4.py::test_a_wake_waits_out_the_usage_limit_and_a_hermes_agent_gets_one_turn', 'tests/test_swarm_phase4.py::test_a_woken_crew_agent_answers_its_requests_with_its_model',
      'tests/test_swarm_phase4.py::test_a_finish_is_checked_first_and_a_run_without_one_is_a_health_note']
  gap: The Hermes adapter (one turn through the running Hermes, ending with swarm_finish), the Claude Code crew (answers
    from its model, start and finish recorded by crew.py) and script agents (declined at once) are covered; OpenCode has
    no adapter yet.
  trace: [ops/swarm_client.py, ops/crew.py]
- id: SWM-29
  group: Harnesses and models
  phase: 1
  title: Subscription and local models only
  statement: A card shall name only a model the gateway serves under CST-02, the owner's Claude subscription or a local
    Ollama model, and the checks shall refuse any other.
  type: constraint
  priority: must
  status: implemented
  parents: [CST-02, SN-03]
  sources: [DEC-01, DEC-16]
  acceptance: 'Test: a card naming a paid API model is refused.'
  verify:
    method: test
    by: ['tests/test_registry.py::test_paid_models_are_refused']
  trace: [ops/registry.py]
- id: SWM-03
  group: Ledger
  phase: 1
  title: One artifact model with a lasting identity
  statement: Every agent-produced artifact (idea, finding, report, wiki page, purchase, build, agent change, requirement)
    shall be one Ledger record with a kind, an identity key unique per kind, versions, an evidence log, links, watchers
    and references to outside records.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17, SN-16]
  sources: [DEC-15, DEC-10, 'design: AI Stack Agent Swarm (claude.ai artifact 18fPjMRbQnxSVikesY8w6M)']
  acceptance: 'Test: an artifact of each kind is created, versioned, linked and watched through the same tools.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_history_is_append_only_and_rebuilds_the_state', 'tests/test_swarm_ledger.py::test_kinds_are_data_not_code']
  trace: [images/swarm/ledger.py]
  findings: [FND-24]
  rationale: Builds and purchases keep their own stores, where the owner's approvals and money rules live (SWM-69); the
    Ledger links them to their ideas by ref (build:<id>).
- id: SWM-30
  group: Ledger
  phase: 1
  title: History is append-only
  statement: Every Ledger change shall be stored as an append-only event with actor, run id, time, sequence number, reason
    and evidence, the current state of an artifact shall be derived from its events, and no event shall be changed or deleted.
  type: quality
  priority: must
  status: implemented
  parents: [SN-07, SN-09]
  sources: [DEC-15, event sourcing]
  rationale: Audit, replay for the improvement loop (SWM-82) and restart safety (SWM-19) all need the full history, not
    the latest row.
  acceptance: 'Test: replaying an artifact''s events rebuilds its stored state; the database refuses an update or delete
    of an event (trigger).'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_history_is_append_only_and_rebuilds_the_state']
  trace: [images/swarm/ledger.py]
- id: SWM-31
  group: Ledger
  phase: 1
  title: Retried writes take effect once
  statement: Every Ledger write shall carry an idempotency key, and a write repeated with the same key shall return the
    first result and change nothing.
  type: quality
  priority: must
  status: implemented
  parents: [SN-13]
  sources: [DEC-15, Hermes Kanban idempotency keys]
  acceptance: 'Test: the same upsert sent twice leaves one version and one event.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_retried_writes_take_effect_once']
  trace: [images/swarm/ledger.py]
- id: SWM-32
  group: Ledger
  phase: 1
  title: No lost updates between agents
  statement: A Ledger update shall name the version it was based on, and the Swarm service shall refuse an update based
    on an older version with the current version, so that the agent can merge and retry.
  type: quality
  priority: must
  status: implemented
  parents: [SN-17]
  sources: [DEC-15, optimistic concurrency control]
  acceptance: 'Test: two agents update the same artifact from version 3; the second is refused and receives version 4.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_a_stale_update_is_refused_with_the_current_version']
  trace: [images/swarm/ledger.py]
- id: SWM-33
  group: Ledger
  phase: 1
  title: Look up before writing
  statement: When an agent creates an artifact whose key already exists, the Ledger shall apply it as an update of the existing
    artifact; when the TF-IDF cosine similarity of a new artifact's text to an open artifact of the same kind reaches the
    calibrated threshold (0.20 on the owner's triage of 2026-10-29), the Ledger shall refuse the create unless the agent
    links it as different with a reason.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17, SN-02]
  sources: [DEC-10, DEC-15]
  rationale: 7 of 26 ideas on 2026-10-29 were reworded duplicates that title matching missed. Phase 0 measured TF-IDF (AUC
    0.992, 7 of 7 nearest neighbours right) as good as embeddings (0.993, 7 of 7) on that triage, at no memory cost; the
    threshold catches every known duplicate and is recalibrated on the Ledger's own merges.
  acceptance: 'Test: a reworded idea with the same key updates the existing one; a reworded idea with a new key above the
    threshold is refused with the similar artifact named; the calibration set catches all 17 known pairs.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_the_same_key_updates_and_a_similar_new_one_is_refused', 'tests/test_swarm_client.py::test_the_migration_report_names_what_the_guard_would_have_refused']
  trace: [images/swarm/ledger.py]
  findings: [FND-26]
- id: SWM-09
  group: Ledger
  phase: 1
  title: Agents see each other's artifacts
  statement: Every agent shall be able to search, read, link and watch every other agent's artifacts, within the information-flow
    rules of SWM-67.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17]
  sources: [DEC-15]
  findings: [FND-22]
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_private_artifacts_never_reach_an_agent_with_a_way_out', 'tests/test_swarm_phase4.py::test_the_builders_prompt_lists_the_finding_the_doctor_linked_to_its_idea']
  trace: [images/swarm/ledger.py, images/swarm/swarm.py, ops/builds.py]
- id: SWM-34
  group: Ledger
  phase: 1
  title: Watchers hear of every change
  statement: When a watched artifact changes, the Swarm service shall put the change into each watcher's next context pack,
    and into the owner's Chatroom feed when he watches it.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17]
  sources: [DEC-15]
  acceptance: 'Test: an agent watching an artifact finds its new version in its next context pack, once.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_watchers_see_changes_once']
  trace: [images/swarm/ledger.py]
- id: SWM-35
  group: Ledger
  phase: 1
  title: One store per artifact
  statement: When a kind moves into the Ledger, its existing records shall be migrated with their history in one step, and
    in the same phase the old writer shall be removed, so that no artifact is written in two stores.
  type: constraint
  priority: must
  status: implemented
  parents: [SN-16, SN-09]
  sources: [DEC-15, DEC-10]
  acceptance: 'Inspection: after phase 1, nothing writes the proposals table or the crew finding files; a test migrates
    a copy of missions.sqlite and finds every proposal with its decisions.'
  verify:
    method: test
    by: ['tests/test_improve.py::test_accept_creates_a_build_and_dismiss_becomes_a_lesson', 'tests/test_swarm_client.py::test_the_migration_imports_ideas_and_the_owners_decisions',
      'tests/test_swarm_client.py::test_the_migration_imports_ideas_and_the_owners_decisions', 'tests/test_swarm_ledger.py::test_the_migration_import_is_for_the_system_only']
  trace: [ops/crew.py, ops/doctor.py, ops/improve.py, ops/swarm_client.py]
  findings: [FND-24, FND-12]
- id: SWM-36
  group: Ledger
  phase: 1
  title: Nothing is lost from the record
  statement: Ledger events and Board messages shall be kept for at least 365 days and included in the nightly backup, and
    none shall be deleted before then.
  type: quality
  priority: must
  status: implemented
  parents: [SN-09]
  sources: [DEC-15]
  acceptance: 'Inspection: the swarm database lies under /srv/ai and is in the backup set; the restore rehearsal restores
    it.'
  verify:
    method: test
    by: ['tests/test_swarm_service.py::test_the_snapshot_is_a_consistent_copy',
      'tests/test_swarm_service.py::test_the_restore_drill_opens_the_swarm_snapshot_and_counts_its_record']
  trace: [images/swarm/swarm.py, ops/backup.sh, ops/restore.sh, ops/restore_check.py]
- id: SWM-04
  group: Lifecycle
  phase: 1
  title: The generic lifecycle
  statement: Every artifact shall move through draft, open, ready, active, checking and done, with the side states blocked,
    snoozed, declined, merged and gone, and every state other than merged shall be able to return to open with a reason.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17]
  sources: [DEC-10, DEC-15]
  rationale: 'Merged keeps its pointer to the target; reopening means reopening the target. The owner may also mark an artifact
    gone: "already done by hand" is gone, not declined (2026-10-29).'
  acceptance: 'Test: every allowed transition succeeds and every other is refused (SWM-37).'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_every_transition_follows_the_table', 'tests/test_swarm_ledger.py::test_merging_moves_the_evidence_to_the_target']
  trace: [images/swarm/ledger.py]
- id: SWM-37
  group: Lifecycle
  phase: 1
  title: Transitions are data, refusals are explained
  statement: The allowed transitions shall be one table of state, next state and actor class in the Swarm service, and every
    refused transition shall return the rule that refused it.
  type: quality
  priority: must
  status: implemented
  parents: [SN-17, SN-15]
  sources: [DEC-15]
  acceptance: 'Test: one test per row of the table, and one refused move per actor class with its reason.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_every_transition_follows_the_table']
  trace: [images/swarm/ledger.py]
- id: SWM-06
  group: Lifecycle
  phase: 1
  title: Who may move which state
  statement: Agents shall be able to create, refine, link, merge, block, reopen and mark gone; only the owner, or an autonomy
    rule he enabled (SWM-42), shall move an artifact to active, decline or snooze it; only the Checker shall move it to
    done.
  type: constraint
  priority: must
  status: implemented
  parents: [SN-05, SN-02]
  sources: [DEC-15, DEC-19]
  acceptance: 'Test: an agent''s move to active, declined, snoozed or done is refused; the owner''s and the Checker''s succeed.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_agents_cannot_approve_decline_snooze_or_finish', 'tests/test_swarm_ledger.py::test_every_transition_follows_the_table']
  trace: [images/swarm/ledger.py]
- id: SWM-38
  group: Lifecycle
  phase: 1
  title: A definition of ready per kind
  statement: The Swarm service shall refuse an agent's move of an artifact to ready unless it meets its kind's definition
    of ready; for an idea that is a problem statement, at least two evidence entries or one health alert, a plan naming
    files and a test, a success check (SWM-44) and a confidence of medium or high.
  type: functional
  priority: must
  status: implemented
  parents: [SN-02, SN-08]
  sources: [DEC-15, 'design: AI Stack Agent Swarm (claude.ai artifact 18fPjMRbQnxSVikesY8w6M)']
  acceptance: 'Test: an idea missing each part in turn cannot become ready; a complete one can.'
  verify:
    method: test
    by: ['tests/test_swarm_ledger.py::test_definition_of_ready_for_an_idea']
  trace: [images/swarm/ledger.py]
  rationale: The definition gates an agent's claim; the owner's Build it is his own judgement (DEC-22).
- id: SWM-05
  group: Lifecycle
  phase: 1
  title: Agents refine and reopen over many runs
  statement: Before writing, an agent shall look up the artifact by key and similarity and update, merge or reopen it with
    new evidence and a new plan version instead of creating a copy.
  type: functional
  priority: must
  status: implemented
  parents: [SN-17, SN-02]
  sources: [DEC-10]
  acceptance: 'Test: three doctor runs on the same issue leave one artifact with three evidence entries and plan version
    3.'
  verify:
    method: test
    by: ['tests/test_improve.py::test_no_caps_and_a_known_problem_is_refined_not_copied', 'tests/test_improve.py::test_scan_turns_signals_into_ideas_and_refines_a_known_one',
      'tests/test_swarm_ledger.py::test_the_same_key_updates_and_a_similar_new_one_is_refused']
  trace: [images/swarm/ledger.py, ops/crew.py, ops/improve.py, ops/swarm_client.py]
- id: SWM-39
  group: Lifecycle
  phase: 1
  title: A declined artifact returns only with news
  statement: If an agent reopens a declined artifact, then the Swarm service shall require evidence dated after the decline
    and show the artifact to the owner as reopened with that evidence.
  type: functional
  priority: must
  status: implemented
  parents: [SN-02, SN-18]
  sources: [DEC-10, DEC-15]
  acceptance: 'Test: a reopen of a declined idea without newer evidence is refused; with newer evidence it shows on Home
    with the reason.'
  verify:
    method: test
    by: ['tests/test_improve.py::test_no_caps_and_a_known_problem_is_refined_not_copied', 'tests/test_swarm_ledger.py::test_a_declined_artifact_returns_only_with_newer_evidence']
  trace: [images/swarm/ledger.py]
  rationale: 'A near-copy of a declined idea is compared too: it becomes a sighting on the declined idea, which stays declined,
    so what the owner said no to is not proposed again in new words (2026-10-29: the test agent''s #30 restated #11).'
- id: SWM-08
  group: Lifecycle
  phase: 1
  title: Ranking instead of caps
  statement: Open and ready artifacts shall be ranked by priority = impact x confidence x (1 + log2(1 + recurrences in 30
    days)) / effort, with the owner's pins on top, and the backlog shall not be capped.
  type: functional
  priority: must
  status: implemented
  parents: [SN-02, SN-17]
  sources: [DEC-10]
  acceptance: 'Test: the ranking of a sample backlog matches the formula; a pinned artifact ranks first; creating the 50th
