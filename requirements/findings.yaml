    status: fixed
    resolved: "fix/phone-control, 2026-11-02: shopping.to_phone (0644) for shop_look and shop_open; phone.take skips and
      reports what it cannot read or delete; the stuck request moved aside and the phone reconnected at 16:55. The alert for
