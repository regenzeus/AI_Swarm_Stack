  - id: FND-29
    severity: medium
    kind: defect
    title: The price watch repeats a reached target as news
    finding: "On 2026-10-29 the speaker's price stayed at 68.61 EUR, under the 69 EUR target. Every price reading
      proposed again, each run said 'wait, sold out', and Telegram got ten messages (10:18 to 19:32). The 6-hour timer
