# Findings: contradictions, incoherent parts and drift between the owner's decisions, the docs, the guide, the code
# and these requirements. Found during the requirements engineering of 2026-10-29. Each has evidence (file:line or a
# measured fact), the requirements it affects, a recommendation, and a status:
#   open            not resolved; `decision: true` when it needs the owner
#   fixed           resolved in the commit named in `resolved`
#   accepted        the owner accepted it as a known risk (docs/SECURITY.md)
area: Findings
prefix: FND
items:
  - id: FND-01
    severity: high
    kind: contradiction
    title: The phone check still expects the screen to stay awake
    finding: Since DEC-08 the AI phone's screen sleeps after 30 s, but the phone check fails when the screen is not
      awake ("the wake loop is not working"), so it raises a false alert every week; the guide still tells the owner to
      switch on Stay awake and says the screen stays on while connected.
    evidence: ["ops/phone_agents.py:266-268 (mWakefulness != Awake is a fault)", "ops/phone_agents.py:12-14 (docstring)", "images/mission-control/guide/17-ai-phone.md: 'The screen stays on while the AI phone is connected'", "images/mission-control/guide/18-crew.md: Phone check 'the screen-awake loop'", "images/phone/phone.py let_screen_sleep()"]
    affects: [CRW-12, PHN-13, APP-14]
    recommendation: Drop the awake check (report the screen state only), and correct the guide's phone and crew chapters.
    status: fixed
    resolved: feat/requirements, 2026-10-29 (docs and the phone check aligned with the requirements)
  - id: FND-02
    severity: high
    kind: incoherence
    title: Hermes main has a way out through the AI phone
    finding: The security model keeps untrusted input, private data and a way out apart, and says Hermes' only way out is
      e-mail to the owner. Hermes main holds the vault, memory and Gmail read, reads research results, mail bodies and
      phone screens, and also has phone_url, phone_type and phone_open on an internet-connected phone. Inside a time
      window the owner opened ("Until I stop it"), those run without asking, so injected text could make Hermes open a
      URL carrying private data.
    evidence: ["ops/keys.sh: vk-main grants qmd, research, mail, phone", "docs/SECURITY.md trifecta table and accepted risks (the phone is not mentioned)", "images/mission-control/guide/14-safety.md: Hermes 'Way out: only to you'", "images/phone/phone.py guard(): a time window covers phone_url and phone_type"]
    affects: [SEC-04, PHN-02]
    recommendation: Decide one of (a) phone_url, phone_type and phone_open always ask like money, (b) a time window does
      not cover them after the session read mail or research results, (c) accept it as a known risk in SECURITY.md.
      (a) is the safest and costs a tap per URL or text.
    status: fixed
    resolved: "feat/swarm-phase3, 2026-10-29 (DEC-23: typing, URLs and apps always ask; tests/test_phone.py)"
    decision: true
  - id: FND-03
    severity: medium
    kind: incoherence
    title: One key, many agents
    finding: '"One key per agent" is the least-privilege rule and the basis of cost per run, but vk-mission is used by
      mission runs and by six background jobs. The inbox digest therefore holds the mission grants (qmd, research,
      claude, mail), and a task run''s cost window includes journal entries, wiki summaries or the self-review that ran
      at the same time.'
    evidence: ["ops/inbox.py:44,108", "ops/improve.py:213", "ops/crew.py:799", "ops/journal.py:336,444", "ops/wikis.py:83", "ops/shopping.py:6", "docs/MISSION-CONTROL.md: 'a run's calls are exactly its key's calls in that window'"]
    affects: [SEC-07, MIS-16, SWM-23]
    recommendation: Give each background job its own key with only the grants it needs (vk-crew for model-only jobs,
      vk-inbox with mail only), generated from config/agents.yaml once the swarm registry exists (SWM-01).
    status: fixed
    resolved: feat/swarm-phase0, 2026-10-29 (vk-review, vk-inbox, vk-memory, vk-journal, vk-wikis; a test keeps vk-mission to mission runs)
  - id: FND-04
    severity: medium
    kind: contradiction
    title: A second, undocumented delivery path
    finding: The invariant says only the host runner merges and deploys, after the owner's tap, with review and green CI.
      Most changes so far were landed by interactive Claude Code sessions instead, under a chat approval. They
      fast-forward main from a worktree, push, and run ops/deploy.py directly, serialised only by a flock convention.
      That path has no AI review, CI runs only after the deploy, and nothing records the deploy in Mission Control.
      (ops/deploy.py holds its own lock since 2026-10-29, PLT-10.)
    evidence: ["AGENTS.md: Architecture invariants", "docs/DOGFOOD.md: 'parallel sessions used ~/.aistack-land.lock by convention'", "ops/deploy.py: no flock until 2026-10-29", "git log: 9b1ef1d, 96b0912, a87f69e landed this way on 2026-10-29", "2026-10-29: 10607d9 landed by a session with a failing test (its script did not stop on the checks; 679a0ce fixed it)", "2026-10-29: a session deploy printed RESTART_RUNNER, nothing restarted the runner, and the owner's Pause ran on old code until a manual restart"]
    affects: [CST-07, PLT-10, BLD-20]
    recommendation: Make the path explicit (BLD-20), record every deploy as an activity
      event with its source, and run ops/check.sh before landing (sessions already do, by habit only).
    status: fixed
    resolved: "feat/swarm-switch, 2026-10-29 (ops/land.sh: checks on the landing commit, both locks, runner restart, deploys recorded with their source, an activity event with the approval)"
    decision: true
  - id: FND-05
