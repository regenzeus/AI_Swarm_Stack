  - id: FND-116
    title: One unreadable request stopped the AI phone for a day
    finding: "At 08:20 on 2 Nov the RAM upgrade's shopping agent asked the AI phone to look the kit up in the Amazon app.
      It wrote the request with the helper it uses for proposals and purchase approvals, readable by its own user only;
      the phone's service runs as another user, could not read it, and its control loop read every request inside one
      error handler, so each pass stopped there: the phone stayed disconnected, did nothing and kept no state for
