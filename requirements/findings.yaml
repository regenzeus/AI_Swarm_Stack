  - id: FND-10
    severity: medium
    kind: defect
    title: The scout's web search package is not where the scout looks
    finding: ddgs is installed into /opt/hermes/.venv, but the scout profile runs another interpreter and logs "ddgs
      package is not installed" (540 times in 2 days), so web search takes a slower fallback. Found by the health
      doctor (proposal 27).
    evidence: ["images/hermes/Dockerfile:7", "config/hermes/configure-scout.sh:28", "docker logs aistack-hermes-1 --since 48h: 540 lines"]
    affects: [RES-02]
    recommendation: Build proposal 27 (install into the interpreter Hermes uses, or point the search backend at it).
    status: fixed
