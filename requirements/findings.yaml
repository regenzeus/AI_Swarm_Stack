  - id: FND-62
    title: The health board's notes were mostly false alarms
    finding: "28 of the board's 30 issues were notes, nearly all from two checks that misjudged valid calls. swarm_context
      takes only optional arguments, so {} is a correct call, yet obs_core.problems() reported it as called without
      arguments, and telemetry.py counted every {} call as arrived without arguments (gateway problem; run make
      probe-tools). The partial-read note fired on every run that fetched a long page, even when the agent read on."
    evidence: ["/api/state health on 2026-10-30 (30 items with issues)", "images/mission-control/obs_core.py:306", "ops/telemetry.py:182"]
    severity: medium
    kind: defect
    affects: [OBS-07, OBS-10]
    recommendation: Judge an empty call against the tool's own arguments (one list, checked against every tool), and count a cut-off only when nothing read on.
    status: fixed
    resolved: "fix/health-signals, 2026-10-30: obs_core.NO_ARGS and empty_call(), unfollowed_cuts(); telemetry uses empty_call"
