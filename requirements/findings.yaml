  - id: FND-90
    title: The first trial failed in 3 minutes on a builder step that only planned
    finding: "Trial semver (1 Nov 2026, task #88): the intake split the coding work into three builder steps (read the
      spec and plan; implement with tests; run the tests and fix). Each builder step is a build, a build that commits
      nothing fails, so the first step failed although the builder mapped every rule of the specification to tests and
      named its traps; its retry (build #12) did the same and the task failed. The third step would have failed the same
      way whenever its tests already passed. The harness also lost the builds' numbers (a failed step's retry keeps only
      the newest) and reported none."
    evidence: ["/srv/vault/trials/semver/semver-20261101-1128.md", "builds #11 and #12: 'the builder made no commit'", "task_steps of task 88"]
    severity: high
    kind: defect
    affects: [TRL-10, TRL-06]
    recommendation: Consecutive builder steps become one build with stages; the harness finds a trial's builds by its repository.
    status: fixed
    resolved: "feat/trials, 2026-11-01: ops/conductor.py fold_builders(); ops/trials.py build_ids(repo); tests/test_conductor.py"
