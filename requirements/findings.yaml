      (/opt/data/installs/..., for the anthropic extra); a launch then uses only that environment and drops the image's
      .venv, where the Dockerfile installs ddgs (searches had worked until then, the last ddgs result on 2026-10-27).
      configure-scout.sh now installs Hermes' own ddgs extra into its environment (tests/test_scout_search.py)"
