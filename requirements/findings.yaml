    evidence: ["docker stats 2026-10-29: aistack-qmd-1 738 MiB, aistack-hindsight-1 1.23 GiB, aistack-ollama-1 332 MiB",
      "design doc, 'The contract every agent run follows' (Ollama embeddings)"]
    affects: [SWM-33, SWM-74]
    recommendation: Use an embedding model that is already resident, chosen and measured in phase 0 (SWM-74, SWM-86).
    status: fixed
    resolved: feat/swarm-phase0, 2026-10-29 (TF-IDF finds the duplicates as well as embeddings, so no model is loaded; docs/SWARM-PHASE0.md)
