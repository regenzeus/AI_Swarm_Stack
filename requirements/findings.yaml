  - id: FND-22
    severity: high
    kind: incoherence
    title: Agents talking to each other would cross the trust boundaries
    finding: The security model keeps private data, untrusted content and ways out apart per agent (the scout reads
      the web and holds nothing private; Hermes main holds private data and has no way out). The swarm design lets
      every agent read every artifact and message every other agent. Private data could then travel from Hermes main
      to an agent with a way out (the scout's fetch and browser, the AI phone), and web content could reach Hermes
      main inside a message whose origin is an agent, not the web. The design's provenance tags say where content
      came from, but nothing stops private content from leaving.
    evidence: ["design doc, section 'Safety, security and cost guardrails' (provenance, no flow rule)",
      "requirements SEC-03, SEC-04, SEC-05", "ops/keys.sh: vk-scout grants fetch and browser, vk-main grants mail and phone"]
    affects: [SWM-09, SWM-10, SWM-15, SWM-67, SEC-04]
    recommendation: Information-flow labels on every message, evidence entry and artifact, carried into whatever is
      derived from them and enforced by the Swarm service when it delivers (SWM-67); room:all and artifact search
      respect the labels.
    status: open
  - id: FND-23
    severity: medium
    kind: contradiction
    title: The swarm would start jobs, which only the runner may do
    finding: The design wakes an agent by starting its unit (systemctl --user start crew-<id>), a Kanban task or a
      Claude task from the Swarm service. The invariant says only the runner (ops/missions.py on the host) runs jobs
      and validates every request, and a container cannot start the host's systemd units anyway.
    evidence: ["design doc, 'Delivery and waking' and the harness adapter table", "AGENTS.md: Architecture invariants",
      "requirements SEC-11, SEC-12"]
    affects: [SWM-13]
    recommendation: A wake is a request in the runner's inbox; the runner checks it against the card's wake policy and
      budget and starts the unit (SWM-13 says so).
    status: open
  - id: FND-24
    severity: medium
    kind: incoherence
    title: A second store for the same artifacts
    finding: Proposals, builds, Claude tasks and runs live in missions.sqlite, crew findings in crew JSON files and
      purchase proposals as files. The design adds a Ledger with its own database and migrates them, but does not say
      when the old stores and their writers stop. Two stores of the same thing drift apart, as the docs and the code
      did (FND-05 to FND-09).
    evidence: ["/srv/ai/missions/missions.sqlite tables builds, claude_tasks, proposals, runs",
      "design doc, rollout phase 1 ('migrate in as artifacts')"]
    affects: [SWM-03, SWM-35]
    recommendation: Migrate one kind at a time in one step and remove its old writer in the same phase (SWM-35), after
      a shadow week (SWM-87).
    status: fixed
    resolved: "feat/swarm-switch, 2026-10-29 (ideas live only in the Ledger; the proposals table is read-only history; builds and purchases keep their approval stores and are linked by ref)"
  - id: FND-25
    severity: medium
    kind: incoherence
    title: The Claude Code agents are invisible to the gateway's records
    finding: The design takes cost from LiteLLM spend per key and replay sets from Phoenix traces, and MIS-16 takes cost
      per run from the gateway's records. The builder, the health doctor, the maintainability review and Claude tasks
      run Claude Code on the subscription outside the gateway, so neither LiteLLM nor Phoenix has their calls, and
      their scorecards, replay sets and cost would be empty.
    evidence: ["requirement CST-02 (Claude Code runs outside the gateway)", "requirement MIS-16 (partial)",
      "design doc, 'Scorecards' (cost from LiteLLM spend per key)"]
    affects: [SWM-17, SWM-79, SWM-81, SWM-82, MIS-16]
    recommendation: The run contract records each run's inputs and usage itself (Claude Code's JSON result carries
      usage), and Claude Code's OpenTelemetry export is pointed at Phoenix.
    status: fixed
    resolved: "feat/swarm-switch, 2026-10-29 (Claude Code runs go to Phoenix as traces from the runtime record, which already holds their tokens per model call)"
  - id: FND-26
    severity: low
    kind: risk
    title: A third embedding model
    finding: The design's duplicate guard uses embeddings from Ollama, while qmd already keeps embedding models loaded
      (738 MB resident on 2026-10-29) and Hindsight embeds for recall (1.2 GB). Loading another model adds memory to a
      stack that already breaks its memory budget (CST-14).
    evidence: ["docker stats 2026-10-29: aistack-qmd-1 738 MiB, aistack-hindsight-1 1.23 GiB, aistack-ollama-1 332 MiB",
      "design doc, 'The contract every agent run follows' (Ollama embeddings)"]
    affects: [SWM-33, SWM-74]
    recommendation: Use an embedding model that is already resident, chosen and measured in phase 0 (SWM-74, SWM-86).
    status: fixed
    resolved: feat/swarm-phase0, 2026-10-29 (TF-IDF finds the duplicates as well as embeddings, so no model is loaded; docs/SWARM-PHASE0.md)
