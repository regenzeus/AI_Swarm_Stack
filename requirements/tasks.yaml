  verify: {method: test, by: ['tests/test_factory_app.py::test_every_workflow_is_in_one_list_grouped_by_factory_and_area']}
  parents: [SN-02, SN-19]
  sources: ['owner 2026-11-11: I didnt like this rule to begin with. Does it actually make sense to use that split? It just needlessly bisects and makes overview difficult. Can you design this properly and make these exceptions not be exceptions anymore? I want the app to show me whats going on in stack.', DEC-46]
