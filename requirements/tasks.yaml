  priority: must
  status: implemented
  parents: [SN-20, SN-19]
  sources: [docs/SWARM-ROADMAP.md]
  acceptance: 'Test: two matching events within the cooldown start one task; a rule with the model check skips an event the
    check rejects; every firing names its event.'
  verify: {method: test, by: ['tests/test_events.py::test_a_rule_waits_out_its_cooldown_runs_its_check_and_records_every_firing',
    'tests/test_events.py::test_rules_are_checked_when_saved_and_a_time_is_no_source']}
  trace: [ops/events.py, prompts/intake.md, images/mission-control/web/static/app.js]
