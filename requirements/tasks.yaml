    n8n workflow's, WFL-09), once per duty and following the schedule when it changes.
  type: functional
  priority: should
  status: implemented
  parents: [SN-07, SN-08]
  sources: [DEC-46, "owner 2026-11-08: I feel like these should just be a special kind of tasks."]
  acceptance: 'Test: every duty becomes one task of the stack''s, with its schedule; a changed schedule follows.'
  verify: {method: test, by: ['tests/test_tasks_tab.py::test_each_crew_duty_is_the_stack_s_repeating_task']}
  trace: [ops/tasks.py, ops/crew.py]
- id: TSK-43
  group: Everything is a task
  phase: 9
  title: Which agents worked on which task
  statement: The run record shall say which agents worked on which task in a period of 1, 7, 30 or 90 days, each run
    walked to the run its work started from and that named as a task (the Conductor's and its planning, a mission's run, a
    build, a question to Claude, a chat, a crew duty); the tools an agent used and the Conductor shall never count as
    agents, and the runs no task holds shall be counted apart.
  type: functional
  priority: must
  status: implemented
  parents: [SN-07, SN-17]
  sources: [DEC-46, "owner 2026-11-08: I want to see how tasks and agents connect. I want to see the mesh."]
  acceptance: 'Test: a change request''s steps under its intake run, a mission''s and a crew duty''s runs, a build, a
    question and a chat each name their task; the AI phone is a tool of the chat''s task; what no task holds is counted.'
  verify: {method: test, by: [tests/test_tasks_tab.py::test_no_map_cuts_a_name, tests/test_tasks_tab.py::test_the_network_shows_every_name_whole, tests/test_tasks_tab.py::test_a_tool_session_names_its_caller, 'tests/test_tasks_tab.py::test_the_network_names_each_run_s_task_and_keeps_tools_and_the_conductor_apart']}
  trace: [images/mission-control/runrecord.py, images/mission-control/server.py]
- id: TSK-44
  group: Everything is a task
  phase: 9
  title: New task keeps exactly what it was given
  statement: A task given in New task shall keep the kind (a cleanup included), the When (once, a schedule, an event with
    its triggers, after a task) and where its results go that the owner set, each exactly; whatever was not set the
    intake shall decide from the owner's words.
  type: functional
  priority: must
  status: implemented
  parents: [SN-19, SN-20]
  sources: [DEC-46]
  acceptance: 'Test: a cleanup on an event with e-mail keeps all three; an event without a trigger is refused with what to
    add; nothing set leaves it to the intake.'
  verify: {method: test, by: ['tests/test_tasks_tab.py::test_new_task_keeps_the_kind_the_when_and_the_delivery_it_was_given']}
  trace: [ops/tasks.py, images/mission-control/web/static/app.js]
- id: TSK-45
  group: Plan graph and durable steps
  phase: 2
  title: A code question's steps read the repository
  statement: Every step the intake plans for a code question shall go to an agent that reads the task's repository; a step
    it gave another agent shall go to the analyst, and the plan shall say why. The owner's own choice of agents stays.
  type: functional
  priority: must
  status: implemented
  parents: [SN-19]
  sources: [docs/SWARM-ROADMAP.md]
  acceptance: 'Test: a code question planned with a step on the assistant gets that step on the analyst, with the reason in the plan.'
  verify: {method: test, by: ['tests/test_tasks.py::test_a_code_questions_steps_go_to_agents_that_read_the_repository']}
  trace: [ops/tasks.py]
- id: TSK-46
  group: Everything is a task
  phase: 9
  title: A Claude task can be withdrawn, and up to four run side by side
  statement: The owner shall be able to cancel a Claude task (a queued one never starts, a running one stops at its next
    step), and a deployment may let up to four run side by side, each task run once.
  type: functional
  priority: should
  status: implemented
  parents: [SN-19]
  sources: [docs/PLATFORM.md]
  acceptance: 'Test: a cancelled queued task is never claimed, and two workers claim different tasks.'
  verify: {method: test, by: ['tests/test_claude_tasks.py::test_a_claude_task_can_be_cancelled_and_several_run_side_by_side_without_taking_the_same']}
  trace: [ops/claude_tasks.py, ops/missions.requests.py, images/mission-control/web/static/app-memory.js]
- id: TSK-47
  group: Everything is a task
  phase: 9
  title: Cancelling a task stops its work at its door
  statement: Cancelling a task that has started at its door shall stop the work there where that door can be stopped (a
    Claude task cancelled, a build not at work rejected, a mission paused) and otherwise say where to stop it.
  type: functional
  priority: should
  status: implemented
  parents: [SN-19]
  sources: [docs/SWARM-ROADMAP.md]
  acceptance: 'Test: cancelling a task at the Claude door cancels its Claude task, at the mission door pauses the mission, and a chat task says where to stop it.'
  verify: {method: test, by: ['tests/test_tasks.py::test_cancelling_a_task_stops_its_work_at_its_door']}
  trace: [ops/tasks.py]
- id: TSK-48
  group: Everything is a task
  phase: 9
  title: A code question about an older commit, with recent history
  statement: A code question may name a commit, tag or branch to read instead of main, and ask for up to 500 of its latest
    commits of history in the copy; the copy shall still have no way back to its source.
  type: functional
  priority: should
  status: implemented
  parents: [SN-19]
  sources: [docs/PLATFORM.md]
  acceptance: 'Test: a copy at an older commit with two commits of history shows exactly those two commits and no remote.'
  verify: {method: test, by: ['tests/test_claude_tasks.py::test_a_claude_task_may_copy_an_older_commit_and_bring_recent_history']}
  trace: [ops/claude_tasks.py, ops/tasks.py]

- id: TSK-49
  group: Plan graph and durable steps
  phase: 9
  title: Every step of a scheduled run covers one exact window
  statement: When the Conductor starts an occurrence of a task on a schedule, it shall give the occurrence one window, from
    its start back by the schedule's gap between its last two fires, in the time zone of the task's n8n workflow (else the
    runner's), and every step of that occurrence shall get the window in its prompt; the Topic Desk shall collect only what
    was published inside the window, state the window in the report, and put the reporting period in the e-mail's subject;
    an item shall count as seen only once a written report used it.
  type: functional
  priority: must
  status: implemented
  parents: [SN-19, SN-20]
  sources: [docs/SWARM-DESIGN.md]
  acceptance: 'Test: a weekly mon 08:00 run started at 08:00:04 on 9 Nov 2026 covers 2 Nov 08:00 to 9 Nov 08:00 (Europe/Berlin)
    in both scouts'' prompts, the desk''s collect and write steps and the subject; a Run now on Tuesday 15:41 covers the
    seven days before it; the desk keeps items inside the window only, marks seen only what the report used, and the
    report''s second line is the period.'
  verify: {method: test, by: ['tests/test_conductor.py::test_every_research_and_writing_step_of_a_scheduled_run_gets_one_exact_window',
    'tests/test_desk.py::test_a_run_s_window_decides_what_is_new_and_the_report_states_it',
    'tests/test_tasks.py::test_a_briefing_planned_with_a_number_of_days_names_its_run_s_window_instead']}
  trace: [ops/conductor.py, ops/n8n_jobs.py, ops/desk_steps.py, ops/desk.sh, images/desk/desk.py, ops/tasks.py, ops/missions.py]

- id: TSK-50
  group: Self-staffing
  phase: 9
  title: The judge reads only what a report can show
  statement: When the Checker judges a run, it shall check a point of the definition of done that names only when the
    task runs against the task's schedule (its n8n workflow, its switch and its runs) instead of the run's report, give
    the remaining points to the judge with the run's window, and show the judge the delivery's own record of each way
    (sent, failed, held or off, and the e-mail's subject); a delivery step shall say which way failed and tell the owner.
  type: quality
  priority: must
  status: implemented
  parents: [SN-07, SN-08]
  sources: [MIS-16, docs/SWARM-ROADMAP.md]
  acceptance: 'Test: "runs every Monday at 08:00, starting November 2, 2026" is met from a Monday 08:00 workflow whose first
    run started on 2 Nov, never sent to the judge; Friday 09:00 on a switched-off workflow is not met with each reason;
    the judge''s prompt holds the run''s window and the e-mail''s subject; a failed e-mail is said in the step''s answer
    and pushed.'
  verify: {method: test, by: ['tests/test_staffing.py::test_a_point_about_when_a_task_runs_is_checked_against_its_schedule_not_its_report',
    'tests/test_conductor.py::test_every_research_and_writing_step_of_a_scheduled_run_gets_one_exact_window']}
  trace: [ops/staffing.py, ops/desk_steps.py, ops/mission_extras.py]
