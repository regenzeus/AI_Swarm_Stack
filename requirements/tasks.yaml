- id: TSK-08
  group: Plan graph and durable steps
  phase: 2
  title: Steps start only with headroom
  statement: The Conductor shall start a step only when the PC has the memory its harness needs available (0.25 GB for a
    model call, 0.5 GB for a Hermes turn, 0.75 GB for Claude Code, by Windows' available memory) and the subscription the
    step uses is below its usage limit, and shall otherwise queue the step and show why it waits.
  type: quality
  priority: must
  status: implemented
  parents: [SN-13, CST-14]
  sources: [AST-12, docs/SWARM-ROADMAP.md]
  acceptance: 'Test: with available memory stubbed below a step''s need, the ready step stays queued with the reason shown,
    and starts when memory returns.'
  rationale: 'The first rule asked 1.5 GB free for every step and held the phase 2 gate at 0.7 GB while the owner played
    a game; a step asks for what its harness starts (owner, 31 Oct 2026: "You can make due with less RAM").'
  verify: {method: test, by: ['tests/test_conductor.py::test_a_step_starts_only_with_headroom_and_says_what_it_waits_for', tests/test_changes.py::test_changes_in_review_take_no_slot_from_the_work]}
  trace: [ops/conductor.py, ops/windows/host-probe.ps1]
- id: TSK-09
  group: Plan graph and durable steps
  phase: 2
  title: One trace per task
  statement: Every agent run, model call and tool call of a task shall be part of one trace for that task, in the shape
    of the OpenTelemetry GenAI conventions (invoke_agent with chat and execute_tool spans under it), shown in Phoenix
    and in the task's run view.
  type: quality
  priority: must
  status: implemented
  findings: [FND-101]
  parents: [SN-07]
  sources: ['OpenTelemetry GenAI semantic conventions (development status, 2026)', docs/SWARM-ROADMAP.md]
  acceptance: 'Test: a task with steps on two harnesses yields one trace whose spans name every agent run, model call and
    tool call.'
  rationale: The task is one run in the runtime record, each step a run inside it and the agents' own runs and model
    calls inside the steps (#/live/task:<id>, Live trace and the task's page); a Hermes run, which can't carry its parent
    in, joins the live step of its agent; a Claude step's Claude task runs inside its step (since 2026-11-01); a minute
    after the run ends the tree goes to Phoenix as one trace (otlp.tree_spans, TSK-26).
  verify: {method: test, by: ['tests/test_conductor.py::test_one_trace_the_task_s_run_holds_each_step_s_run', 'tests/test_runtime.py::test_a_hermes_run_without_a_ref_joins_the_live_step_of_its_agent',
    'tests/test_conductor.py::test_a_claude_step_waits_for_its_claude_task_also_across_a_restart',
    'tests/test_otlp.py::test_a_task_run_is_one_trace_from_the_run_to_every_model_and_tool_call']}
  trace: [ops/conductor.py, ops/runtime.py, images/mission-control/runrecord.py, images/mission-control/otlp.py]
