  phase: 9
  title: Every task of the stack in one list
  statement: The Tasks list shall show every task of the stack in one list, with no yours-or-the-stack's filter in the
    app or its data, in the order of what matters now - needs you, failed, running now, recent results, scheduled, and
    newest first within each - and each task shall say who asked for it (you, one of your rules, an outside agent, or
    the stack itself) as information on it, never as a filter.
