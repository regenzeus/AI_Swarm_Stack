- id: TSK-21
  group: Plan graph and durable steps
  phase: 6
  title: Every task through the Conductor
  statement: Every occurrence of every task, one-off, scheduled, event-triggered or after another task, shall run as
    a plan graph under the Conductor, a single-agent task as a one-step graph, with builds, Claude tasks, mission
    agents, the Topic Desk and delivery as step kinds that keep their own approvals.
  type: functional
  priority: must
  status: partial
  parents: [SN-19, SN-20]
  sources: [docs/SWARM-DESIGN.md]
  findings: [FND-84]
  acceptance: 'Test: a scheduled briefing task, an event-triggered task and a one-step chat task each run as a plan
    graph with their steps in the task''s trace.'
  gap: Every task the intake plans runs under the Conductor, once, on a schedule, on an event (each firing an
    occurrence, its event in every step's prompt) or after another task, with coding as a build step, code questions as
    Claude steps (DEC-36), a briefing as the desk's plan or, on an event, the desk's alert (TSK-22), and a price
    watch as checks of its shopping agent, whose purchases stay its own runs (DEC-37). Since 10 Nov 2026 each later occurrence of a scheduled task is started by its n8n workflow (WFL-09, DEC-51), never by the Conductor's own clock. Since 8 Nov 2026 the runner
    moves every briefing and price watch still running as its mission under the Conductor by itself, so no repeating
    task runs on two engines; a briefing's alerts are its task's too (the rhythm holds the schedule and the triggers;
    an alert's run is the desk's short alert). Still apart are a cleanup analysis (ops/cleanup.py's, on demand) and work
    started at a door directly (a chat, a build, a Claude question), which is followed there, not run as a graph.
