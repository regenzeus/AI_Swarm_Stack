  group: Everything is a task
  phase: 9
  title: Each task has an area
  statement: Each task shall have an area named for what it is for (Taxes, Mail, Briefings, Shopping, Research, Errands,
    Inbox, Phone, Code, Memory, Upkeep), declared by each crew job and each workflow file (the generator writes
    it, and a check fails on one without it), and for a task given in a sentence taken from its kind; the area shall be
