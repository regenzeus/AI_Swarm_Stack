    trace: [ops/engine/activities.py, ops/engine/places.py, ops/wslhost-setup.sh]
  - id: GEN-23
    title: 'Templates are graphs run by one runner'
    statement: "A pack's template shall be a graph of blocks (one start, agent, command, change, gate, wait, tracker, branch, notify, fan-out, loop back, failure path, one or more ends) stored as YAML in the pack's repository, run by one generic graph-runner workflow on Temporal that keeps every gate, wait and check."
    type: functional
    priority: should
    status: implemented
    acceptance: 'Test: a toy template with a gate, a 3-round loop, a 5-way fan-out and a wait survives a restart of the worker and of the server in each state, and no step removes its gate.'
    parents: [SN-05]
