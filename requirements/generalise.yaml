  - id: GEN-46
    title: "A run works with its tracker item end to end"
    statement: "In a customer-class deployment a pack's item workflow shall work with its item from its first change to
      its end: a tracker new to the deployment starts nothing for the items it holds, and a new item starts one run; the
      triage agent reads the item; the owner sends the run's question from shadow and the item holds it once; the
      reporter's reply, its text kept by the stack, wakes the wait; a command at the wsl-host place gets the item's
      attachment by artifact id; the change goes out as a draft pull request; a comment on the item does not wake the
      wait for the review, a comment on the pull request does; the summary is written once; and n8n's executions hold
      none of the item's text."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/N8N-MIGRATION.md, docs/AI-STACK.md]
