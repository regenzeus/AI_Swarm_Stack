  - id: GEN-44
    title: "A pack's item workflow runs end to end in a customer-class deployment, and the core names no domain"
    statement: "In a customer-class deployment the stack shall carry a pack's item workflow from its tracker item to its
      end: the item starts one run (also when its event comes twice), an agent step triages it, every tracker write waits
      in shadow until the owner sends it, a wait on the item times out to a reminder and is woken by a reply from
      someone else but not by the stack's own comment, a job of hours at the wsl-host place finishes with a second job queued behind it, a change
      goes out as a draft pull request whose review comment wakes the run, and the run writes its summary and ends;
      restarts of the runner side and of n8n while the run waits and while a job runs shall lose nothing, n8n shall get
      only summaries, and the run shall export as one zip. No file of ops/, images/, compose/, config/ or n8n/ shall name
      the domain a pack brings."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/N8N-MIGRATION.md, docs/AI-STACK.md, DEC-54]
    rationale: 'The CR of 10 Nov 2026 for the first work deployment counts as done when this holds for the toy pack
      against stand-ins.'
    acceptance: 'Test, against stand-ins (a stand-in tracker, a stand-in forge, the local worker in a temp folder, the step
      service and the run register on temp paths, example-work''s data class and node list) with a stand-in n8n that runs
      the toy''s item workflow node by node: every step of the statement, the runner side reloaded from disk mid-wait and
      mid-job, n8n restarted mid-wait and mid-job, each command submitted once, nothing of the triage''s whole text in
      n8n''s executions while the register holds it, and the zip with every step in order; the stand-in domain''s names
      over ops/, images/, compose/, config/ and n8n/ find nothing. Shown on 10 Nov 2026 on a throwaway n8n 2.44.7 with
      example-work''s node list and the step service''s real runner code in a throwaway container: the same flow ended
      in success with n8n restarted mid-wait and mid-job, one execution for the item, and none of the triage''s whole
      text in n8n''s execution data (docs/N8N-MIGRATION.md §12).'
    verify: {method: test, by: ['tests/test_work_deployment.py::test_the_toy_pack_runs_end_to_end_in_a_customer_class_deployment_against_stand_ins',
      'tests/test_work_deployment.py::test_the_core_names_nothing_of_the_stand_in_domain']}
    trace: [ops/flows.py, ops/runreg.py, ops/domain/trackers.py, ops/domain/forgework.py, ops/domain/places.py, ops/domain/packs.py,
      ops/domain/record.py, tests/fixtures/packs/toy/workflows/ticket.json]
  - id: GEN-45
    title: "Home's inbox repository is a front door"
    statement: "The home deployment shall watch the owner's private repository <FORGEJO_OWNER>/inbox on its Forgejo as
      its tracker (deployments/home/trackers.yaml, the owner named once in deployment.env as ${FORGEJO_OWNER}; restart
      on_comment; asked every 5 minutes), so the work deployment's item flow runs at home every day: an issue starts the
      stack's own item workflow home/inbox (n8n/workflows/item-home-inbox.json, webhook item/home/inbox, inactive until
      the lead switches it on), whose main agent reads the issue and answers it or does it, the whole answer is
      commented on the issue, the run waits up to 7 days for the owner's reply, answers that in a second comment, writes
      the summary and closes the issue; with no reply it writes the summary and closes. Its writes start in shadow like
      every tracker's. No pack may take the names home, item or run, so no pack can listen on the stack's own item
      webhooks or n8n's webhook roots."
    type: functional
    priority: should
    status: partial
    gap: "Built and tested against a stand-in Forgejo and a stand-in n8n; live once the lead switches on the poller's and
      the inbox's workflows and the owner lets comment, summary and transition go live."
