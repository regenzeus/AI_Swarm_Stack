    sources: [docs/N8N-MIGRATION.md, docs/PLATFORM.md, DEC-54]
    acceptance: 'Test: home''s trackers.yaml loads with no refused entry, its repository from FORGEJO_OWNER; the inbox
      workflow listens on item/<the tracker''s workflow> and is made of the real kinds; against a stand-in Forgejo
      where every write has the owner''s account and a stand-in n8n running the workflow, an issue starts one run (also
      when its change comes twice), the main agent''s answer is commented whole, the stack''s own comment does not wake
      the run, the owner''s unmarked reply does, the second answer, the summary and the close follow, the run ends, and
      a later comment starts a new run; with nothing live and no reply in 7 days every write waits in shadow and the run
      ends; a value a trackers.yaml names that its deployment does not set is refused; a pack named home or item is
      refused.'
