  - id: GEN-40
    title: Jobs of hours wait their turn at a place
    statement: "The local worker (ops/localworker.py) shall run one job at a time and write in its status the job it runs
      and how many requests wait behind it, refreshed every 10 seconds while a job runs; the stack shall give a request
      up as not picked up only after it waited 5 minutes while its worker was not running or idle, never for the time it
      waited behind a running job; and a job's one run limit shall be its kind's own minutes, from its file (1 minute to
      a day)."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/PLATFORM.md, docs/AI-STACK.md]
    rationale: 'A licensed tool runs for hours at the wsl-host place. Before, the second of two long jobs was given up
      after 5 minutes while it was only queued (CR of 10 Nov 2026, N3). Capacity pools are left out on purpose.'
    acceptance: 'Test: two long toy jobs (scaled to 4 seconds against a pick-up timeout of 0.5 seconds) queued at one place
      both finish, one after the other, and the status named the running job with one queued; on a fast clock a request
      10 minutes behind a running job is queued, and 5 minutes idle or gone gives it up; a kind of 600 minutes is valid
      and its minutes are in the status. Shown on 10 Nov 2026: two 6-minute jobs at a throwaway wsl-host worker in a
      temp folder, with the real 5-minute timeout, both done.'
    verify: {method: test, by: ['tests/test_domain_places.py::test_two_long_jobs_queued_at_one_place_both_finish_one_after_the_other_and_neither_is_given_up',
      'tests/test_domain_places.py::test_the_pickup_clock_stands_while_the_worker_runs_another_job_and_counts_while_it_is_idle_or_gone',
      'tests/test_domain_places.py::test_a_job_kind_sets_its_own_run_limit_in_its_file_and_the_status_carries_it',
      'tests/test_winworker.py::test_a_job_past_its_time_limit_is_stopped']}
    trace: [ops/localworker.py, ops/domain/places.py, ops/winjobs.py, docs/PLATFORM.md]
