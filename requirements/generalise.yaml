  - id: GEN-22
    title: 'Commands run at places through the worker protocol'
    statement: "A pack's command shall be a job kind of the worker protocol, run at wsl, windows or wsl-host (the same worker, as the Linux user the deployment names as owner of its tools and repositories) behind a Temporal task queue per place, with Windows staying pull-only; per-change values arrive as typed parameters, and the coder can run a check during its loop."
    type: functional
    priority: should
    status: partial
    gap: "The places, their task queues, the typed values and the approval of each job kind by its hash at each place are built and tested; the coder starting a check job from inside its build and reading the verdict in the same build is not built yet (docs/AI-STACK.md §17)."
    acceptance: "Test: a toy job kind on the wsl-host worker runs with a change's diff, a value outside its type is refused, and the verdict reaches the coder's next prompt in the same build."
    parents: [SN-05]
    sources: [docs/AI-STACK.md]
    verify: {method: test, by: ['tests/test_engine_activities.py::test_a_home_plan_runs_on_the_engine_through_the_conductors_own_steps_and_finish',
      'tests/test_engine_activities.py::test_a_step_that_fails_twice_fails_the_run_and_the_task_with_its_reason',
      'tests/test_engine_activities.py::test_a_gate_is_asked_once_per_run_and_node_even_when_asked_again',
      'tests/test_engine_places.py::test_a_command_runs_at_the_wsl_host_place_only_once_approved_there_by_its_hash_and_a_value_outside_its_type_is_refused',
