  - id: BLD-30
    title: Every onboarding step has a quality gate and a record
    statement: Each onboarding step shall record when it last ran, how long it took, which model it used with its calls and
      tokens where a model ran, and its result in numbers with a verdict; a step whose result is hollow shall be weak,
      shown as weak on the repository's page and in repos_overview, and shall never count as done; the page shall show
      the checklist of all steps always, and each step shall be runnable again on its own.
    type: functional
    priority: must
    status: implemented
    parents: [BLD-26]
    sources: [DEC-48, "owner, 8 Nov 2026: I want to see what are the steps, when they last ran, and some metric on their success/quality and which model they used. And how much token they used."]
    verify: {method: test, by: [tests/test_onboard.py::test_a_claim_by_a_short_name_resolves_only_when_one_file_has_it_and_the_line_exists, tests/test_onboard.py::test_every_step_has_its_record_and_a_weak_step_is_never_done,
      tests/test_onboard.py::test_a_step_runs_again_on_its_own_from_the_checklist, tests/test_onboard.py::test_the_app_shows_the_steps_and_promises_nothing_false]}
    trace: [ops/onboard.py, images/mission-control/web/static/app-memory.js]
  - id: BLD-31
    title: A repository's kind decides its analysis
    statement: A repository shall be the owner's own work or something to evaluate, asked at Add a repository and otherwise
      taken from its origin; the owner's own work shall get an engineer's guide (entry points and flows with file:line, module
      map, key types, how to extend it, build and test, fragile areas, glossary) written from the repository's own structure,
      and something to evaluate the review; an analysis under 2,000 characters, with fewer than four sections, or whose
      file:line claims mostly do not resolve shall be weak.
    type: functional
    priority: should
    status: implemented
    parents: [BLD-26]
    sources: [DEC-48]
    verify: {method: test, by: [tests/test_onboard.py::test_the_guides_context_keeps_the_layers_when_the_package_list_is_cut, tests/test_onboard.py::test_the_owner_s_own_repository_gets_the_engineer_s_guide_from_its_structure]}
    trace: [ops/onboard.py, prompts/shared.md, images/mission-control/web/static/app-wiki-code.js, ops/missions.requests.py]
  - id: BLD-32
    title: The graph view shows the repository's own code, the source pane says what it shows
    statement: The repository's graph view shall rank nodes defined in the repository's own non-test files by the links
      that hold code together (calls, inherits, implements, contains, imports), every big group showing its best-connected
      few; the source pane shall say which lines of how many it shows and offer the whole file; the code map viewer link
      shall work off the tailnet.
    type: functional
    priority: should
    status: implemented
    parents: [BLD-26]
    sources: [DEC-48]
    verify: {method: test, by: [tests/test_repos.py::test_an_explaining_docstring_is_shown_whole, tests/test_repos.py::test_the_graph_view_ranks_the_repository_s_own_code_and_the_source_pane_is_whole]}
    trace: [images/mission-control/server.py, images/mission-control/web/static/app-memory.js]
  - id: BLD-33
    title: Every onboarding step says its commit and how far behind it is, and the package can be brought up to date
    statement: Each onboarding step shall show when it ran, how long it took, which model it used, its calls and tokens,
      and the commit it was made at with how many commits the repository has moved on since; a run from before these
      records shall be read from what it left (the map's commit and date, the explanations' count, the analysis' task).
      Update shall redo the steps that follow the code (copy, graph, facts, code map, explanations, search) from the
      latest commit, the code map explaining only the files that changed; Run again on a step shall really do that step
      and the ones after it, never skip it because an earlier result exists. The repository's kind shall not be a tag.
    type: functional
    priority: must
    status: implemented
    parents: [BLD-30]
    sources: [DEC-48]
    verify: {method: test, by: [tests/test_onboard.py::test_update_redoes_the_steps_that_follow_the_code_and_run_again_really_runs, tests/test_onboard.py::test_every_step_says_its_commit_and_how_far_behind_the_code_is, tests/test_onboard.py::test_the_app_shows_the_steps_and_promises_nothing_false]}
    trace: [ops/onboard.py, ops/ua_map_in.py, ops/missions.requests.py, images/mission-control/web/static/app-memory.js]
  - id: BLD-34
    title: Every coding run gets the repository card first, and the owner keeps a hand on it
    statement: Onboarding's last step shall make the repository card without a model from what the steps before learned
      (the commands a change learned or the repository's files show, the wiki's current conventions and fragile areas,
      the guide's parts and where to start, the code map's layers), each line with its source and the files it cites, at
      most 6,000 characters; every coding and review run shall get it first as a must-have of its opening, the brief's
      commands not twice; an exam's older code shall get no line that cites only files it lacks; the owner shall pin, strike and add
      lines on the repo page's Card tab, kept when the card is made again; Update shall make it again.
    type: functional
    priority: must
    status: implemented
    parents: [BLD-26]
    sources: [DEC-49]
    verify: {method: test, by: [tests/test_repocard.py::test_the_card_form_stacks_and_health_shows_each_part_as_a_bar, tests/test_repocard.py::test_a_learned_command_makes_the_card_again, tests/test_onboard.py::test_a_job_with_only_the_card_left_does_not_wait_for_another_repository, tests/test_repocard.py::test_the_card_is_made_from_what_onboarding_learned_without_a_model, tests/test_repocard.py::test_the_owner_pins_strikes_and_adds_and_a_remake_keeps_it, tests/test_repocard.py::test_an_exam_s_older_code_gets_no_line_about_files_it_lacks, tests/test_repocard.py::test_the_card_is_onboarding_s_last_step_and_update_makes_it_again, tests/test_repocard.py::test_a_coding_run_gets_the_card_first_and_the_brief_without_its_commands_twice, tests/test_repocard.py::test_the_app_shows_the_card_with_the_owner_s_hand_on_it_and_what_else_agents_reach]}
    trace: [ops/repocard.py, ops/onboard.py, ops/memstack.py, ops/missions.requests.py, images/mission-control/server.py, images/mission-control/web/static/app-memory.js]
  - id: BLD-35
    title: Everything else onboarding makes stays and is reachable, never pushed
    statement: A build's sandbox shall hold everything onboarding made for its repository as files to grep (the card, the
      written guide, the wiki's pages, one line per file from the code map, the facts), named once on the card; the file
      note at a file's first read shall carry the code map's line on it; a search that printed more than 50 lines shall
      hear how its hits fall over the top folders with what the code map says each is, once per command; the repo page
      shall show the note an agent gets for a file and mark the wiki's pages whose cited code changed. Onboarding shall
      write into the repository's wiki, without a model, a page per part of the code (what it is, how it stands, every
      file with its explanation) and a page per section of the written guide, each citing its files and commit, marked as
      its own and made again every time; the Scribe's pages stay as they are, and neither the brief nor a file note
      repeats these pages.
    type: functional
    priority: must
    status: implemented
    parents: [BLD-34]
    sources: [DEC-49]
    verify: {method: test, by: [tests/test_repowiki.py::test_onboarding_fills_the_wiki_with_a_page_per_part_and_per_guide_section, tests/test_repowiki.py::test_a_binary_file_in_the_repository_does_not_stop_the_reading, tests/test_repocard.py::test_everything_else_is_exported_to_grep_never_pushed, tests/test_repocard.py::test_a_wide_search_hears_which_folders_its_hits_fall_in_once, tests/test_repocard.py::test_the_app_shows_the_card_with_the_owner_s_hand_on_it_and_what_else_agents_reach]}
    trace: [ops/repocard.py, ops/builds.py, ops/memstack.py, config/hermes/claude-hooks/memory_hook.py, images/mission-control/server.py, images/mission-control/server.a2a.py, images/mission-control/web/static/app-wiki-code.js]
  - id: BLD-36
    title: Conventions are kept by programs while the agent works
    statement: After each edit a coding agent makes in the builder, the repository's own linter (the profile's, else its
      configuration's, else for Python the errors that are always errors) shall run on the changed file and what it finds
      shall come back at once; a missing linter or a clean file says nothing and nothing blocks; the conventions review
      lens shall read the card and the wiki.
    type: functional
    priority: must
    status: implemented
    parents: [BLD-34]
    sources: [DEC-49]
    verify: {method: test, by: [tests/test_repocard.py::test_an_edit_gets_the_repository_s_linter_and_a_missing_linter_says_nothing, tests/test_repocard.py::test_the_linter_comes_from_the_repository_or_the_errors_that_are_always_errors]}
    trace: [config/hermes/claude-hooks/lint_hook.py, config/hermes/claude-hooks/claude-runtime-settings.json, ops/repocard.py, ops/builds.py, ops/builds.review.py]
  - id: BLD-37
    title: The brief names the tests to run first and the closest example
    statement: A coding step's brief shall name the tests of its files and of the code that uses them as the tests to run
      first, and for a file the task makes new the existing file of the same kind closest to it (sharing most of its
      name, then the most recently changed) to write it like.
    type: functional
    priority: should
    status: implemented
    parents: [BLD-27]
    sources: [DEC-49]
    verify: {method: test, by: [tests/test_repocard.py::test_the_brief_names_tests_to_run_first_and_the_closest_example]}
    trace: [ops/repofacts.py]
  - id: BLD-38
    title: The exam measures the knowledge against no memory, on cases the knowledge cannot know
    statement: The replay exam shall have a knowledge arm (the card, the brief, the file notes, the knowledge folder, the
      lint hook) to run against the arm without memory, and pick cases only after a given commit, so the knowledge an arm
      reads was made before every case; a layer that does not raise the tests passed, or cut tokens or time without
      lowering them, shall be switched off for that size of repository.
    type: functional
    priority: must
    status: implemented
    parents: [BLD-34]
    sources: [DEC-49]
    verify: {method: test, by: [tests/test_replay.py::test_an_exam_tree_is_one_commit_with_the_release_tag_before_it, tests/test_replay.py::test_a_project_that_reads_its_version_from_git_installs_from_a_plain_tree, tests/test_repocard.py::test_the_exam_has_a_knowledge_arm_and_cases_after_the_knowledge_s_commit]}
    trace: [ops/replay.py, ops/changes.py]
  - id: BLD-39
    title: The guide's sections count whatever the model's dress
    statement: A section title the guide's or the analysis's prompt asks for, written by the model as a plain line (bold,
      numbered, with a colon), shall become its heading before the guide is checked, carded or fed to the wiki; a guide
      that has its headings shall stay as it is, and the guides on disk shall be repairable once without a model.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/CODER-KNOWLEDGE.md]
