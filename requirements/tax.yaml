# The tax desk: the owner's German income tax papers from the mail copy, filed as copies on the NAS and prepared per year
# as a draft for the owner's own ELSTER return (ops/tax.py, docs/TAX-DESK.md). Never submits anything anywhere.
area: Tax desk
prefix: TAX
items:
  - id: TAX-01
    title: Tax papers are found by their headers alone
    statement: The tax desk shall pick its candidates from the mail copy's index on the NAS, opened read-only, by the
      subject and sender of each mail from the start of its window on (config/tax.yaml), against generic word and sender
      rules and the owner's own keep and ignore rules kept outside git, and shall take each candidate's text and its
      attachments' text from the NAS once; a PDF without a text layer shall be marked as needing OCR, never guessed. It
      shall change nothing in Gmail or the mail copy.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-19]
    sources: ["owner 2026-11-10: Could you make an agent that prepares my taxes by looking through my email for last year and this year", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_the_header_rules_find_tax_papers_and_leave_the_rest, tests/test_tax.py::test_the_owner_s_own_rules_keep_and_ignore, tests/test_tax.py::test_find_takes_each_new_candidate_s_text_once_and_the_earlier_return, tests/test_tax.py::test_the_nas_helper_reads_the_index_read_only_and_never_a_body]}
    trace: [ops/tax.py, ops/tax_nas.py, config/tax.yaml, ops/crew.py, ops/systemd/crew-tax-find.service, deployments/home/deployment.env]
  - id: TAX-02
    title: Only Hermes with ChatGPT reads tax content
    statement: The tax desk shall send each candidate mail with its attachments' text, and each earlier return, as one
      turn of the tax card's Hermes profile on the ChatGPT engine (model gpt-sub, key vk-tax, no tools), marked as data
      and never as instructions, and shall refuse to read through any other card, profile or engine. An answer that is
      no such JSON, a refusal, or a relevant paper read with a confidence under 0.5 shall become a question for the owner.
      A usage limit shall keep every answer read before it, and the next attempt shall read only what is left.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-11]
    sources: ["owner 2026-11-10: the reader is Hermes with ChatGPT; no other model reads tax content", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_only_the_tax_card_s_hermes_profile_on_chatgpt_reads, tests/test_tax.py::test_each_paper_is_one_hermes_turn_marked_as_data, tests/test_tax.py::test_an_unreadable_refused_or_unsure_answer_is_a_question_never_a_guess, tests/test_tax.py::test_a_usage_limit_keeps_what_was_read_and_the_next_attempt_goes_on]}
    trace: [ops/tax.py, config/agents.yaml, ops/keys.sh, config/hermes/configure-tax.sh, ops/swarm_client.py, ops/conductor.py, prompts/tax.md, ops/deploy.py]
  - id: TAX-03
    title: Copies only, by year and form, never over a file
    statement: The tax desk shall copy each relevant attachment, and the mail it came with as .eml, on the NAS into
      Steuern/<year>/<form>/ as <date>_<issuer>_<kind>.<ext>, the year being the one the paper concerns; a name that is
      taken shall get a number, and nothing shall be written outside the Steuern share. A file the owner changed shall
      stay, and the desk's new version shall go next to it under a numbered name. Log lines, Home lines and the steps'
      answers shall name counts and forms, never an amount or a paper's content.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-09]
    sources: ["owner 2026-11-10: the copies go to the NAS share Shared_Data/Steuern", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_filing_copies_each_paper_by_year_and_form_and_never_twice, tests/test_tax.py::test_a_name_that_is_taken_gets_a_number_and_nothing_is_written_outside_the_share]}
    trace: [ops/tax.py, ops/tax_nas.py, ops/systemd/crew-tax-file.service]
  - id: TAX-04
    title: The owner's corrections win
    statement: The tax desk shall keep a list of each year's papers in Steuern/<year>/Belege.csv and Belege.md (file, form,
      kind, amount, date, issuer, source mail, confidence, checked), and on every later run shall keep each value the
      owner changed in Belege.csv and leave out each row the owner removed, in the workbook too.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_the_owner_s_corrections_in_belege_csv_win_on_every_run]}
    trace: [ops/tax.py, ops/tax_book.py]
  - id: TAX-05
    title: A draft workbook per year with the figures the law sets
    statement: The tax desk shall write per year it prepares Steuer-<year>.md and one CSV per form with each form's lines,
      their sums and their papers, and compare them with the figures the law sets for that year from one table with its
      sources (Arbeitnehmer-Pauschbetrag, Homeoffice-Pauschale, Entfernungspauschale, Sonderausgaben-Pauschbetrag,
      Sparer-Pauschbetrag, zumutbare Belastung in steps, 20 percent of labour costs under § 35a); a year missing from the
      table shall be said, never guessed. The workbook shall say at its top that it is a draft for the owner's own ELSTER
      return and not tax advice, and the desk shall submit nothing anywhere.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_the_figures_the_law_sets_for_2025_and_2026, tests/test_tax.py::test_the_workbook_starts_from_the_earlier_returns, tests/test_tax.py::test_filing_copies_each_paper_by_year_and_form_and_never_twice]}
    trace: [ops/tax_book.py, ops/tax_law.py]
  - id: TAX-06
    title: The owner's earlier returns are the base
    statement: The tax desk shall read each earlier return the owner put into Steuern/<year>/ (an ELSTER protocol as HTML,
      or a PDF) through the same reader as TAX-02, keep the extraction under /srv/ai/tax and as Erklaerung-<year>.json and
      .md in that folder, and prepare each later year from it - each recurring item expected, marked found, missing, none
      this year by the owner's word, or moved by more than half and more than 100 EUR - with the items no earlier return had
      marked new. A paper of a year before the prepared ones shall be filed under its own year and never summed into them.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: ["owner 2026-11-10, through the lead: Based on this it should prepare 2025 and 2026.", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_an_earlier_return_is_read_by_the_reader_and_kept_as_the_base, tests/test_tax.py::test_the_workbook_starts_from_the_earlier_returns, tests/test_tax.py::test_find_takes_each_new_candidate_s_text_once_and_the_earlier_return]}
    trace: [ops/tax.py, ops/tax_book.py, prompts/tax.md]
  - id: TAX-07
    title: What only the owner knows is asked in Needs you
    statement: The tax desk shall put each open question of a year into Needs you (assessment, church tax, commute km and
      days, home-office days, children, a paper it could not sort, an expected paper that did not come after 31 May of the
      next year) with its answers as buttons or a typed number, naming no amount and no paper's content; the runner shall
      refuse an answer that is not one of the offered ones, not a number of 0 or more, or over 200 characters, and the
      next run shall use each answer.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-19]
    sources: [docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_questions_reach_needs_you_without_amounts_and_answers_are_checked, tests/test_tax.py::test_the_workbook_starts_from_the_earlier_returns]}
    trace: [ops/tax.py, ops/decisions.py, config/autonomy.yaml, images/mission-control/server.py, ops/missions.requests.py]
  - id: TAX-08
    title: One workflow runs the desk
    statement: The tax desk's n8n workflow (n8n/workflows/tax-desk.json, made by ops/n8n_gen.py chain and listed in home's
      workflows.yaml) shall run its find step, its reader and its filing step in that order, on Run now and on the 3rd of
      each month at 07:00 once switched on; a run in which no year is open shall find nothing.
    type: functional
    priority: must
    status: implemented
    parents: [SN-19]
    sources: [docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax.py::test_the_tax_desk_workflow_finds_reads_and_files_in_that_order, tests/test_tax.py::test_n8n_gen_makes_a_chain_of_steps, tests/test_tax.py::test_a_run_with_no_open_year_finds_nothing]}
    trace: [ops/n8n_gen.py, deployments/home/workflows.yaml, ops/tax.py]
  - id: TAX-09
    title: Your taxes is one task
    statement: The tax desk's workflow shall be one task, "Your taxes" (area Taxes), whose When is the
      workflow's schedule and whose runs are the workflow's runs, one each, with the workflow's steps in order as each
      run's steps (their state, times and answer, the reader's own log one tap away) and the tax reader as its agent;
      Run now on it shall start the workflow through its Run now webhook, and say so when the workflow is switched off.
      The crew duties of its steps and the task made for each run of its reader shall not be listed as tasks of their
      own. A step's title shall say what it does.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-19]
    sources: ["owner 2026-11-11: Why do i not see agent and task for tax stuff? Did you create it in new system with n8n? Where can i see result?", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax_task.py::test_your_taxes_is_one_task_with_the_workflow_s_runs_as_its_runs, tests/test_tax_task.py::test_the_desk_s_crew_duties_and_reader_tasks_leave_the_lists, tests/test_tax_task.py::test_run_now_on_your_taxes_starts_its_workflow, tests/test_tax.py::test_the_tax_desk_workflow_finds_reads_and_files_in_that_order]}
    trace: [ops/flow_tasks.py, ops/tasks.py, ops/crew.py, n8n/workflows/tax-desk.json, images/mission-control/runrecord.py, images/mission-control/server.a2a.py, images/mission-control/web/static/task.js, images/mission-control/web/static/app-tasks.js, images/mission-control/web/static/app-workflows.js]
  - id: TAX-10
    title: The result of each year is in the app
    statement: The task's page shall show per year, below the draft's disclaimer, the papers found per form (counts), the
      sums per form line, what the earlier returns lead to expect that is missing, the open questions with the way to
      Needs you, the earlier return as the reader extracted it, and the year's files - the workbook as a page, Belege as
      a list with each paper's file name, the earlier return as a page - each with its path on the NAS share, built
      without a model and without the NAS from the desk's outputs on the PC after every filing run and every answer.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: ["owner 2026-11-11: Where can i see result?", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax_task.py::test_the_result_view_shows_each_year_from_the_desk_s_outputs, tests/test_tax_task.py::test_the_task_page_shows_the_result_and_its_files_as_pages]}
    trace: [ops/tax_view.py, ops/tax.py, images/mission-control/server.tax.py, images/mission-control/web/static/tax.js, images/mission-control/web/index.html, images/mission-control/web/sw.js, images/mission-control/web/static/app.css, images/mission-control/guide/23-taxes.md]
  - id: TAX-11
    title: The figures reach only the owner's signed-in session
    statement: The view of the tax figures shall be readable on the PC by the runner's user and the app's user alone (a
      folder of mode 700 and a file of mode 600, each with an access ACL entry for the app's user only), and none shall
      be written where that cannot be set. The app shall serve it only to the owner's signed-in session, never to the AI
      phone or the stack's own checks and previews, and never let a browser cache it; no figure shall go into the
      board's state, a task's page data, a log, a Home line, a push text or an n8n answer.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-09]
    sources: ["lead 2026-11-11: shown only to the owner's signed-in session (never the AI phone: PHN-07; never in logs, Home lines, push texts or n8n's execution data)", docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax_task.py::test_the_view_is_shared_with_the_app_s_user_alone, tests/test_tax_task.py::test_the_figures_reach_only_the_owner_s_signed_in_session, tests/test_tax_task.py::test_no_figure_reaches_the_board_or_its_pages]}
    trace: [ops/tax_view.py, images/mission-control/server.tax.py, images/mission-control/server.py, ops/flow_tasks.py]
  - id: TAX-12
    title: The tax reader shows where it belongs
    statement: The tax card shall have the name Tax reader in the app, say on its card that it reads the papers of the
      Tax desk with ChatGPT only and no tools, and its page shall link to the workflow it is a step of and to the task
      it does steps for.
    type: functional
    priority: should
    status: implemented
    parents: [SN-05]
    sources: [docs/TAX-DESK.md]
    verify: {method: test, by: [tests/test_tax_task.py::test_the_tax_reader_has_its_name_and_shows_where_it_belongs]}
    trace: [config/agents.yaml, images/mission-control/web/static/app-runs.js, images/mission-control/web/static/swarm.js, ops/tasks.py]
