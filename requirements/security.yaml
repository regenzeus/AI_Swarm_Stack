# Security: sign-in, the lethal-trifecta split, isolation, validation. docs/SECURITY.md describes the model; these are
# the checkable statements. A change to a boundary updates SECURITY.md and the requirement here in the same commit.
area: Security
prefix: SEC
items:
  - id: SEC-01
    title: Tailscale login is the only sign-in
    statement: Mission Control shall refuse every /api request that lacks the Tailscale-User-Login header.
    type: functional
    priority: must
    status: implemented
    parents: [SN-06, SN-05]
    sources: [docs/SECURITY.md, images/mission-control/AGENTS.md]
    rationale: A local process could forge the header; that is an accepted risk (it could read the files directly).
    verify: {method: test, by: [tests/test_server.py::test_api_needs_the_tailscale_identity]}
    trace: [images/mission-control/server.py]
  - id: SEC-02
    title: Gates in front of apps with their own login
    statement: The gates in front of the Hermes dashboard and the code map shall refuse every request without the
      Tailscale-User-Login header.
    type: functional
    priority: must
    status: implemented
    parents: [SN-06, SN-05]
    sources: [config/gate/AGENTS.md]
    verify: {method: inspection, by: [config/gate/hermes-dashboard.Caddyfile, config/gate/codemap.Caddyfile, smoke/smoke.sh]}
  - id: SEC-03
    title: Only the scout reads the web
    statement: Only the scout profile shall read web pages or web search results directly, and the scout shall have
      no access to the vault, memory, mail or the AI phone.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-04]
    sources: [docs/SECURITY.md, AGENTS.md]
    verify: {method: test, by: [tests/test_tokens.py::test_agent_profiles_carry_only_what_they_use]}
    trace: [config/hermes/configure-scout.sh, ops/keys.sh]
  - id: SEC-04
    title: No way out for an agent that holds private data
    statement: An agent that holds private data and reads untrusted content shall have no tool that can send data to
      a third party without the owner's approval of that action, of a task naming it, or (for text and addresses that
      hold no e-mail address, phone number, IBAN, key or IP address) of his free mode on the AI phone (DEC-38).
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-04]
    sources: [docs/SECURITY.md]
    verify: {method: analysis, by: [tests/test_phone.py::test_in_free_mode_only_an_address_or_text_with_private_data_asks, ops/keys.sh, images/phone/phone.py, docs/SECURITY.md]}
    findings: [FND-02, FND-22]
  - id: SEC-05
    title: Untrusted content stays labelled
    statement: Web research results, mail content and page text shall reach an agent wrapped and labelled as
      untrusted data.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/SECURITY.md]
    verify: {method: test, by: [tests/test_mail.py::test_search_is_marked_untrusted_and_flags_protected]}
    trace: [images/research/server.py, images/mail/mail.py]
  - id: SEC-06
    title: Isolated readers
    statement: The page reader, the scout's browser and the price watch shall run behind an egress firewall that
      blocks private, LAN and Tailscale ranges, and the desk shall refuse private and loopback URLs.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-04]
    sources: [images/fetch/AGENTS.md, images/browser/AGENTS.md, images/pricewatch/AGENTS.md]
    verify: {method: test, by: [tests/test_desk.py::test_public_url_refuses_private_targets, tests/test_desk.py::test_a_redirect_to_a_private_address_is_refused]}
    trace: [images/fetch/entrypoint.sh, images/browser/entrypoint.sh, images/pricewatch/entrypoint.sh, images/desk/desk.py]
  - id: SEC-07
    title: One key per agent
    statement: Each agent shall call the gateway with its own virtual key, limited to its own models, daily budget and
      MCP servers.
    type: constraint
    priority: must
    status: partial
    parents: [SN-05, SN-07]
    sources: [AGENTS.md, docs/SECURITY.md]
    gap: Every background job has its own key since 2026-10-29; mission runs of every type (task, shopping,
      cleanup) still share vk-mission, so two runs at the same time mix in cost attribution. The swarm registry
      gives every card its own key (SWM-23).
    verify: {method: test, by: [tests/test_keys_policy.py::test_only_the_creation_script_writes_the_keys_table, tests/test_keys_policy.py::test_update_keys_only_reads_the_table, tests/test_keys_policy.py::test_background_jobs_use_their_own_keys,
      tests/test_deploy.py::test_a_change_of_the_agents_keys_sets_every_hermes_profile_up_again]}
    trace: [ops/keys.sh, ops/update-keys.py, ops/deploy.py]
    findings: [FND-03]
  - id: SEC-08
    title: The builder is sealed
    statement: The builder container shall see only /work, hold no vault, secrets, SSH keys or Docker socket, reach
      only the gateway and its package proxy, and be unable to push or deploy.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-08]
    sources: [images/builder/AGENTS.md, DEC-03]
    verify: {method: inspection, by: [compose/apps.yaml, images/builder/AGENTS.md]}
  - id: SEC-09
    title: Package proxies are allow-lists
    statement: Sandboxes shall reach package registries only through the package proxy's allow-list, and the
      builder's list shall add only api.anthropic.com.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [images/pkgproxy/AGENTS.md]
    verify: {method: inspection, by: [images/pkgproxy/allow.txt, images/pkgproxy/allow-builder.txt]}
  - id: SEC-10
    title: The Claude token lives only per run
    statement: The runner shall pass the Claude Code token into the builder only for the run that needs it, never as
      part of the container's environment or files.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, CST-06]
    sources: [docs/SECURITY.md]
    verify: {method: inspection, by: [ops/builds.py, ops/claude_tasks.py]}
  - id: SEC-11
    title: The runner validates every request
    statement: The runner shall execute a request from the app or an MCP tool only after validating its action
      against an allow-list and its fields (slugs, schedules, sizes, ids), and refuse anything else.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [AGENTS.md, ops/AGENTS.md]
    verify: {method: test, by: [tests/test_runner.py::test_create_and_unknown_actions_are_validated, tests/test_server.py::test_requests_go_to_the_inbox_and_unknown_actions_are_refused, tests/test_crew.py::test_crew_actions_are_validated, tests/test_improve.py::test_requests_are_validated, tests/test_repos.py::test_requests_are_validated, tests/test_claude_tasks.py::test_requests_are_validated]}
    trace: [ops/missions.py]
  - id: SEC-12
    title: The app never executes
    statement: Mission Control shall not start jobs itself; it shall hand every action to the runner through the inbox,
      except the documented exceptions (chat with Hermes, the runtime ingest, the owner's answers to phone and mail
      approvals and grants written to their shared folders, push subscriptions, the app's own error reports), which
      AGENTS.md, docs/MISSION-CONTROL.md and docs/API.md shall list.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [AGENTS.md, docs/MISSION-CONTROL.md, docs/API.md]
    verify: {method: test, by: [tests/test_docs.py::test_the_readme_and_the_index_point_at_what_is_current]}
    trace: [images/mission-control/server.py, images/mail/AGENTS.md, images/phone/AGENTS.md, images/mission-control/server.devices.py]
    findings: [FND-20]
  - id: SEC-13
    title: Paths stay inside their roots
    statement: Paths taken from requests shall be resolved through the existing guards and refused when they leave
      the vault, a wiki root or a repository.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [images/mission-control/AGENTS.md]
    verify: {method: test, by: [tests/test_server.py::test_vault_files_stay_inside_the_vault, tests/test_repos.py::test_source_snippets_stay_inside_the_repo]}
    trace: [images/mission-control/server.py, ops/repos.py]
  - id: SEC-14
    title: E-mail only to the owner
    statement: Every e-mail the stack sends shall go to the owner's own address (MAIL_TO) and to no one else.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [images/mission-control/guide/07-delivery.md]
    verify: {method: inspection, by: [ops/mission_extras.py]}
    trace: [ops/mission_extras.py]
  - id: SEC-15
    title: The repo's own security rules run on every change
    statement: The checks shall run Semgrep with the repo's rules (no public ports, no Docker socket, no secrets in
      code, dangerous patterns) and prove with fixtures that the rules still catch what they should.
    type: quality
    priority: must
    status: implemented
    parents: [SN-05, SN-15]
    sources: [AGENTS.md]
    verify: {method: inspection, by: [ops/check.sh, .semgrep.yml, ops/semgrep_selftest.py]}
  - id: SEC-16
    title: Evidence is redacted
    statement: Logs, journals and records gathered as evidence for a Claude task or the health doctor shall have keys,
      tokens and passwords blanked before any model sees them.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, CST-06]
    sources: [ops/doctor.py]
    verify: {method: test, by: [tests/test_doctor.py::test_evidence_is_redacted, tests/test_claude_tasks.py::test_evidence_for_reads_each_ref_and_redacts]}
    trace: [ops/doctor.py, ops/claude_tasks.py]
  - id: SEC-17
    title: Personal exports never leak
    statement: The export converters shall never print message contents and shall name output files from dates and
      subjects, not addresses.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-04]
    sources: [converters/AGENTS.md]
    verify: {method: inspection, by: [converters/bulk_convert.py]}
  - id: SEC-18
    title: Providers that see data are named
    statement: The guide and README shall name every provider that receives data (OpenAI through the ChatGPT
      subscription, Anthropic through Claude Code) and what each one sees.
    type: quality
    priority: must
    status: implemented
    parents: [SN-04]
    sources: [DEC-16]
    verify: {method: inspection, by: [README.md, images/mission-control/guide/01-welcome.md, images/mission-control/guide/14-safety.md]}
    findings: [FND-05]
  - id: SEC-19
    title: The public snapshot holds nothing personal
    statement: make publish shall push the committed stack to the public GitHub repository only as a snapshot without
      the private history, in which every identifier of the private map outside the repository is replaced and the
      encrypted secrets are left out with an example naming their values, and only when a scan finds no identifier in
      any case, e-mail address, LAN or Tailscale address, tailnet name, key or token outside the allowed placeholders,
      and the snapshot's own tests pass. A binary file shall stop it, except an image without metadata in docs/screenshots.
    type: functional
    priority: must
    status: implemented
    parents: [SN-04]
    sources: [docs/PUBLISHING.md]
    findings: [FND-75, FND-124]
    verify: {method: test, by: [tests/test_publish.py::test_images_come_only_from_one_folder_and_hide_nothing, tests/test_publish.py::test_a_generated_file_stays_what_its_generator_makes_after_the_name_swap, tests/test_publish.py::test_every_landing_runs_the_privacy_scan_and_a_leak_stops_it, tests/test_publish.py::test_an_address_written_as_a_regular_expression_is_still_found, tests/test_publish.py::test_real_runs_stay_out_but_the_evidence_requirements_cite_stays, tests/test_publish.py::test_a_fresh_publish_replaces_the_public_history, tests/test_publish.py::test_terms_are_replaced_as_whole_words_and_only_a_capitalised_sentence_start_is_capitalised,
      tests/test_publish.py::test_the_scan_names_every_leftover_without_printing_the_term_and_lets_placeholders_pass,
      tests/test_publish.py::test_the_snapshot_leaves_out_the_secrets_and_follows_the_public_text,
      tests/test_publish.py::test_a_snapshot_with_a_leftover_runs_no_tests_and_pushes_nothing,
      tests/test_publish.py::test_the_push_commits_every_file_of_the_snapshot_whatever_its_gitignore_says]}
    trace: [ops/publish.py, ops/private-terms.sh, Makefile]
  - id: SEC-20
    title: No write from another site
    statement: Mission Control shall refuse every /api request other than GET, HEAD and OPTIONS whose Sec-Fetch-Site header
      names another site (cross-site or same-site), so a page elsewhere cannot act under the owner's Tailscale login.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-06]
    sources: [docs/SECURITY.md, docs/REVIEW-2026-11-07.md]
    rationale: tailscale serve adds the owner's login to every request his browser sends, a forged one from another page
      included (review APP-R1, SEC-R4). Programs send no Sec-Fetch-Site and are not affected; /share keeps its own reasoning.
    verify: {method: test, by: [tests/test_server.py::test_a_write_from_another_site_is_refused_and_the_app_s_own_writes_pass]}
    trace: [images/mission-control/server.py]
  - id: SEC-21
    title: The runner's git never runs what the sandbox wrote
    statement: The build runner shall run git in a clone under the workbench only with hooks and fsmonitor off, and shall
      refuse a clone whose .git is not a plain folder or whose own config sets anything but the core, origin, branch and
      user keys a clone of Forgejo needs, or whose origin is another clone in the workbench.
    type: constraint
    priority: must
    status: partial
    gap: Only ops/builds.py (and changes.py and conductor.py through it) is sealed; repowiki.py, replay.py, trials.py,
      claude_tasks.py and crew.py still run git in the workbench with their own helpers, and the design fix (the runner
      keeps its own clones and takes the builder's work in as data) waits for the owner (docs/REVIEW-2026-11-07.md).
    parents: [SN-05]
    sources: [docs/SECURITY.md, docs/REVIEW-2026-11-07.md]
    rationale: The builder writes every clone's .git (its /work), and the runner that runs git there holds every secret and
      the Docker socket (review SEC-R1).
    verify: {method: test, by: [tests/test_builds.py::test_a_clone_the_sandbox_rigged_is_refused_and_its_hooks_never_run]}
    trace: [ops/builds.py]
  - id: SEC-22
    title: What a deployment forbids never reaches git
    statement: A commit or a push of the stack's repositories that holds what the deployment's private never-in-git list
      forbids (in a changed line, a file name or a message) shall be refused, also on the runner's own pushes from the
      builder's clones, without printing the match; the list shall be in no repository, and every deploy shall install the
      repository's hooks again.
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: a commit with a forbidden term in a staged line or its message is refused, a push of a commit that skipped the commit hooks is refused, the runner''s push guard refuses it too, a removed line and a term inside a longer word pass, and without a list everything passes.'
    parents: [SN-04, SN-05]
    sources: [docs/SECURITY.md]
    rationale: 'The owner, 9 Nov 2026: "From now into the future never can something Example specific reach git." The stack is a platform; one deployment''s employer, products and projects stay out of every repository.'
    verify: {method: test, by: [tests/test_termguard.py::test_a_commit_holding_a_forbidden_term_is_refused_and_a_clean_one_passes, tests/test_termguard.py::test_a_push_of_a_commit_that_skipped_the_hooks_is_refused, tests/test_termguard.py::test_the_runners_own_push_is_guarded_and_a_removed_line_is_no_leak, tests/test_termguard.py::test_without_a_list_everything_passes]}
    trace: [ops/termguard.py, ops/git-hooks/pre-commit, ops/git-hooks/commit-msg, ops/git-hooks/pre-push, ops/builds.py, ops/deploy.py]

