  - id: PLT-34
    title: The Bitbucket mirror says when it falls behind
    statement: The Windows task ai-stack bitbucket sync shall compare Forgejo's main, fetched on each run, with the main
      Bitbucket last took, push the difference fast-forward only, and end with exit 1 and a log line on every failure (fetch,
      bundle, copy, a non-fast-forward or the push), so a failed push is tried again on the next run.
    type: functional
    priority: should
    status: implemented
    parents: [SN-09]
    sources: [docs/REVIEW-2026-11-07.md]
    rationale: From 25 Oct 2026 the push failed for want of a stored Bitbucket credential; the local clone was already
      fast-forwarded, so every later run saw nothing to do and the task reported success (review OPS-R3).
    verify: {method: inspection, by: [ops/windows/bitbucket-sync.ps1]}
    trace: [ops/windows/bitbucket-sync.ps1]
  - id: PLT-35
    title: Calls into WSL always get their channel
    statement: "WSL's kernel shall keep whole blocks of memory free (a larger free reserve, earlier reclaim, proactive
      compaction) and hand its file cache back to Windows every 30 minutes, set once as root and kept across restarts, so a call from Windows into WSL never fails because its
      Hyper-V socket could not get 512 KB of contiguous memory; a new machine gets the settings from the root bootstrap."
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: the script writes the three settings to sysctl.d, applies them and compacts memory at once, refuses
      to run without root, and the root bootstrap runs it.'
    rationale: "9 Nov 2026: calls into WSL timed out again and again (WSAETIMEDOUT); the kernel log showed order-7 page
      allocation failures in vmbus_alloc_ring and UtilAcceptVsock accept4 failed 110, with 6 GB swapped and Windows at
      0.4 GB free."
    parents: [SN-13]
    sources: ['owner 2026-11-09: Can you stop wsl from timing out all the time? There has to be a fix possible?']
    verify: {method: test, by: ['tests/test_wsl_memory.py::test_the_settings_are_written_to_sysctl_d_and_applied_at_once',
      'tests/test_wsl_memory.py::test_it_refuses_to_run_without_root_and_says_how',
      'tests/test_wsl_memory.py::test_the_file_cache_goes_back_to_windows_every_30_minutes',
      'tests/test_wsl_memory.py::test_a_new_machine_gets_it_from_the_root_bootstrap']}
    trace: [ops/wsl-memory.sh, ops/bootstrap-wsl-1-root.sh]
  - id: PLT-36
    title: A full Windows disk never stops the stack unannounced
    statement: "Every 20 s the runner shall read the free space on Windows C:, which holds WSL's whole disk; below 10 GB
      it shall prune the unused Docker build cache (at most once an hour, never images in use, containers or volumes) and
      tell the owner once per episode, and below 5 GB it shall alert the owner urgently, at most once an hour."
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: a low reading prunes the build cache and dangling images and tells the owner once; a nearly full
      one also alerts urgently, paced to once an hour; enough space or no reading does nothing; recovery above 13 GB
      ends the episode; the runner checks every host reading. (10 Nov 2026: 20 GB wiped the cache every hour while C: sat near
      14 GB, so every image build started from nothing.)'
    rationale: "10 Nov 2026, 03:36: a night of image builds grew the Docker build cache to 52 GB and the WSL disk file to
      135 GB; C: reached 0.2 GB free, WSL stopped and would not start (E_FAIL), and the owner's phone got HTTP 501. The
      Stack page showed C:'s free space, but nothing acted on it."
    parents: [SN-13]
    sources: ['owner 2026-11-10: Cant reach stack from mobile']
    verify: {method: test, by: ['tests/test_diskguard.py::test_low_disk_prunes_the_build_cache_and_tells_the_owner_once',
      'tests/test_diskguard.py::test_nearly_full_alerts_urgently_at_most_once_an_hour',
      'tests/test_diskguard.py::test_enough_space_or_no_reading_does_nothing_and_recovery_ends_the_episode',
      'tests/test_diskguard.py::test_the_runner_checks_every_reading_of_the_host_probe']}
    trace: [ops/diskguard.py, ops/missions.py]
  - id: PLT-37
    title: The runner has its own pinned Python environment
    statement: The host runner shall run in a Python environment of its own, outside the system Python, made by uv
      (pinned by version and checksum, no sudo) from a lock with a hash for every package it pulls in, none released
      less than 14 days before the lock was written, and made again only when the lock changes; the tests shall use the
      same pins.
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: uv is pinned by version and checksum, the lock holds the pins and every package they pull in
      (atlassian-python-api for the Jira tracker among them) with their hashes, the lock is written without releases
      younger than 14 days, the tests use the same pins, and the runner unit runs in that environment. Shown on 10 Nov
      2026: an environment made from the lock with hashes required imports atlassian''s Jira client.'
    parents: [SN-13]
    sources: [DEC-52]
    verify: {method: test, by: ['tests/test_runner_env.py::test_the_runner_environment_is_pinned_checksummed_and_follows_its_lock']}
    trace: [ops/runner_env.sh, ops/runner-requirements.txt, ops/runner-requirements.lock, tests/requirements.txt, ops/systemd/missions.service]
  - id: PLT-38
    title: A deployment runs only the stack workflows it chooses
    statement: "A deployment shall run, of the stack's own workflows in n8n/workflows/, only those its workflows.yaml
      names (a file's name without .json, or a pattern such as task-*) and those its trackers imply: with any tracker the
      tracker poller, and for a tracker whose workflow is home/<name> that item workflow. A deploy shall import no other
      file and shall unpublish one it published earlier that the deployment no longer chooses; a workflow the runner made
      for a task on that machine shall always count as the deployment's. The switch shall publish only a chosen
      workflow, a crew job's workflow made by the generator and a workflow made on the canvas and exported shall be added
      to the running deployment's list, the app's workflows and schedules shall show only the chosen ones, a changed
      deployment folder shall start an import, and the deployment check shall refuse a listed name that matches no file.
      Home's list and tracker shall choose every workflow home ran before (28 jobs, the self-test, the tracker poller and
      the inbox's item workflow); the example work deployment shall choose only the self-test and the tracker poller.
      Since 11 Nov 2026 a workflow whose factory does not run at the site is left out too, whatever the list or a
      pattern says (PLT-44, PLT-45)."
    type: functional
    priority: must
    status: implemented
    parents: [SN-09]
    sources: [DEC-45, 'CR 2026-11-10 (second), G2: a work deployment gets the home set (phone, postmaster, digests, private task briefings)']
    acceptance: 'Test: home chooses all 31 files, each published, and example-work only the self-test and the poller; trackers
      bring the poller and home/<name> item workflows; an import copies only the chosen files into n8n, publishes the
      runner-made one, unpublishes a published workflow no longer chosen and leaves one n8n never had; the workflow
      reads of the app and the runner see only the chosen ones; the switch refuses an unchosen workflow; the generator and
      add_workflow extend the list once and keep its comments; the check names a typo.'
    verify: {method: test, by: ['tests/test_deployment_workflows.py::test_home_runs_every_workflow_it_ran_before_the_list',
      'tests/test_deployment_workflows.py::test_a_work_deployment_runs_only_the_self_test_and_its_tracker_poller',
      'tests/test_deployment_workflows.py::test_the_tracker_poller_and_the_stacks_item_workflows_come_with_the_trackers',
      'tests/test_deployment_workflows.py::test_a_name_no_workflow_has_is_refused_by_the_deployment_check',
      'tests/test_deployment_workflows.py::test_a_deploy_imports_only_the_deployments_workflows_and_unpublishes_the_ones_it_no_longer_runs',
      'tests/test_deployment_workflows.py::test_the_app_and_the_runner_see_only_the_deployments_workflows',
      'tests/test_deployment_workflows.py::test_a_switch_publishes_only_a_workflow_the_deployment_runs',
      'tests/test_deployment_workflows.py::test_a_new_crew_job_and_a_canvas_workflow_join_the_deployments_list']}
    trace: [ops/deployment.py, ops/n8n_sync.py, ops/n8n_jobs.py, ops/n8n_switch.py, ops/n8n_gen.py, ops/deploy.py,
      deployments/home/workflows.yaml, deployments/example-work/workflows.yaml, deployments/example-work/trackers.yaml]
  - id: PLT-39
    title: A new n8n image is deployed while runs wait
    statement: "A deploy that changes n8n's image (versions.env N8N_IMAGE) shall go ahead while runs wait in n8n, neither
      refusing nor waiting for them, shall wait after compose recreated n8n until n8n's /healthz/readiness answers 200
      (at most 10 minutes, for its database migrations) and shall fail when it does not, so the builder reverts to the
      old pin; the deploy's workflow import shall wait for the same readiness, not for /healthz."
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-13]
    sources: [docs/N8N-MIGRATION.md, 'CR 2026-11-10 (second), G3: an n8n upgrade through ops/deploy.py while a run waits in wait_item and in a command']
    rationale: 'Shown on throwaway containers on 10 Nov 2026 (docs/N8N-MIGRATION.md §11.1): runs waiting in wait_item
      (home''s item workflow) and in a long command resumed and succeeded after n8n was recreated on 2.45.4 and after
      the rollback to 2.44.7 on the migrated database. n8n answers /healthz before its migrations, its workflows and its
      start-up recovery; an answer that arrived then was taken and lost, or resumed a run the recovery then marked
      crashed, on a new image and on the same one; sent only on a 200 from /healthz/readiness, none was lost.'
    acceptance: 'Test: a deploy whose N8N_IMAGE moved runs compose up, says the image changes and that waiting runs
      resume, waits for /healthz/readiness and says DEPLOY OK; an n8n that never gets ready fails the deploy; the
      import waits for readiness; an unchanged pin or no versions.env change is no upgrade.'
    verify: {method: test, by: ['tests/test_deploy_main.py::test_an_n8n_image_change_goes_ahead_while_runs_wait_and_waits_until_n8n_is_ready']}
    trace: [ops/deploy.py, docs/N8N-MIGRATION.md]
  - id: PLT-40
    title: No loop of the runner holds the database between its passes
    statement: Every loop of the host runner that keeps one database connection shall end each pass with no transaction
      open, committing a write a pass left open and logging that write's statement and caller; and when writes fail on a
      lock, the runner's lock report shall name the first open write of every connection in a transaction.
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: a pass that leaves a write open is committed at its end and the log names the statement and the
      code that wrote it, after which another writer gets through; a plain connection is committed as well; every loop
      that keeps one connection pauses through that step; the lock report names the open write; the title repair of the
      tasks table commits what it changed.'
    rationale: "10 Nov 2026, 17:32 to 17:50: the Conductor's long-lived connection slept between passes inside a
      transaction a pass had opened and never committed. 224 writes failed on a lock, the home inbox's first issue waited
      40 minutes for its answer, and steps of three tasks failed, until the runner was restarted; the answer was posted
      35 s later."
    parents: [SN-13]
    sources: ['owner 2026-11-10: Yes, inbox repo']
    verify: {method: test, by: ['tests/test_events.py::test_an_event_seen_before_leaves_no_transaction_open', 'tests/test_runner.py::test_a_pass_that_leaves_a_write_open_is_committed_and_named',
      'tests/test_runner.py::test_every_loop_that_keeps_one_connection_rests_through_end_pass',
      'tests/test_runner.py::test_the_lock_report_names_each_connection_s_open_write',
      'tests/test_runner.py::test_the_title_repair_commits_what_it_changed']}
    trace: [ops/missions.py, ops/tasks.py, ops/conductor.py, ops/staffing.py, ops/builds.py, ops/claude_tasks.py, ops/events.py,
      ops/history.py, ops/improve.py, ops/telemetry.py]
  - id: PLT-41
    title: A missing backup is heard once
    statement: When the newest good backup is older than its schedule allows (the timer's daily start after it, or this
      boot when the PC came up later, plus the timer's random delay, the stack gate's slot and wait and the run's timeout,
      all read from the backup's units), the health board shall raise an alert on the Backup naming the newest backup and
      the one that did not arrive; the owner shall hear it once for the episode, also when it lasts for days, and a good
      backup shall end it.
    type: functional
    priority: must
    status: implemented
    parents: [SN-09]
    sources: [docs/REVIEW-2026-11-10.md, docs/REVIEW-2026-11-07.md]
    rationale: 10 Nov 2026 WSL died at 03:36 during the night's backup; the backup was lost and nothing said so. The 7 Nov
      review asked for this alarm (OPS-R4, second half); the job's own overdue check waits 2.5 days and counts runs, not
      good backups.
    verify: {method: test, by: [tests/test_recoverable.py::test_the_backups_schedule_is_read_from_its_units,
      tests/test_recoverable.py::test_a_missing_nights_backup_is_an_alert_on_the_backup_heard_once_per_episode,
      tests/test_recoverable.py::test_an_unreadable_backup_schedule_says_so_and_no_backup_logged_yet_is_quiet]}
    trace: [ops/crew.py, images/mission-control/obs_core.py, ops/systemd/backup.timer, ops/systemd/backup.service]
  - id: PLT-42
    title: Image builds go through the deployment's build proxy
    statement: "When a deployment's deployment.env names a build proxy (BUILD_HTTP_PROXY, and BUILD_NO_PROXY for the hosts
      that go direct), ops/deploy.py shall hand it to each image build as Docker's proxy build arguments http_proxy,
      https_proxy, HTTP_PROXY, HTTPS_PROXY (and no_proxy, NO_PROXY), named by name with their values in the build's
      environment so the printed command shows no proxy address; without BUILD_HTTP_PROXY a build shall get no proxy
      argument."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-13]
    sources: [docs/PLATFORM.md, 'CR 2026-11-10, G4 item 2: a plain docker build had a proxy only through ~/.docker/config.json']
    rationale: 'The first site update of 10 Nov 2026: behind a proxy, a plain docker build reaches the internet only through
      the proxies of ~/.docker/config.json, which Docker also puts into every container it starts. Docker keeps its own
      proxy build arguments out of the image: on 11 Nov 2026 an image with an apt-get step, built through a stand-in proxy
      with no proxies in ~/.docker/config.json, made all 7 of its requests (package lists and the package) through the proxy, and docker history,
      docker image inspect and a container of the image showed neither the proxy''s address nor its account.'
    acceptance: 'Test: no proxy gives the arguments of before; a proxy gives the six arguments by name, the values only in
      the environment build() runs docker with, and none in the command; the base pins stay.'
    verify: {method: test, by: ['tests/test_deploy.py::test_a_build_behind_the_deployments_proxy_names_dockers_proxy_arguments_and_keeps_their_values_off_the_command']}
    trace: [ops/deploy.py, docs/PLATFORM.md, deployments/example-work/deployment.env]
  - id: PLT-43
    title: A failed deploy and a rollback leave the timers enabled as they found them
    statement: "ops/deploy.py shall read the enabled user timers when it starts; a failed deploy shall enable no timer it
      brings and take off no unit the repository dropped, and when it fails while it enables its new timers, it shall disable
      the ones it enabled; a rollback (DEPLOY_ROLLBACK=1 from ops/update.py, or a new commit that is an ancestor of the old one) shall
      enable no timer of its diff and take off the units the newer commit added; both shall end with the timers of the
      diff enabled as the deploy found them, and timers outside the diff untouched."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-13]
    sources: [docs/PLATFORM.md, 'CR 2026-11-10, G4 item 3: a rollback switched on timers the site never had']
    rationale: 'The first site update of 10 Nov 2026: the rollback after a failed update (ops/update.py runs deploy.py
      <new> <old>) enabled every timer of its diff with no installed copy, and so switched on graphify-sync, which the
      site never had.'
    acceptance: 'Test, with a fake systemctl: a deploy whose smoke test fails, and one whose second new timer cannot be
      enabled, end with the same enabled timers as before and the dropped unit still installed; a good deploy enables its
      new timer and takes off the dropped one only after the smoke test; a rollback, good or failed, enables none of its
      diff, takes off the unit the newer commit added and ends with the timers it found; update.py''s rollback says
      DEPLOY_ROLLBACK=1; putting back touches only the diff''s timers.'
    verify: {method: test, by: ['tests/test_deploy_main.py::test_a_failed_deploy_leaves_the_same_timers_enabled_as_before_it',
      'tests/test_deploy_main.py::test_a_good_deploy_enables_its_new_timers_and_takes_off_the_dropped_ones_after_the_checks',
      'tests/test_deploy_main.py::test_a_rollback_enables_no_timer_of_its_diff_and_leaves_the_enabled_ones_as_it_found_them',
      'tests/test_deploy_main.py::test_the_rollback_after_a_failed_update_tells_the_deploy_it_is_one',
      'tests/test_deploy_main.py::test_putting_back_touches_only_the_diffs_timers_and_says_what_it_cannot']}
    trace: [ops/deploy.py, ops/update.py]
  - id: PLT-44
    title: A site without home runs the platform only
    statement: "A machine that names no deployment ($AISTACK_DEPLOYMENT, ~/.config/aistack/deployment) shall run
      deployments/platform/, the platform only (the app, the engine and the platform's upkeep: FEATURES mission-control
      and memory, no factory), never home; a deployment whose FEATURES do not name home shall run none of home's
      workflows or jobs, whatever its workflows.yaml or a pattern names, and its check and doctor shall name each listed
      one; a deploy on a machine that names no deployment shall be refused before any step. Home's compose
      configuration and workflow selection shall stay as they were."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-09]
    sources: [docs/PLATFORM.md, 'Phase A of the factory design, P3 (the owner, 11 Nov 2026): a fresh install runs the platform only']
    rationale: 'Until 11 Nov 2026 "no deployment chosen" meant home with every feature on, so a site that forgot its name
      ran the household. The home PC itself named none; it names home from this change on (a landing step).'
    acceptance: 'Test: with nothing named, deployment.py runs platform, its workflows are the platform upkeep only and its
      check passes; a site with mail and phone but without home runs neither the postmaster nor task-* nor the inbox
      item workflow, and the doctor names the two listed ones; no home job is among its jobs; home chooses the 31
      files it chose before; a deploy on a machine that names none is refused.'
    verify: {method: test, by: ['tests/test_site_doctor.py::test_a_machine_that_names_no_deployment_runs_the_platform_only',
      'tests/test_site_doctor.py::test_a_site_without_home_runs_none_of_homes_workflows_or_jobs_and_home_keeps_its_own',
      'tests/test_site_doctor.py::test_home_chooses_exactly_what_it_chose_before_the_factories',
      'tests/test_site_doctor.py::test_a_deploy_refuses_on_a_machine_that_names_no_deployment',
      'tests/test_features.py::test_a_machine_runs_the_platform_only_unless_it_names_a_deployment']}
    trace: [ops/deployment.py, ops/n8n_jobs.py, ops/deploy.py, ops/crew.py, deployments/platform/deployment.env,
      deployments/platform/workflows.yaml, deployments/platform/models.yaml, deployments/platform/data.yaml,
      deployments/platform/AGENTS.md, tests/conftest.py]
  - id: PLT-45
    title: Every workflow and job names its factory
    statement: "Every workflow file of n8n/workflows/ and every job of ops/crew.py shall name its factory, platform or
      home; the generic jobs (the ideas sync, the vault ingest, the skill curator, the trial rotation) shall be the
      platform's, in the area upkeep; a new workflow shall get its factory from the generator (a job's own, otherwise
      the site's), and a canvas export shall keep the file's factory; a file that names no factory shall run nowhere and
      the check and the doctor shall name it."
    type: functional
    priority: must
    status: implemented
    parents: [SN-05, SN-09]
    sources: [docs/PLATFORM.md, 'The work side, 11 Nov 2026: home workflows showed on their site because nothing tagged them']
    acceptance: 'Test: the lists of home jobs and platform jobs are exact and none is untagged; each crew workflow names
