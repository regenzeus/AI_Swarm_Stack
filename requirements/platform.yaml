  - id: PLT-31
    title: The stack asks Windows through a desk it cannot command
    statement: A script on Windows, started at logon without admin rights, shall publish the PC's status and fetch questions the stack leaves
      in a folder; it shall treat a request as data and run nothing from it. A question shall go to Claude Code with reading tools only, inside
      folders listed in a file on Windows, never key or password files. Only a turn of the owner's own chat shall be able to ask.
    type: constraint
    priority: should
    status: implemented
    parents: [SN-13]
    sources: [DEC-43]
    rationale: Interop stays off and no port opens, so nothing in WSL can start anything on Windows, where the owner's logins are.
    verify: {method: test, by: [tests/test_windows_desk.py::test_a_question_is_left_in_the_folder_and_its_answer_published,
      tests/test_windows_desk.py::test_a_silent_desk_is_said_not_waited_for, tests/test_windows_desk.py::test_only_your_own_chat_can_ask,
      tests/test_windows_desk.py::test_the_desk_gives_claude_reading_tools_only_and_runs_nothing_from_a_request,
      tests/test_windows_desk.py::test_a_use_of_windows_is_a_line_on_the_map]}
    trace: [ops/windows/desk.ps1, ops/windows/desk-common.ps1, ops/windows/desk-settings.json, ops/windows/desk-setup.ps1, ops/windows/desk-signin.ps1, ops/windows_desk.py, images/mission-control/server.py, images/mission-control/server.mcp.py]
  - id: PLT-32
    title: Remote Control runs from logon on Windows
    statement: From logon, one `claude remote-control` shall run on Windows under the owner's user in the first allowed folder, started again
      if it ends with growing waits, with no permission flags and its connection link never logged.
    type: functional
    priority: should
    status: implemented
    parents: [SN-13]
    sources: ['chat 2026-11-06: I always want to start claude with remote control on reboot.']
    rationale: The desktop app starts at logon, but its old sessions stay offline after a restart until a new message runs in them.
    verify: {method: test, by: [tests/test_windows_desk.py::test_remote_control_keeps_one_server_and_passes_no_permission_flags]}
    trace: [ops/windows/claude-remote.ps1, ops/windows/desk-setup.ps1]
  - id: PLT-33
    title: This deployment's hosts, paths and accounts live in one file
    statement: The addresses of the NAS, the PC and the AI phone, the Forgejo address and owner, the Home Assistant and app addresses, the
      home, stack, code and skills folders, the Docker socket, and the git and Windows account names shall be set once, in
      deployments/home/deployment.env. Compose shall read that file as an env file and hand a container what it needs through its environment, host-side
      Python, shell and Make shall read it through ops/deployment.py, and a variable of the same name in the environment shall win over the
      file. A test shall fail when one of these values is written out in running code outside its named allowlist.
    type: constraint
    priority: should
    status: implemented
    parents: [SN-09, SN-15]
    sources: ['review 2026-11-06: the NAS address, the code folder and the Forgejo owner counted 27 times across 18 files']
    rationale: A move to another machine or address then means one file, and the public snapshot's rewrite (docs/PUBLISHING.md) works on it as on any other file.
    verify: {method: test, by: [tests/test_deployment.py::test_no_converted_value_is_hard_coded_in_running_code,
      tests/test_deployment.py::test_the_guard_finds_a_value_written_out_and_respects_its_allowlist,
      tests/test_deployment.py::test_a_line_may_name_a_line_above_and_the_environment_wins,
      tests/test_deployment.py::test_shell_and_python_read_the_same_values_and_the_environment_wins_in_the_shell_too,
      tests/test_deployment.py::test_every_compose_call_reads_the_file_and_a_changed_file_is_applied,
      tests/test_deployment.py::test_the_page_carries_the_apps_addresses_and_the_tools_name_only_those,
      tests/test_deployment.py::test_units_name_the_home_and_docker_by_specifier]}
    trace: [deployments/home/deployment.env, ops/deployment.py, compose/apps.yaml, Makefile, ops/deploy.py, ops/ci-compose-check.sh, images/mission-control/server.py,
      images/mission-control/web/index.html, images/mission-control/web/static/app.js, images/mission-control/web/static/tools.json, ops/systemd/missions.service]
  - id: PLT-34
    title: The Bitbucket mirror says when it falls behind
    statement: The Windows task ai-stack bitbucket sync shall compare Forgejo's main, fetched on each run, with the main
      Bitbucket last took, push the difference fast-forward only, and end with exit 1 and a log line on every failure (fetch,
      bundle, copy, a non-fast-forward or the push), so a failed push is tried again on the next run.
    type: functional
    priority: should
    status: implemented
    parents: [SN-09]
    sources: [docs/REVIEW-2026-11-07.md]
    rationale: From 25 Oct 2026 the push failed for want of a stored Bitbucket credential; the local clone was already
      fast-forwarded, so every later run saw nothing to do and the task reported success (review OPS-R3).
    verify: {method: inspection, by: [ops/windows/bitbucket-sync.ps1]}
    trace: [ops/windows/bitbucket-sync.ps1]
  - id: PLT-35
    title: Calls into WSL always get their channel
    statement: "WSL's kernel shall keep whole blocks of memory free (a larger free reserve, earlier reclaim, proactive
      compaction) and hand its file cache back to Windows every 30 minutes, set once as root and kept across restarts, so a call from Windows into WSL never fails because its
      Hyper-V socket could not get 512 KB of contiguous memory; a new machine gets the settings from the root bootstrap."
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: the script writes the three settings to sysctl.d, applies them and compacts memory at once, refuses
      to run without root, and the root bootstrap runs it.'
    rationale: "9 Nov 2026: calls into WSL timed out again and again (WSAETIMEDOUT); the kernel log showed order-7 page
      allocation failures in vmbus_alloc_ring and UtilAcceptVsock accept4 failed 110, with 6 GB swapped and Windows at
      0.4 GB free."
    parents: [SN-13]
    sources: ['owner 2026-11-09: Can you stop wsl from timing out all the time? There has to be a fix possible?']
    verify: {method: test, by: ['tests/test_wsl_memory.py::test_the_settings_are_written_to_sysctl_d_and_applied_at_once',
      'tests/test_wsl_memory.py::test_it_refuses_to_run_without_root_and_says_how',
      'tests/test_wsl_memory.py::test_the_file_cache_goes_back_to_windows_every_30_minutes',
      'tests/test_wsl_memory.py::test_a_new_machine_gets_it_from_the_root_bootstrap']}
    trace: [ops/wsl-memory.sh, ops/bootstrap-wsl-1-root.sh]
  - id: PLT-36
    title: A full Windows disk never stops the stack unannounced
    statement: "Every 20 s the runner shall read the free space on Windows C:, which holds WSL's whole disk; below 10 GB
      it shall prune the unused Docker build cache (at most once an hour, never images in use, containers or volumes) and
      tell the owner once per episode, and below 5 GB it shall alert the owner urgently, at most once an hour."
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: a low reading prunes the build cache and dangling images and tells the owner once; a nearly full
      one also alerts urgently, paced to once an hour; enough space or no reading does nothing; recovery above 13 GB
      ends the episode; the runner checks every host reading. (10 Nov 2026: 20 GB wiped the cache every hour while C: sat near
      14 GB, so every image build started from nothing.)'
    rationale: "10 Nov 2026, 03:36: a night of image builds grew the Docker build cache to 52 GB and the WSL disk file to
      135 GB; C: reached 0.2 GB free, WSL stopped and would not start (E_FAIL), and the owner's phone got HTTP 501. The
      Stack page showed C:'s free space, but nothing acted on it."
    parents: [SN-13]
    sources: ['owner 2026-11-10: Cant reach stack from mobile']
    verify: {method: test, by: ['tests/test_diskguard.py::test_low_disk_prunes_the_build_cache_and_tells_the_owner_once',
      'tests/test_diskguard.py::test_nearly_full_alerts_urgently_at_most_once_an_hour',
      'tests/test_diskguard.py::test_enough_space_or_no_reading_does_nothing_and_recovery_ends_the_episode',
      'tests/test_diskguard.py::test_the_runner_checks_every_reading_of_the_host_probe']}
    trace: [ops/diskguard.py, ops/missions.py]
  - id: PLT-37
    title: The runner has its own pinned Python environment
    statement: The host runner shall run in a Python environment of its own, outside the system Python, made by uv
      (pinned by version and checksum, no sudo) from a lock with a hash for every package, and made again only when the
      lock changes; the tests shall use the same pins.
    type: constraint
    priority: must
    status: implemented
    acceptance: 'Test: uv is pinned by version and checksum, the lock holds the pins with their hashes, the tests use the
      same pins, and the runner unit runs in that environment.'
    parents: [SN-13]
    sources: [DEC-52]
    verify: {method: test, by: ['tests/test_runner_env.py::test_the_runner_environment_is_pinned_checksummed_and_follows_its_lock']}
    trace: [ops/runner_env.sh, ops/runner-requirements.txt, ops/runner-requirements.lock, tests/requirements.txt, ops/systemd/missions.service]
