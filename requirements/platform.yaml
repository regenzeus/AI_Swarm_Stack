  - id: PLT-47
    title: A site refuses a factory by a generic setting
    statement: "REFUSE=<factory or pack> in a deployment.env shall keep that factory off for good: FEATURES shall not
      switch it on, a pack of that name shall be refused before it is fetched, deployment.py need shall answer refused
      so the factory's scripts stop, and a deploy whose FEATURES name it shall be refused before any step; the messages
      shall name only the factory and the setting. It replaces a site's private marker file: nothing in the repository
      names a site, a company or a product."
