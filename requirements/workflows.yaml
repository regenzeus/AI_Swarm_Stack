  - id: WFL-06
    title: The stack's own nodes on the canvas
    statement: The canvas shall have the stack's own node, AI Stack step, whose kind makes it one block of the palette
      (agent, build, crew, task, ask, notify, recall, remember, command, plan), which sends the step to the step service
      and waits for its answer; its Agent, Crew job, Place and Repository pickers shall list the stack's own choices,
      read live from the step service; an answer whose status is not done shall end the n8n run as an error; every
      workflow of the repository uses it.
    type: functional
    priority: should
    status: implemented
    parents: [SN-05]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: the node posts with its execution''s resume URL, waits and gives the answer; it offers every kind
      of the step service with its fields; its pickers load the agents, crew jobs, places and repositories from the
      step service''s catalog, which the runner writes; an answer that is not done fails the node on resume with the
      answer''s error and the whole answer kept; n8n loads it from the repository; every workflow''s work goes through
      it. Shown on a throwaway n8n 2.44.7 with a stand-in step service on 10 Nov 2026: a workflow of plan, recall,
      command, remember and coding change blocks waited, was resumed five times and ended in success; a failed answer
      ended its run as an error; the pickers'' methods listed the stand-in''s agents, crew jobs, places and repositories.'
    verify: {method: test, by: ['tests/test_n8n_sync.py::test_the_ai_stack_step_sends_the_step_waits_and_gives_the_answer',
