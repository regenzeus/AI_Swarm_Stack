  - id: WFL-31
    title: Attach, transition and label are done once
    statement: A tracker write that leaves no comment shall be done when the item already holds it, an attachment of the
      same name and size, the target status, the label, so a retry of it writes nothing twice and raises no error.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/N8N-MIGRATION.md]
    rationale: 'The CR of 10 Nov 2026 (B6): put() knew a write as done only by the write mark of a comment.'
    acceptance: 'Test: each kind retried on the stand-in leaves one attachment, its status and one label, without an
      error; Jira''s transition, attachment and label and Forgejo''s close are not written again.'
    verify: {method: test, by: ['tests/test_domain_trackers.py::test_attach_transition_and_label_are_done_once_whatever_the_retries']}
    trace: [ops/domain/trackers.py]
  - id: WFL-32
    title: A wait is answered only by its source
    statement: A wait on a tracker item shall listen to the item's comments (on item, the default), its pull request's
      (on pr) or both (on any); only comments of its source shall answer it, the other source's shall stay unread for a
      wait on them, and the answer shall say its source.
    type: functional
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/N8N-MIGRATION.md]
    rationale: 'The CR of 10 Nov 2026 (B4): tracker and pull request comments landed in one item, so a reporter''s
      comment ended the wait for the review and old comments answered the next wait.'
    acceptance: 'Test: a pull request comment does not wake a wait on the item and answers the next wait on the pull
      request; an item comment wakes the wait on the item; on any takes either; end to end a reporter''s comment during
      the wait for the review does not wake it and a review comment does.'
    verify: {method: test, by: ['tests/test_n8n_items.py::test_a_wait_is_answered_only_from_its_source_and_says_which_it_was',
      'tests/test_n8n_items.py::test_a_change_for_an_item_starts_at_its_tag_and_goes_out_as_a_draft_whose_review_comment_wakes_the_run',
      'tests/test_work_deployment.py::test_the_toy_pack_runs_end_to_end_in_a_customer_class_deployment_against_stand_ins']}
    trace: [ops/runreg.py, ops/domain/forgework.py, ops/flows.py, n8n/custom/AistackStep.node.js]
  - id: WFL-33
    title: A wait says how often it timed out, so reminders end
    statement: A wait's answer shall carry reminded, how often a wait of the same node timed out before in its run (0 on
      its first timeout, counted again after a reply), and the toy pack's item workflow shall remind twice and then stop
      waiting with its summary, the pattern a pack copies.
    type: functional
    priority: should
    status: implemented
    parents: [SN-05]
    sources: [docs/N8N-MIGRATION.md]
    rationale: 'The CR of 10 Nov 2026 (G3): the toy''s reminder loop had no end.'
    acceptance: 'Test: three timeouts answer reminded 0, 1 and 2, a reply after them 3, the next timeout 0; the toy''s
      ticket with no reply reminds twice, stops waiting with its summary and ends.'
    verify: {method: test, by: ['tests/test_n8n_items.py::test_a_waits_answer_says_how_often_it_timed_out_before_so_a_workflow_can_stop_reminding',
      'tests/test_work_deployment.py::test_the_toy_ticket_reminds_twice_and_then_stops_waiting',
      'tests/test_domain_packs.py::test_the_toy_packs_item_workflow_is_a_whole_n8n_workflow_on_logic_nodes_only']}
    trace: [ops/runreg.py, tests/fixtures/packs/toy/workflows/ticket.json]
  - id: WFL-34
    title: An answer goes to n8n only once n8n has finished starting
    statement: The step service shall post an answer to n8n's resume URL only while n8n's readiness check answers 200,
      and while it does not, keep the answer and send it again on its next round, as it does when n8n is away.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [docs/N8N-MIGRATION.md]
    rationale: 'The n8n upgrade test of 10 Nov 2026 (docs/N8N-MIGRATION.md §11.1): n8n answers its health check as soon
      as its port opens, before its migrations, its workflows'' activation and its start-up recovery. An answer posted
      then was taken with a 200 and dropped, or resumed a run that the recovery then marked crashed; the window opens
      on every n8n start (a deploy, an import, the nightly restart).'
    acceptance: 'Test: while n8n is not ready nothing is posted and the answer stays, once it is ready the answer is
      taken; an n8n that cannot be reached counts as not ready; the readiness check asks /healthz/readiness on this
      machine.'
    verify: {method: test, by: ['tests/test_flows.py::test_an_answer_waits_until_n8n_has_finished_starting']}
    trace: [ops/flows.py]
