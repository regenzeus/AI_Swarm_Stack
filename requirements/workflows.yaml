  - id: WFL-13
    title: Run now through n8n
    statement: Every scheduled workflow of the repository shall have a second trigger, a webhook Run now (POST, path
      run/<its file's stem>, ids derived from the workflow's id) on the same AI Stack step, so a job can be started on
      demand through n8n as its schedule would start it; generating the workflows again adds it once and keeps each
      file's id, active state and canvas changes.
    type: functional
    priority: should
    status: implemented
    parents: [SN-05]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: every crew and task workflow and the Memory Keeper''s has Run now on its step with its fixed
      path and ids, added once; regenerating adds it to an existing file and changes nothing else. Shown on a throwaway
      n8n 2.44.7 on 10 Nov 2026: POST webhook/run/crew-checker and webhook/run/memory-keeper each started a run that
      ended in success.'
