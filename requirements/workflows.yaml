      menu; on a phone that page shall list each workflow with whether n8n runs it, its schedule and its last run with
      its state and time, and the phone's menu shall have no Workflows entry. A task or crew job that belongs to a
      workflow shall show at the top of its page its workflow, the run, its state and the step it is on, with the run's
      canvas on the desk and its steps as a list on a phone; an agent's and a crew job's page shall list every workflow
