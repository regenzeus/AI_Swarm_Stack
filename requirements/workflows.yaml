# Workflows: n8n as the stack's workflow pillar, deciding when work starts and in what order; the stack's services
# do the work (docs/N8N-MIGRATION.md, DEC-51).
area: Workflows
prefix: WFL
items:
  - id: WFL-01
    title: n8n is part of the core
    statement: n8n shall run as a core service on every deployment, its image pinned by digest in versions.env, its
      port published on 127.0.0.1 only and opened to the owner on the tailnet, never on the internet.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: the compose core has n8n without a profile, after its database job; the image carries a digest;
      every published port is on 127.0.0.1.'
    verify: {method: test, by: ['tests/test_n8n_service.py::test_n8n_is_part_of_the_core_and_starts_after_its_database',
      'tests/test_n8n_service.py::test_the_n8n_image_is_pinned_by_digest',
      'tests/test_n8n_service.py::test_n8n_is_reached_only_from_this_machine']}
    trace: [compose/core.yaml, versions.env]
  - id: WFL-02
    title: n8n keeps its data in the stack's Postgres
    statement: n8n shall use its own role and database in the stack's Postgres, made by a one-shot job that is safe to
      repeat, so the nightly backup holds its workflows, credentials and executions; its database password and the key
      that encrypts its stored credentials shall come from the sops secrets.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05, SN-13]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: n8n-db runs the setup script with the admin and n8n passwords; n8n reads its database and
      encryption key from variables that make up refuses to start without; the boot check counts n8n-db as a set-up job.'
    verify: {method: test, by: ['tests/test_n8n_service.py::test_n8n_uses_its_own_role_database_and_secrets',
      'tests/test_n8n_service.py::test_the_database_setup_is_safe_to_repeat',
      'tests/test_n8n_service.py::test_the_boot_check_counts_the_database_job_as_set_up']}
    trace: [config/n8n/db.sh, compose/core.yaml, ops/stack_ready.py]
