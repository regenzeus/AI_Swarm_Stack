    title: n8n sends nothing home and runs no shell command
    statement: n8n shall send no telemetry, version pings or survey, and its Execute Command node shall stay off; a
      command runs only at a place, approved by its fingerprint (GEN-22).
    type: constraint
    priority: must
    status: implemented
    parents: [SN-08]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: the service sets diagnostics, version notifications and personalisation off and lists the
