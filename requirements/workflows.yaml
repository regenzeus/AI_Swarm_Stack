  - id: WFL-05
    title: Steps run through one step service
    statement: n8n shall start every step of the stack's own work through Mission Control's step service, which hands
      it to the runner and returns at once; the runner calls n8n's resume URL with the result, also after a restart of
      either side. The step kinds are agent, crew, task, ask, notify, build (a coding change in the builder sandbox),
      recall (a memory search), remember (a note through the memory gate), command (a job kind at a place) and plan
      (an improvised plan's steps in waves), each run through the stack's own code for that work. A crew job whose unit
      is still running shall answer at once that the run in progress covers it, never start a second or wait behind it.
    type: interface
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: a request is checked before anything runs; an agent step runs through the Conductor''s own step
      runner on a row of its own and n8n gets the answer at this machine''s n8n only; the agent reads its brief as its
      step; an answer n8n did not take is sent again after a restart without running the step again; a failed step
      answers with its reason; a crew job runs as its unit; the app''s step port is on a network only n8n shares; a
      coding change runs as the Conductor''s build step and answers with its build, branch, pull request and checks; a
      memory search answers with its hits, each cut visibly; a note enters memory only through the memory tool''s gate;
      a command runs at its place only once approved there and is submitted once, also across a restart; a plan runs
      its steps in waves through the agent path and a step after a failed one does not run.'
    verify: {method: test, by: ['tests/test_flows.py::test_a_request_is_checked_before_anything_runs',
      'tests/test_flows.py::test_the_answer_only_ever_goes_to_n8n_on_this_machine',
      'tests/test_flows.py::test_an_agent_step_runs_through_the_conductors_own_runner_and_n8n_gets_the_answer',
