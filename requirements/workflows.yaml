  - id: WFL-05
    title: Steps run through one step service
    statement: n8n shall start every step of the stack's own work through Mission Control's step service, which hands
      it to the runner and returns at once; the runner calls n8n's resume URL with the result, also after a restart of
      either side. The step kinds are agent, crew, task, ask, notify, build (a coding change in the builder sandbox),
      recall (a memory search), remember (a note through the memory gate), command (a job kind at a place), plan
      (an improvised plan's steps in waves), wait_item (a wait on a tracker item, WFL-20) and tracker (a write to it,
      WFL-21), each run through the stack's own code for that work. A crew job whose unit
      is still running shall answer at once that the run in progress covers it, never start a second or wait behind it.
      Every state file the step service and the run register write (answers, jobs, questions, builds, the register's
      ledger, outbox, runs and items, the trackers' cursors) shall be written whole or not at all (a temp file in the
      same folder, then os.replace), and an empty or unreadable answer file shall count as no answer yet (said once,
      removed, the step handled again), so one bad file never holds a request.
    type: interface
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [DEC-51, docs/N8N-MIGRATION.md]
    acceptance: 'Test: a request is checked before anything runs; an agent step runs through the Conductor''s own step
      runner on a row of its own and n8n gets the answer at this machine''s n8n only; the agent reads its brief as its
      step; an answer n8n did not take is sent again after a restart without running the step again; a failed step
      answers with its reason; a crew job runs as its unit; the app''s step port is on a network only n8n shares; a
      coding change runs as the Conductor''s build step and answers with its build, branch, pull request and checks; a
      memory search answers with its hits, each cut visibly; a note enters memory only through the memory tool''s gate;
      a command runs at its place only once approved there and is submitted once, also across a restart; a plan runs
      its steps in waves through the agent path and a step after a failed one does not run; a write killed half way
      leaves the old file or none, and an empty answer file left by one (10 Nov 2026, a deploy restarted the runner) is
      handled again and answered.'
    verify: {method: test, by: ['tests/test_flows.py::test_a_request_is_checked_before_anything_runs',
      'tests/test_flows.py::test_the_answer_only_ever_goes_to_n8n_on_this_machine',
      'tests/test_flows.py::test_an_agent_step_runs_through_the_conductors_own_runner_and_n8n_gets_the_answer',
      'tests/test_flows.py::test_an_answer_n8n_did_not_take_is_sent_again_after_a_restart_without_running_the_step_again',
      'tests/test_flows.py::test_a_step_that_fails_twice_answers_failed_with_its_reason',
      'tests/test_flows.py::test_a_refused_request_runs_nothing_and_says_why',
      'tests/test_flows.py::test_a_crew_job_runs_as_its_own_unit_and_waits_for_it',
      'tests/test_flows.py::test_a_crew_job_still_running_covers_the_next_run_at_once',
      'tests/test_flows.py::test_the_runner_starts_the_step_worker_and_the_app_serves_the_step_port_on_its_own_network',
      'tests/test_flows.py::test_the_step_port_drops_a_step_for_the_runner_and_answers_what_is_known',
      'tests/test_flows.py::test_an_agent_reads_its_brief_as_its_step',
      'tests/test_flows.py::test_the_new_kinds_are_checked_before_anything_runs',
      'tests/test_flows.py::test_a_coding_change_runs_as_the_conductors_build_step_and_answers_with_its_build',
      'tests/test_flows.py::test_a_memory_search_answers_with_its_hits_each_cut',
      'tests/test_flows.py::test_a_note_enters_memory_only_through_the_memory_tools_gate',
      'tests/test_flows.py::test_a_command_runs_at_its_place_only_once_approved_there_and_is_submitted_once',
      'tests/test_flows.py::test_a_plan_runs_in_waves_through_the_agent_path_and_answers_every_steps_output',
