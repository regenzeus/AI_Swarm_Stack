  - id: WFL-09
    title: One scheduler
    statement: 'n8n shall be the one thing that decides when work starts on a schedule. Every scheduled job (a crew job, a
      task on a schedule, the task of a mission on a schedule) shall run from its own n8n workflow, and its schedule,
      next run and on/off switch shall be read from that workflow. The rule''s only exceptions are the systemd timers of
      the units that must run when n8n is down: the boot check (it brings the stack, n8n included, up), the backup and
      the restore drill (they hold n8n''s own database). A task that gets a schedule shall get its workflow once, made by
      the runner; a task that is over shall have its workflow switched off; after that its schedule is changed on n8n''s
      canvas. One switch shall publish or unpublish a workflow.'
    type: constraint
    priority: must
    status: partial
    parents: [SN-05]
    sources: [DEC-51, docs/N8N-MIGRATION.md, ops/systemd/AGENTS.md]
    acceptance: 'Test: a job''s schedule and next run come from its workflow''s cron, also across a clock change; a
      generated workflow is inactive and goes through the step service; one switch publishes or unpublishes it; a task
      that gets a schedule gets its workflow once, the app''s pages know it, and a cancelled task''s goes off (a
      repository workflow too, and a deploy keeps it off); n8n starts one run of a plan task or of a mission''s task and
      a cancelled task is refused; a mission''s schedule goes to its task, then its workflow holds it; the repository has
      only the three kept timers and every crew job that ran on a timer has its workflow.'
    gap: 'Since 10 Nov 2026 n8n starts every scheduled job, and the old schedulers are removed (WFL-12). Not on n8n yet:
      the weekly self-review keeps its own clock inside the runner (ops/improve.py, a thread, no unit the step service
      could start). A run the PC slept through is not caught up: n8n''s schedule trigger has no catch-up (the timers had
      Persistent=true); only the backup and the restore drill keep it.'
    verify: {method: test, by: ['tests/test_n8n_move.py::test_a_jobs_schedule_and_next_run_come_from_its_workflows_cron',
      'tests/test_n8n_move.py::test_a_generated_workflow_is_inactive_and_goes_through_the_step_service',
      'tests/test_n8n_move.py::test_one_switch_turns_a_job_on_and_off_on_n8n',
