    title: Long pages can be crossed, and the owner sees names, not identifiers
    statement: The Stack page shall start with a link to each of its sections; Home's feed shall open on its 12 newest
      entries with older ones one tap away; the greeting shall use the owner's display name and never an e-mail address
      or its local part; the scheduled jobs shall show each crew job's name; and a Code link without a repository shall
      open the list of repositories.
