  - id: APP-17
    title: The live stream carries everything the screens need
    statement: The app's live state stream shall carry the AI phone's status alongside missions, runs, builds and the
      system, so that Home and the Phone page update without polling.
    type: functional
    priority: should
    status: implemented
    parents: [SN-06]
    sources: [images/mission-control/AGENTS.md]
    verify: {method: test, by: [tests/test_server.py::test_the_live_stream_carries_the_ai_phone]}
  - id: APP-18
    title: What's new writes itself
    statement: The What's new chapter shall list the stack's changes from its git history, newest first.
    type: functional
    priority: could
    status: implemented
    parents: [SN-16]
    sources: [images/mission-control/guide/16-whats-new.md]
    verify: {method: inspection, by: [images/mission-control/web/static/guide.js]}
  - id: APP-19
    title: Nothing the owner reads is cut
    statement: Every text the owner reads (the app, Telegram, push, e-mail, the activity feed, health alerts, errors, logs,
      Ledger text, reviews, build output) shall be shown whole; a shortened form is allowed only as a preview with a visible
      marker one tap from the whole text, a list shall say how many more it holds and offer them, and a stored text that
      hits its cap shall say how much was cut.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06, SN-07]
    sources: [DEC-27]
    findings: [FND-38]
    verify: {method: test, by: [tests/test_truncation.py::test_a_cut_says_what_it_cut_and_input_over_a_limit_is_refused,
      tests/test_truncation.py::test_journal_lines_and_the_phone_s_approval_cards_are_shown_whole, tests/test_truncation.py::test_the_app_wraps_text_and_shows_the_rest_of_a_list, tests/test_app_layout.py::test_a_crew_agent_s_claude_task_is_named_after_it_and_keeps_its_whole_question]}
    trace: [ops/textcap.py, images/mission-control/web/static/app.js, images/mission-control/web/static/app.css, ops/crew.py]
  - id: APP-20
    title: The owner's input is refused, never cut
    statement: When the owner sends a text or a list over a limit, the stack shall refuse it with the limit named and
      shall never store or act on part of it.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06, SN-05]
    sources: [DEC-27]
    findings: [FND-38]
    verify: {method: test, by: [tests/test_truncation.py::test_the_owner_s_long_input_is_refused_with_its_limit_not_cut,
