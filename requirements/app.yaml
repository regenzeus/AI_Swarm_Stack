    trace: [ops/textcap.py, ops/builds.py, ops/missions.py, ops/swarm_client.py, images/swarm/ledger.py, images/mission-control/server.py]
  - id: APP-21
    title: One list of ideas
    statement: Every open idea to improve the stack or its agents (the crew's and the self-review's ideas and the Coach's
      agent changes) shall be in one ranked list under Tasks → Ideas, each marked with its kind, with the decided ones and the
      autonomy and pause rules below it; other screens shall only link to that list with the number waiting for the owner.
    type: functional
    priority: should
    status: implemented
    parents: [SN-02, SN-08]
    sources: [DEC-29]
