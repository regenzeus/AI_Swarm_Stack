  - id: APP-12
    title: The Stack page shows the machine
    statement: The Stack page shall show the live architecture map, every service with its state, Windows and WSL
      memory, CPU and disk, each service's memory against its limit, scheduled jobs, backups, CI per repository,
      skills, costs and the apps, each section linking its guide chapter.
    type: functional
    priority: must
    status: implemented
    parents: [SN-07]
    sources: [images/mission-control/guide/12-stack-page.md, DEC-06]
    verify: {method: test, by: [tests/test_guide.py::test_live_map_boxes_point_at_real_sections]}
  - id: APP-13
    title: The guide covers every feature
    statement: The in-app guide shall have a chapter for every screen, mention every assistant tool and every make target
      with help text, and every Try-it example and live block shall point at something real.
    type: quality
    priority: must
    status: implemented
    parents: [SN-02, SN-15]
    sources: [images/mission-control/guide/AGENTS.md]
    verify: {method: test, by: [tests/test_guide.py::test_chapters_are_well_formed, tests/test_guide.py::test_every_app_screen_has_a_chapter, tests/test_guide.py::test_every_make_target_is_explained, tests/test_guide.py::test_examples_and_live_blocks_point_at_real_things, tests/test_guide.py::test_guide_api]}
  - id: APP-14
    title: The guide says what is true
    statement: Every statement in the guide shall match the current behaviour; when behaviour changes, the guide shall
      change in the same commit.
    type: quality
    priority: must
    status: implemented
    parents: [SN-02, SN-16]
    sources: [images/mission-control/guide/AGENTS.md]
    verify: {method: inspection, by: [images/mission-control/guide/01-welcome.md, images/mission-control/guide/10-builder.md, images/mission-control/guide/13-technology.md, images/mission-control/guide/17-ai-phone.md]}
