  - id: APP-22
    title: Every chart moves, zooms and names its dots the same way
    statement: Every zoomable chart (the code graph, the wiki graphs, Who works with whom) shall move with two fingers or the
      mouse and zoom with two fingers, ctrl and the wheel or its + and − buttons, fit everything in with its fit button,
      and leave one finger and a plain wheel to the page (a chart never swallows a scroll); a live redraw shall keep its
      dots where they were and its zoom; every dot shall have a name, shown when it covers no busier dot's name, at the same
      size on screen at any zoom, and a tap on a dot shall say what it is.
    type: functional
    priority: should
    status: implemented
    parents: [SN-07]
    sources: [images/mission-control/guide/19-swarm.md]
    verify: {method: test, by: [tests/test_charts.py::test_every_chart_moves_and_zooms_through_one_helper_and_one_finger_scrolls_the_page, tests/test_charts.py::test_a_redraw_keeps_the_map_s_dots_and_zoom,
      tests/test_charts.py::test_names_never_cover_each_other_and_the_busiest_keep_theirs,
      tests/test_charts.py::test_the_map_names_every_dot_and_shows_open_ideas_when_asked]}
    trace: [images/mission-control/web/static/app.js, images/mission-control/web/static/swarm.js, images/mission-control/web/static/app.css]
  - id: APP-23
    title: No call of the app waits forever
    statement: Every call the app makes shall end within its time limit (45 s, 30 s for a request, 15 s for each check of
      a slow request's answer); a request that gets no answer shall say so and, for a new task, tell the owner to look
      under Tasks before trying again; a check of a slow request that stalls shall be retried, and a slow request still
      running after 5 minutes shall say that it goes on. The New mission and mission settings forms shall send their request
      for every mission type, and an error in the app shall be shown to the owner as well as reported.
    type: functional
    priority: must
    status: implemented
    parents: [SN-07, SN-13]
    sources: [images/mission-control/web/AGENTS.md]
    findings: [FND-51, FND-52]
    verify: {method: test, by: [tests/test_app_timeouts.py::test_a_request_that_never_answers_ends_with_a_clear_message_instead_of_spinning,
      tests/test_app_timeouts.py::test_a_poll_that_stalls_is_retried_and_a_finished_request_still_arrives,
      tests/test_app_forms.py::test_start_mission_sends_the_request_for_every_type_and_a_price_watch_runs_daily,
      tests/test_app_forms.py::test_mission_settings_save_without_a_type_field,
      tests/test_app_forms.py::test_an_error_in_the_app_is_told_to_the_owner_not_only_reported]}
    trace: [images/mission-control/web/static/app-base.js]
  - id: APP-24
    title: An error in the app is kept, raised and caught before it lands
    statement: Every error the app reports shall be kept (the newest 500, in the missions data) and, while any came in the
      last 24 hours, raised as one alert on the health board naming the most frequent one and its screen; every landing and
      every image build shall lint the app's scripts for undefined names and stop on one; and ops/ui_crawl.js shall click
      through every kind of screen at phone width, with forms filled in and every request recorded instead of sent.
    type: functional
    priority: must
    status: implemented
    parents: [SN-07, SN-13]
    sources: [images/mission-control/web/AGENTS.md]
    findings: [FND-53, FND-54]
    verify: {method: test, by: [tests/test_app_errors.py::test_errors_the_app_hit_are_kept_and_become_one_alert_on_the_health_board,
      tests/test_app_errors.py::test_the_server_keeps_each_error_and_the_checks_lint_the_app_s_scripts,
      tests/test_ux_review.py::test_the_stack_page_names_each_failed_job_and_links_it_and_the_crawl_is_kept]}
    trace: [images/mission-control/server.py, ops/crew.py, ops/app_lint.py, ops/check.sh, ops/ui_crawl.js, images/builder/Dockerfile, images/ci-runner/Dockerfile, images/mission-control/server.devices.py]
  - id: APP-25
    title: What the owner asked for comes before the stack's diagnostics
    statement: A mission's page shall show its latest result before its run log unless a run is live, and fold the health
      board's notes under one line that says they need nothing from the owner; an agent's card shall show its alert, or
      else its result, and count its notes; Home's feed shall open on the owner's results, shopping and errors, with the
      stack's own work one chip away; a copy button shall say Copied only when the text was copied and say why when not;
      and the Stack page shall name and link each failed job.
    type: functional
    priority: must
    status: implemented
    parents: [SN-01, SN-02]
    sources: [docs/UX-REVIEW-2026-10-30.md]
    findings: [FND-55, FND-56, FND-57, FND-58, FND-59]
    verify: {method: test, by: [tests/test_ux_review.py::test_a_mission_card_shows_its_result_not_a_note_for_the_health_doctor,
      tests/test_ux_review.py::test_the_latest_result_comes_before_the_run_s_log_unless_a_run_is_live,
      tests/test_ux_review.py::test_the_home_feed_filters_by_kind_and_each_card_names_its_kind,
