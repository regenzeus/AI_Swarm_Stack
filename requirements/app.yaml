  - id: APP-15
    title: Share anything to the stack
    statement: When the owner shares a link, text, picture or file to the installed app, Mission Control shall keep it
      for 14 days and open it with one-tap choices (summarise, ask, explain, save to knowledge, make a mission), doing
      nothing until he taps.
    type: functional
    priority: should
    status: implemented
    parents: [SN-06, SN-10]
