  - id: APP-31
    title: Explanations are there, folded
    statement: An explanation of how to read a screen shall be folded behind one small labelled line with an i that
      opens it, and stay open through live redraws until closed; what an action will do (a revert, a save, a
      move to Trash, where a secret is stored) shall stay next to its button. No floating button shall cover the
      content; New mission is a button in the header of the missions list.
    type: functional
    priority: should
    status: implemented
    parents: [SN-01, SN-02]
    sources: [images/mission-control/guide/12-stack-page.md]
    verify: {method: test, by: [tests/test_charts.py::test_explanations_fold_and_stay_open_through_redraws]}
    trace: [images/mission-control/web/static/guide.js, images/mission-control/web/static/app.js, images/mission-control/web/static/swarm.js, images/mission-control/web/static/app.css]
  - id: APP-32
    title: A live update never moves the page
    statement: A live update of the Agents overview shall redraw the page only when what it lists changed; its live
      parts (working now, the map) shall update in place, so a page being scrolled stays where it is.
    type: functional
    priority: must
    status: implemented
    findings: [FND-96]
    parents: [SN-01]
    sources: [images/mission-control/guide/19-swarm.md]
    verify: {method: test, by: [tests/test_charts.py::test_a_live_update_redraws_the_agents_page_only_when_its_list_changed]}
    trace: [images/mission-control/web/static/app.js]
  - id: APP-33
    title: Back returns to where you were
    statement: Going back or forward to a page shall return to where it was scrolled, once its slower parts have loaded,
      unless the owner scrolled meanwhile; a newly opened page shall start at its top.
    type: functional
    priority: should
    status: implemented
    parents: [SN-01]
    sources: [images/mission-control/guide/02-first-ten-minutes.md]
    verify: {method: test, by: [tests/test_charts.py::test_back_returns_to_where_you_were_and_a_new_page_starts_at_the_top]}
    trace: [images/mission-control/web/static/app-base.js]
  - id: APP-34
    title: A calm, readable dark theme
    statement: The app shall use a graphite background with opaque surfaces and hairline borders, one accent colour, text
      slightly softer than white, section titles in sentence case and grey counts, with no background glow, shadows or
      gradient buttons; colour shall mark what needs attention.
    type: constraint
    priority: should
