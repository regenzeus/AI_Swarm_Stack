  - id: APP-36
    title: A task's page tells its whole story, the result first
    statement: "A task's page shall open on its result and then tell how it was done, most important first, each part
      opening a tab with the whole of it: who worked on it as a map of the agents (each agent a bubble coloured by its part
      and sized by its own tokens, joined by its hand-offs, calls and starts, each tappable for its part, runs, tokens,
      cost, models, tools and memory use, and the same in words); the definition of done with the verdict; what went wrong
      (failed steps, retries, failed or silent runs, errors, points not met); its sources (read, cited, by site, by step and
      agent); its memory use by store (wikis, notes, journals, long-term memory, the swarm's board, lessons) with what was
      read and kept, including what the stack read or kept around the agents (a refinement's wiki, a briefing's topic wiki
      pages, the answer); what it made (the answer, reports, wiki pages, files, findings, deliveries); its cost and time by
      agent and model; and the plan. A recurring task shall show one run at a time (its newest, or the one picked), and a
      task handed to Claude Code, a build, a chat or a mission shall show its agents too. The map's colours shall pass the
      colour-blind check on both themes."
    type: functional
    priority: must
    status: implemented
    parents: [APP-35, SN-07]
