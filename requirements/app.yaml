      up from the last boot record) while the machine started after the runner's last state and within the boot check's
      wait, "The runner did not start" with the machine's time since then after that wait, and "The runner stopped" with
      how long ago when the runner wrote during this boot and then stopped; the app shall tell the device it is there
      every 15 seconds also while the runner writes nothing.
