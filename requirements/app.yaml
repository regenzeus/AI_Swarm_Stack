      (tasks among it, with their steps and agents), and Results: one card per outcome the owner asked for or the owner's
      rules started (a briefing, a task's answer, an alert's answer, research, a shopping step, a failure), each with its
      kind, its headline, who made it, its first lines and its page; a rule that fires and the task it starts are one
