    title: The desk uses the width it has
    statement: Above 1,100 px the app shall lay each page out for its width through three templates keyed on the page,
      namely an overview page's parts side by side (Home's three parts as columns, without tabs), a list beside what it opens (the
      chat list, the repository cards, the graph with its node panel), and a reading measure for text; the view shall be as
      wide as the window with gutters in proportion, a window over 1,900 px shall scale the whole app up in steps (1.12,
      1.3 above 2,400, 1.6 above 3,200), and the phone layout shall stay as it is.
    type: functional
