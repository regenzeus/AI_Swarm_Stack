  - id: APP-39
    title: "What you make in a chat, you reach from the chat, and it leads back"
    statement: "Every chat answer in which Hermes made something (a mission, a build, a Claude task, a repository, a note
      in the vault, an e-mail) shall show it under the answer as a card with its kind, its name, its state now (being
      created, queued, running, done, waits for you, failed) and its result's headline, opening its page in one tap; a
      change to an item (paused, triggers set, sent back) shall be one line. The chat's header shall count what it made
      (Made here · N) and list it, the chat list shall show it as icons, and the item's page shall say From a chat with
      a link back to the answer that made it. A one-off item shall say in its chat when it ends; a recurring one shall
      not. What the chat made shall be read from the run record's tool results and their ids, never guessed by time."
