# Mission Control, the app: Home, Agents, Wiki, Code, Chat, Stack, the guide, PWA behaviour.
area: App
prefix: APP
items:
  - id: APP-01
    title: Phone first
    statement: Every screen shall work at 375 px width without horizontal scrolling and on a desktop with the side
      navigation from 960 px, and the tab bar shall spread over however many tabs there are; no screen has an app
      top bar, each starts with its own title (the chat with its own bar), every section including Stack is in the
      tab bar, the live state is a dot on Stack, a bar shows at the top only while the app is offline or an update
      waits, and a page's main action fits on its title row; a card that stands for a page opens it on a tap, and an
      agent's text in a card is its formatted markdown.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06]
    sources: [images/mission-control/web/AGENTS.md]
    verify: {method: test, by: [tests/test_now_card.py::test_the_running_card_opens_its_mission_and_folds_each_finding_as_markdown,
      tests/test_now_card.py::test_a_tap_on_a_card_opens_its_page_but_not_on_its_own_links_or_folds,
      tests/test_app_layout.py::test_an_icon_in_text_is_one_line_high_and_no_page_has_an_app_top_bar, tests/test_app_layout.py::test_the_chat_has_one_top_bar_on_a_phone_with_the_live_state_in_it, tests/test_app_layout.py::test_the_wiki_s_new_button_is_one_line_on_the_title_row,
      tests/test_app_routes.py::test_the_tab_bar_spreads_however_many_tabs_there_are, tests/test_app_layout.py::test_the_section_headings_keep_their_gap_and_stay_on_one_line, tests/test_app_layout.py::test_the_swarm_s_views_are_under_agents_on_every_screen, tests/test_app_layout.py::test_new_chat_starts_afresh_and_attaching_is_a_clip]}
    trace: [images/mission-control/web/static/app.css]
    findings: [FND-40, FND-41, FND-82]
  - id: APP-02
    title: Every screen opens cold
    statement: Every app route shall render when it is opened directly (a link, a notification, a reload), without
      first visiting another screen.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06]
    sources: ["incident 2026-10-28: #/phone opened blank from a notification"]
    verify: {method: test, by: [tests/test_app_routes.py::test_every_screen_is_drawn_when_opened_cold, tests/test_app_routes.py::test_the_connections_card_is_started_by_render, tests/test_app_routes.py::test_view_scripts_load_before_app_js_and_take_no_arguments]}
    findings: [FND-30]
  - id: APP-03
    title: Installable, with push and self-update
    statement: The app shall be installable as a PWA, deliver push notifications to devices that switched them on, and
      reload itself when a new version is deployed.
    type: functional
    priority: must
    status: implemented
    trace: [images/mission-control/icons.py]
    parents: [SN-06]
    sources: [images/mission-control/web/AGENTS.md]
    verify: {method: inspection, by: [tests/test_server.py::test_a_large_body_is_refused_before_it_is_read_and_the_page_knows_its_version, images/mission-control/web/sw.js, images/mission-control/web/manifest.webmanifest, images/mission-control/server.py]}
  - id: APP-04
    title: Offline is said plainly
    statement: If the app cannot reach the stack for 8 seconds, then it shall say so (Tailscale off on this device, or
      the PC is down) instead of loading forever, and show when it last had a connection.
    type: functional
    priority: must
    status: implemented
    parents: [SN-06, SN-02]
    sources: ["owner 2026-10-29: 'Loading forever like that'"]
    verify: {method: inspection, by: [images/mission-control/web/static/app.js]}
  - id: APP-05
    title: Home answers three questions
    statement: Home shall show the ask bar at the top, then three tabs like the other pages, the last one opened kept on
      this device - Today (what needs the owner, what is running now with what comes next), Results (a live feed grouped
      by day) and Overview (the AI phone and the day's numbers) - and no quick link the tab bar has.
    type: functional
    priority: must
    status: implemented
    parents: [SN-01, SN-02]
    sources: [images/mission-control/guide/01-welcome.md, "owner 2026-11-08: organise this page into tabs like we do for
        many of the other pages ... We dont need chat wiki or agents links here. Those alrdy got tabs."]
    findings: [FND-57]
    verify: {method: test, by: [tests/test_home_work.py::test_home_is_needs_now_and_a_live_feed_with_an_ask_bar, tests/test_home_work.py::test_now_shows_work_in_progress_and_whats_next, tests/test_home_work.py::test_home_s_results_are_one_card_per_outcome_named_by_what_it_is_about]}
    trace: [images/mission-control/web/static/app.js]
  - id: APP-06
    title: Needs you is only the owner's decisions
    statement: "Needs you shall list only decisions that wait for the owner (builds to review, purchases, phone and
      Gmail approvals, grants, memories to confirm, setup steps only he can do), each one tap away, and say so in one
      line when there are none."
    type: functional
    priority: must
    status: implemented
    parents: [SN-02]
    sources: [DEC-09]
    verify: {method: test, by: [tests/test_home_work.py::test_needs_you_lists_only_decisions_and_says_so_when_there_are_none]}
    findings: [FND-08]
  - id: APP-07
    title: Stack upkeep is visible but separate
    statement: Health alerts and the stack's own improvement ideas shall show under Now as Stack upkeep, not under Needs
      you, with readable rows.
    type: functional
    priority: should
    status: implemented
    parents: [SN-02, SN-07]
    sources: [DEC-09]
    verify: {method: test, by: [tests/test_home_work.py::test_stack_upkeep_sits_under_now_not_needs_you, tests/test_home_work.py::test_list_row_chevrons_have_a_size]}
  - id: APP-08
    title: Live updates without losing your place
    statement: The app shall update only the parts that changed when new state arrives, never replay entrance
      animations, never redraw an open timeline away, and never re-render forms, chat or reading views while the owner
      types or reads.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06]
    sources: [images/mission-control/web/AGENTS.md]
    verify: {method: test, by: [tests/test_app_routes.py::test_live_redraws_do_not_replay_the_entrance_animation, tests/test_app_routes.py::test_an_open_timeline_is_not_redrawn_away]}
  - id: APP-09
    title: Answers are never cached
    statement: Mission Control's API answers shall carry headers that forbid caching.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06]
    sources: ["incident: an old service worker served stale state"]
    verify: {method: test, by: [tests/test_server.py::test_api_answers_are_never_cached]}
  - id: APP-10
    title: Every value is escaped
    statement: The front end shall escape every value it puts into HTML and sanitise rendered markdown with DOMPurify.
    type: constraint
    priority: must
    status: implemented
    parents: [SN-05]
    sources: [images/mission-control/web/AGENTS.md]
    verify: {method: inspection, by: [images/mission-control/web/static/app.js]}
  - id: APP-11
    title: One list of the crew's duties
    statement: The Tasks tab's Team → Crew shall list the crew's duties with the engines that have issues, sorted by
      needs-you, running, then next run, with health as the card's colour and one reason line; a mission's or a duty's page
      shall be its task's page.
