  - id: APP-15
    title: Share anything to the stack
    statement: When the owner shares a link, text, picture or file to the installed app, Mission Control shall keep it
      for 14 days and open it with one-tap choices (summarise, ask, explain, save to knowledge, make a mission), doing
      nothing until he taps.
    type: functional
    priority: should
    status: implemented
    parents: [SN-06, SN-10]
    sources: [images/mission-control/guide/02-first-ten-minutes.md]
    verify: {method: test, by: [tests/test_server.py::test_phone_share_is_kept_and_opened_in_the_app]}
  - id: APP-16
    title: Activity links to its subject
    statement: Every activity-feed entry concerning a build, a run or an agent shall link to that build, run or agent.
    type: functional
    priority: should
    status: implemented
    parents: [SN-07]
    sources: ["owner 2026-10-28"]
    verify: {method: test, by: [tests/test_guide.py::test_activity_feed_links_build_events_to_their_build]}
  - id: APP-17
    title: The live stream carries everything the screens need
    statement: The app's live state stream shall carry the AI phone's status alongside missions, runs, builds and the
      system, so that Home and the Phone page update without polling.
    type: functional
    priority: should
    status: implemented
    parents: [SN-06]
    sources: [images/mission-control/AGENTS.md]
    verify: {method: test, by: [tests/test_server.py::test_the_live_stream_carries_the_ai_phone]}
  - id: APP-18
    title: What's new writes itself
    statement: The What's new chapter shall list the stack's changes from its git history, newest first.
    type: functional
    priority: could
    status: implemented
    parents: [SN-16]
    sources: [images/mission-control/guide/16-whats-new.md]
    verify: {method: inspection, by: [images/mission-control/web/static/guide.js]}
  - id: APP-19
    title: Nothing the owner reads is cut
    statement: Every text the owner reads (the app, Telegram, push, e-mail, the activity feed, health alerts, errors, logs,
      Ledger text, reviews, build output) shall be shown whole; a shortened form is allowed only as a preview with a visible
      marker one tap from the whole text, a list shall say how many more it holds and offer them, and a stored text that
      hits its cap shall say how much was cut.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06, SN-07]
    sources: [DEC-27]
    findings: [FND-38]
    verify: {method: test, by: [tests/test_truncation.py::test_a_cut_says_what_it_cut_and_input_over_a_limit_is_refused,
      tests/test_truncation.py::test_journal_lines_and_the_phone_s_approval_cards_are_shown_whole, tests/test_truncation.py::test_the_app_wraps_text_and_shows_the_rest_of_a_list, tests/test_app_layout.py::test_a_crew_agent_s_claude_task_is_named_after_it_and_keeps_its_whole_question]}
    trace: [ops/textcap.py, images/mission-control/web/static/app.js, images/mission-control/web/static/app.css, ops/crew.py]
  - id: APP-20
    title: The owner's input is refused, never cut
    statement: When the owner sends a text or a list over a limit, the stack shall refuse it with the limit named and
      shall never store or act on part of it.
    type: quality
    priority: must
    status: implemented
    parents: [SN-06, SN-05]
    sources: [DEC-27]
    findings: [FND-38]
    verify: {method: test, by: [tests/test_truncation.py::test_the_owner_s_long_input_is_refused_with_its_limit_not_cut,
      tests/test_truncation.py::test_a_cut_says_what_it_cut_and_input_over_a_limit_is_refused]}
    trace: [ops/textcap.py, ops/builds.py, ops/missions.py, ops/swarm_client.py, images/swarm/ledger.py, images/mission-control/server.py]
  - id: APP-21
    title: One list of ideas
    statement: Every open idea to improve the stack or its agents (the crew's and the self-review's ideas and the Coach's
      agent changes) shall be in one ranked list under Agents, each marked with its kind, with the decided ones and the
      autonomy and pause rules below it; other screens shall only link to that list with the number waiting for the owner.
    type: functional
    priority: should
    status: implemented
    parents: [SN-02, SN-08]
    sources: [DEC-29]
    verify: {method: test, by: [tests/test_app_layout.py::test_every_idea_is_in_one_list_under_agents]}
    trace: [images/mission-control/web/static/swarm.js, images/mission-control/web/static/app.js]
  - id: APP-22
    title: Every chart moves, zooms and names its dots the same way
    statement: Every zoomable chart (the code graph, the wiki graphs, Who works on what) shall move with one finger or the
      mouse, zoom with two fingers, ctrl and the wheel or its + and − buttons, fit everything in with its fit button, and
      leave a plain wheel to the page; every dot shall have a name, shown when it covers no busier dot's name, at the same
      size on screen at any zoom, and a tap on a dot shall say what it is.
    type: functional
    priority: should
    status: implemented
    parents: [SN-07]
    sources: [images/mission-control/guide/19-swarm.md]
    verify: {method: test, by: [tests/test_charts.py::test_every_chart_moves_and_zooms_through_one_helper_with_one_finger,
      tests/test_charts.py::test_names_never_cover_each_other_and_the_busiest_keep_theirs,
      tests/test_charts.py::test_who_works_on_what_names_every_dot_and_hides_closed_ideas_until_asked]}
    trace: [images/mission-control/web/static/app.js, images/mission-control/web/static/swarm.js, images/mission-control/web/static/app.css]
  - id: APP-23
    title: No call of the app waits forever
    statement: Every call the app makes shall end within its time limit (45 s, 30 s for a request, 15 s for each check of
      a slow request's answer); a request that gets no answer shall say so and, for a new mission, tell the owner to look
      under Missions before trying again; a check of a slow request that stalls shall be retried, and a slow request still
      running after 5 minutes shall say that it goes on. The New mission and mission settings forms shall send their request
      for every mission type, and an error in the app shall be shown to the owner as well as reported.
    type: functional
    priority: must
    status: implemented
    parents: [SN-07, SN-13]
    sources: [images/mission-control/web/AGENTS.md]
    findings: [FND-51, FND-52]
    verify: {method: test, by: [tests/test_app_timeouts.py::test_a_request_that_never_answers_ends_with_a_clear_message_instead_of_spinning,
      tests/test_app_timeouts.py::test_a_poll_that_stalls_is_retried_and_a_finished_request_still_arrives,
      tests/test_app_forms.py::test_start_mission_sends_the_request_for_every_type_and_a_price_watch_runs_daily,
      tests/test_app_forms.py::test_mission_settings_save_without_a_type_field,
      tests/test_app_forms.py::test_an_error_in_the_app_is_told_to_the_owner_not_only_reported]}
    trace: [images/mission-control/web/static/app.js]
  - id: APP-24
    title: An error in the app is kept, raised and caught before it lands
    statement: Every error the app reports shall be kept (the newest 500, in the missions data) and, while any came in the
      last 24 hours, raised as one alert on the health board naming the most frequent one and its screen; every landing and
      every image build shall lint the app's scripts for undefined names and stop on one; and ops/ui_crawl.js shall click
      through every kind of screen at phone width, with forms filled in and every request recorded instead of sent.
    type: functional
    priority: must
    status: implemented
    parents: [SN-07, SN-13]
    sources: [images/mission-control/web/AGENTS.md]
    findings: [FND-53, FND-54]
    verify: {method: test, by: [tests/test_app_errors.py::test_errors_the_app_hit_are_kept_and_become_one_alert_on_the_health_board,
      tests/test_app_errors.py::test_the_server_keeps_each_error_and_the_checks_lint_the_app_s_scripts,
      tests/test_ux_review.py::test_the_stack_page_names_each_failed_job_and_links_it_and_the_crawl_is_kept]}
    trace: [images/mission-control/server.py, ops/crew.py, ops/app_lint.py, ops/check.sh, ops/ui_crawl.js, images/builder/Dockerfile, images/ci-runner/Dockerfile]
  - id: APP-25
    title: What the owner asked for comes before the stack's diagnostics
    statement: A mission's page shall show its latest result before its run log unless a run is live, and fold the health
      board's notes under one line that says they need nothing from the owner; an agent's card shall show its alert, or
      else its result, and count its notes; Home's feed shall open on the owner's results, shopping and errors, with the
      stack's own work one chip away; a copy button shall say Copied only when the text was copied and say why when not;
      and the Stack page shall name and link each failed job.
    type: functional
    priority: must
    status: implemented
    parents: [SN-01, SN-02]
    sources: [docs/UX-REVIEW-2026-10-30.md]
    findings: [FND-55, FND-56, FND-57, FND-58, FND-59]
    verify: {method: test, by: [tests/test_ux_review.py::test_a_mission_card_shows_its_result_not_a_note_for_the_health_doctor,
      tests/test_ux_review.py::test_the_latest_result_comes_before_the_run_s_log_unless_a_run_is_live,
      tests/test_ux_review.py::test_the_home_feed_shows_the_owner_s_things_first_and_the_stack_s_on_their_chips,
      tests/test_ux_review.py::test_a_copy_button_says_copied_only_when_it_copied,
      tests/test_ux_review.py::test_the_stack_page_names_each_failed_job_and_links_it_and_the_crawl_is_kept]}
    trace: [images/mission-control/web/static/app.js, images/mission-control/web/static/app.css]
  - id: APP-26
    title: Long pages can be crossed, and the owner sees names, not identifiers
    statement: The Stack page shall start with a link to each of its sections; Home's feed shall open on its 12 newest
      entries with older ones one tap away; the greeting shall use the owner's display name and never an e-mail address
      or its local part; the scheduled jobs shall show each crew job's name; and a Code link without a repository shall
      open the list of repositories.
    type: functional
    priority: should
    status: implemented
    parents: [SN-01, SN-02]
    sources: [docs/REVIEW-2026-10-30.md]
