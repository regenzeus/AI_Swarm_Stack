<meta name="theme-color" id="themecolor" content="#0c1115">
<script>
// the theme before the first paint, so a light page never flashes dark: this device's choice, else the system's
(function () {
  var mq = matchMedia("(prefers-color-scheme: light)");
  window.applyTheme = function (pick) {
    var t = pick === "light" || pick === "dark" ? pick : mq.matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    document.getElementById("themecolor").content = t === "light" ? "#edf0f3" : "#0c1115";
  };
  var saved = function () { try { return localStorage.getItem("mc-theme"); } catch (e) { return null; } };
  applyTheme(saved());
  mq.addEventListener("change", function () { applyTheme(saved()); });
  try { var start = localStorage.getItem("mc-start"); if (start && (!location.hash || location.hash === "#/")) location.replace(start); } catch (e) {}
})();
</script>
