# Forgejo on the Synology NAS. Deployed to /volume1/docker/forgejo/compose.yaml.
# Hosts the private repos ai-stack, vault and hermes-skills. LAN/tailnet only; no router forward.
name: forgejo

services:
  forgejo:
    # 16.0.6 pinned by digest; Forgejo advises against 17.0.0 (push/merge bug).
    image: codeberg.org/forgejo/forgejo:16.0.6-rootless@sha256:51b47921660e1ec7127f094208fe06901ba57df4fe6d59fcccc3a2419514a77f
    container_name: forgejo
    restart: unless-stopped
    user: "1026:100"
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__server__DOMAIN: 192.168.1.10
      FORGEJO__server__ROOT_URL: http://192.168.1.10:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__repository__DEFAULT_PUSH_CREATE_PRIVATE: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__log__LEVEL: Warn
    volumes:
      - /volume1/docker/forgejo/data:/var/lib/gitea
      - /volume1/docker/forgejo/config:/etc/gitea
    ports:
      - "3000:3000"
      - "2222:2222"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
