# Home Assistant on the Synology NAS: the hub between the AI stack and the flat (Alexa/Echo, lights, Tapo plugs,
# later the Schneider shutters). Deployed by `make ha-deploy` to /volume1/docker/homeassistant/compose.yaml.
# LAN only (port 8123 on the NAS, no router forward). Host networking so it can discover devices (mDNS, Tapo broadcast).
name: homeassistant

services:
  homeassistant:
    # 2026.11.0b2 pinned by digest (ops/upgrade-check.sh reports newer releases; upgrades go through `make ha-deploy`).
    # The beta, from 1 Nov 2026: 2026.10.x carries aioamazondevices 16.3.2, whose Alexa sign-in hangs on Amazon's new
    # identifier-first page (/ax/claim; aioamazondevices #1188, #1236); 2026.11 carries 17.2.3. Move to 2026.11.0 when
    # it is out (due 4 Nov). Before it: config-backup-2026-11-01-ha2026.10.4.tgz next to config/ on the NAS.
    image: ghcr.io/home-assistant/home-assistant:2026.11.0b2@sha256:dc3e4f99a631ce15a0854c720815adf40ab5ca850809fee5edcc4c2c1cc6a6fd
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Berlin
    volumes:
      - /volume1/docker/homeassistant/config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8123/manifest.json"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
