# Hermes' voice at home (docs/HOME-VOICE.md): speech to text and text to speech for Home Assistant's voice pipeline.
# Both listen on the NAS itself only (127.0.0.1): Home Assistant (host networking) reaches them there; nothing on the
# network does. Audio is never stored; the speech service logs each transcript, so its log is kept to 1 MB.
# Deployed by `make voice-deploy` (ops/deploy-voice.sh); measured by ops/voice_bench.py (V0, 1 Nov 2026: Parakeet
# 0.8 s median per sentence, 2.5 % word errors; Whisper base 2.0 s, small 7.0 s).
name: voice

x-log: &log
  driver: json-file
  options: {max-size: "1m", max-file: "1"}

services:
  whisper:
    image: rhasspy/wyoming-whisper:latest@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    container_name: voice-whisper
    restart: unless-stopped
    command: ["--model", "${WHISPER_MODEL:-sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8}", "--language", "en",
              "--compute-type", "int8", "--beam-size", "${WHISPER_BEAM:-1}", "--stt-library", "${STT_LIBRARY:-sherpa}"]
    ports: ["127.0.0.1:10300:10300"]
    volumes: ["/volume1/docker/voice/whisper:/data"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m          # Parakeet int8 takes 1.1 GB; the NAS has 3.9 GB, Home Assistant up to 1 GB of it
    logging: *log
  piper:
    image: rhasspy/wyoming-piper:latest@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
    container_name: voice-piper
    restart: unless-stopped
    command: ["--voice", "${PIPER_VOICE:-en_GB-alba-medium}"]
    ports: ["127.0.0.1:10200:10200"]
    volumes: ["/volume1/docker/voice/piper:/data"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m           # one voice takes about 0.1 GB; each extra voice asked for stays loaded
    logging: *log
