# Phase 1's gate (TSK-03, docs/SWARM-ROADMAP.md): one-sentence tasks as the owner would type them. Each must get a
# specification with a checkable definition of done, no more than two questions, and a kind from `kinds`.
# Run: make tasks-gate   (one intake call per task through vk-intake; nothing is started)
tasks:
  # coding
  - {text: "Add a dark mode toggle to the Mission Control settings", kinds: [coding]}
  - {text: "The wiki map labels overlap on small phones, fix that", kinds: [coding]}
  - {text: "Make the backup job send me its size every night", kinds: [coding]}
  - {text: "Write a test that checks every guide chapter has a summary", kinds: [coding]}
  - {text: "Rename the 'Agents today' card on the Stack page to 'Agent activity'", kinds: [coding]}
  # research
  - {text: "Find out which 32 GB DDR4 SO-DIMM kits work with my laptop and what they cost", kinds: [research, shopping]}
  - {text: "What changed in the latest Home Assistant release that matters for Alexa?", kinds: [research]}
  - {text: "Research how other people run local LLMs on 16 GB machines", kinds: [research]}
  - {text: "Compare Tailscale and ZeroTier for a home NAS", kinds: [research, analysis]}
  - {text: "Look up the current EU rules for returning online orders", kinds: [research]}
  # analysis
  - {text: "Analyse which of my missions cost the most model calls last week and why", kinds: [analysis]}
  - {text: "Go through my vault notes on uranium and summarise where the sources disagree", kinds: [analysis, research]}
  - {text: "Which agents failed most often this month, and what do the failures have in common?", kinds: [analysis]}
  - {text: "Review the ai-stack requirements and list the partial ones that block the swarm roadmap", kinds: [analysis, code_question]}
  - {text: "How does the builder decide when a build is ready for review?", kinds: [code_question, analysis]}
  # watching
  - {text: "Tell me when Cameco moves more than 8 % in a day", kinds: [watching]}
  - {text: "Watch for news about a new Raspberry Pi model", kinds: [watching, briefing]}
  - {text: "Let me know when Boss Energy files anything with the SEC", kinds: [watching]}
  - {text: "Every Monday morning, check whether my NAS has firmware updates", kinds: [watching, errand, research]}
  - {text: "Send me a short uranium news briefing every weekday at 7", kinds: [briefing, watching]}
