# ai-stack: rootlesskit's detach-netns mode (default since Docker 28) breaks container outbound traffic on the WSL
# 6.18 kernel (dockerd cannot switch back to its own network namespace: "operation not permitted"), so containers
# created after it started had no internet. Classic mode: dockerd lives inside rootlesskit's network namespace.
# Installed as ~/.config/systemd/user/docker.service.d/no-detach-netns.conf by ops/new-machine.sh and
# ops/bootstrap-wsl-2-user.sh.
[Service]
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=false
