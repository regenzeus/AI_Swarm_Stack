# ai-stack (FND-119): Docker waits only 15 seconds for containerd, a limit it does not let us change. On a cold start of
# the PC containerd took longer to open its database, three times in a row, and systemd's limit of 3 starts a minute then
# gave Docker up for good: the stack stayed down until someone started it by hand. So Docker now tries for as long as it
# takes, and reads what containerd needs into the page cache first, in one go, instead of page by page in those 15 seconds.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=5
ExecStartPre=-/bin/sh -c 'cat /usr/bin/dockerd /usr/bin/containerd %h/.local/share/docker/containerd/daemon/io.containerd.metadata.v1.bolt/meta.db >/dev/null 2>&1'
