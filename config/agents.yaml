# The agent registry (swarm design, requirements SWM-01, SWM-22 to SWM-24, SWM-29): one card per agent.
# Checked by ops/registry.py in ops/check.sh: every field present and known, every key used by exactly one card or
# one service, every key's models and MCP grants in ops/keys.sh equal to its card, every job's systemd unit present.
# A card change is a reviewed commit like any other; each run records the card's hash (SWM-25).
version: 1

harnesses: [hermes, claude-code, opencode, python, script]
models: [gpt-sub, gpt-sub-fast, claude-subscription, none]       # CST-02: subscriptions only (ollama:<name> also allowed)
kinds: [idea, finding, report, wiki, purchase, build, agent_change, requirement, task]
roles: [assistant, research, knowledge, missions, code, reviewers, health, tests, memory, mail, phone, briefings]
rooms: [all, health, code, research, house, shopping, ops]
wake: [never, digest, on_request, always]

# keys that belong to a service, not an agent (no card, no swarm identity)
services:
  vk-hindsight: Hindsight's fact extraction (compose hindsight)
  vk-ui: Open WebUI's own model calls
  vk-spec: the requirements-checker pilot (spec/)
  vk-spec-cheap: the requirements-checker pilot's experiment key (subscription only)
  vk-guard: the research privacy check (images/research)
  vk-smoke: the deploy smoke test
  vk-journal: agent journals, written by the runner for every agent (ops/journal.py)
  vk-wikis: wiki summaries for the Wiki tab (ops/wikis.py)
  vk-eval: replays of agents' past runs for agent-change experiments (ops/evals.py, SWM-18)

agents:
  - id: main
    purpose: The owner's assistant in chat and Telegram.
    responsibilities: [answer the owner, act through the tools he grants, hand questions about code to Claude tasks]
    owns: {}
    harness: hermes
    model: gpt-sub
    key: vk-main
    prompts: prompts/main.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: always
    roles: [assistant]
    rooms: [all]
    contact: ["*"]
    wake: never                       # takes requests from the owner only; agents' requests to it are declined (SEC)
    budgets: {wakes_per_day: 0, messages_per_hour: 20}
    tools: [qmd, research, graphify, missions, phone, claude, mail, house, swarm]
    autonomy: {}
  - id: scout
    purpose: The only agent that reads the web; research behind the research tool.
    responsibilities: [search and read the web, return sourced notes, hold no private data]
    owns: {report: the question is answered with reachable sources}
    harness: hermes
    model: gpt-sub-fast
    key: vk-scout
    prompts: prompts/scout.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: on demand
    roles: [research]
    rooms: [all, research]
    contact: ["*"]
    wake: on_request
    budgets: {wakes_per_day: 6, messages_per_hour: 20}
    tools: [fetch, jobs, browser, swarm]     # jobs: the federal job board's search (MIS-21)
    autonomy: {}
  - id: curator
    purpose: Keeps the vault wiki and long-term memory tidy.
    responsibilities: [merge duplicate wiki pages, mark contradictions, review long-term memory]
    owns: {wiki: links valid and younger than its refresh age}
    harness: hermes
    model: gpt-sub-fast
    key: vk-curator
    prompts: prompts/curator.md           # MEM-11: its prompts, each change replay-tested
    jobs: [curate, memory-review]
    schedule: weekly
    roles: [knowledge, memory]
    rooms: [all]
    contact: ["*"]
    wake: digest
    budgets: {wakes_per_day: 2, messages_per_hour: 10}
    tools: [qmd, swarm]
    autonomy: {}
  - id: mission
    purpose: Runs the owner's missions (tasks, shopping, cleanup analyses).
    responsibilities: [carry out a mission's goal, report with sources, ask before anything that changes the world]
    owns: {report: the mission's result is delivered, purchase: the order is delivered}
    harness: hermes
    model: gpt-sub
    key: vk-mission
    prompts: prompts/mission.md           # MEM-11: its prompts, each change replay-tested
    jobs: [missions]
    schedule: per mission
    roles: [missions]
    rooms: [all, shopping]
    contact: ["*"]
    wake: on_request
    budgets: {wakes_per_day: 6, messages_per_hour: 20}
    memory: {wikis: [own, vault, related]}  # MEM-04: what its runs read, its own wiki first
    tools: [qmd, research, claude, mail, swarm, files]   # files: MIS-24, file_save
    autonomy: {}
  - id: desk
    purpose: Writes the Topic Desk briefings.
    responsibilities: [brief the owner on his topics with sources]
    owns: {report: delivered with reachable sources}
    harness: python
    model: gpt-sub
    key: vk-desk
    prompts: prompts/desk.md           # MEM-11: its prompts, each change replay-tested
    jobs: [desk]
    schedule: per topic
    roles: [briefings]
    rooms: [all, research]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    memory: {wikis: [own, vault, related]}  # MEM-04: what its runs read, its own wiki first
    tools: []
    autonomy: {}
  - id: builder
    purpose: Codes the owner's approved changes in the sandbox.
    responsibilities: [implement an approved idea on a branch, pass the checks, never push or deploy]
    owns: {build: CI green and the smoke test passes}
    harness: claude-code
    model: claude-subscription
    key: vk-builder
    prompts: prompts/builder.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: on demand
    roles: [code]
    rooms: [all, code]
    contact: ["*"]
    wake: on_request
    budgets: {wakes_per_day: 6, messages_per_hour: 20}
    tools: [graphify]
    autonomy: {}
  - id: planner
    purpose: Splits an approved idea into tasks with dependencies, so parallel builders can take them.
    responsibilities: [split an idea whose files span areas into the fewest tasks, give each task its files, order tasks that share a file]
    owns: {task: its build is merged}
    harness: claude-code
    model: claude-subscription
    key: none
    prompts: prompts/planner.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: on Build it (inside the build worker)
    roles: [code]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: []
    autonomy: {}
  - id: opencode
    purpose: The spare coding agent and the code map's enrichment.
    responsibilities: [answer code questions, enrich the code map]
    owns: {}
    harness: opencode
    model: gpt-sub
    key: vk-code
    prompts: prompts/opencode.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: on demand
    roles: [code]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: [graphify]
    autonomy: {}
  - id: doctor
    purpose: The Health doctor; turns open health issues into findings and fixes.
    responsibilities: [diagnose open health issues from redacted evidence, propose fixes and detector changes, change nothing]
    owns: {finding: resolved when its idea is done, idea: its health issue stays away for 7 days}
    harness: claude-code
    model: claude-subscription
    key: none
    prompts: prompts/doctor.md           # MEM-11: its prompts, each change replay-tested
    jobs: [crew-doctor]
    schedule: every 6 h
    roles: [health, reviewers]
    rooms: [all, health]
    contact: ["*"]
    wake: on_request
    budgets: {wakes_per_day: 6, messages_per_hour: 20}
    tools: []
    autonomy: {}
  - id: maintainability
    purpose: The weekly maintainability review of recently changed code.
    responsibilities: [find code that really costs, propose at most a few changes with evidence]
    owns: {idea: the named check passes and the code is simpler}
    harness: claude-code
    model: claude-subscription
    key: none
    prompts: prompts/maintainability.md           # MEM-11: its prompts, each change replay-tested
    jobs: [crew-maintainability]
    schedule: weekly
    roles: [code, reviewers]
    rooms: [all, code]
    contact: ["*"]
    wake: digest
    budgets: {wakes_per_day: 1, messages_per_hour: 10}
    tools: []
    autonomy: {}
    instructions:
      - "Propose a change only if you can cite a concrete cost from the last 90 days: a bug, a failed or reverted change, an incident, or a file edited 3+ times for the same reason (name the commits or files). Without that, report nothing."
      - "Do not propose refactors, deduplication or cleanups of code that works and rarely changes: if the duplication or awkwardness has not caused a defect or repeated edits, leave it alone."
      - "State in each idea what breaks or costs time today if it is not done; if the honest answer is 'nothing yet', drop the idea. Prefer sending zero ideas over a weak one."
  - id: tests
    purpose: The test agent; finds untested and flaky code that changed.
    responsibilities: [propose one test for churned, untested code]
    owns: {idea: the named test exists and passes in CI}
    harness: script
    model: none
    key: none
    jobs: [crew-tests]
    schedule: weekly
    roles: [tests]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: self-review
    purpose: The weekly self-review; turns the stack's signals into improvement ideas.
    responsibilities: [read the week's signals and reviews, propose small concrete improvements]
    owns: {idea: its signal stays away for 14 days}
    harness: python
    model: gpt-sub
    key: vk-review
    prompts: prompts/self-review.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: weekly (runner thread)
    roles: [reviewers]
    rooms: [all, ops]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: intake
    purpose: Turns a task given in one sentence into its specification and plan, and hands it to the door that does that work.
    responsibilities: [write each task's checkable definition of done, propose an agent for each step with a reason, ask at most two questions]
    owns: {task: its definition of done is checkable and the task reached a door}
    harness: python
    model: gpt-sub
    key: vk-intake
    prompts: prompts/intake.md           # MEM-11: its prompts, each change replay-tested
    jobs: []
    schedule: on each new task (runner thread)
    roles: [missions]
    rooms: [all]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: memory
    purpose: The Memory Keeper; looks after every memory store, fixes its faults within its rules and keeps each change undoable (docs/MEMORY.md).
    responsibilities: [retire duplicates, test noise and agents' runs from the long-term memory and put its facts into English while its trial passes, ask the owner when two of his facts disagree, turn each wiki contradiction into a dispute a research task settles with sources, re-check stale pages agents still read, tidy every agent wiki and add no facts, keep each agent's journal short and true, clean the search index, delete nothing]
    owns: {}
    harness: python
    model: gpt-sub-fast
    key: vk-memory
    prompts: prompts/memory.md           # MEM-11: its prompts, each change replay-tested
    jobs: [crew-memory]
    schedule: daily
    roles: [memory]
    rooms: [all]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: inbox
    purpose: The Inbox digest; hands newsletters on a watched topic to that topic, files others worth keeping into the vault.
    responsibilities: [read mail under the owner's read grant, hand matching newsletters to their topic, file the picks, never organise or trash]
    owns: {}
    harness: python
    model: gpt-sub-fast
    key: vk-inbox
    prompts: prompts/inbox.md           # MEM-11: its prompts, each change replay-tested
    jobs: [crew-inbox]
    schedule: daily
    roles: [mail]
    rooms: [all]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: [mail]
    autonomy: {}
  - id: phone-check
    purpose: Checks the AI phone's battery, storage, patch level and connection.
    responsibilities: [report real faults only]
    owns: {}
    harness: script
    model: none
    key: none
    jobs: [crew-phone-check]
    schedule: weekly
    roles: [phone, health]
    rooms: [all, health]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: phone-cleanup
    purpose: Turns the AI phone's cleanup analysis into steps the owner approves.
    responsibilities: [propose cleanup steps, run only what the owner approved]
    owns: {}
    harness: script
    model: none
    key: none
    jobs: [crew-phone-cleanup]
    schedule: weekly
    roles: [phone]
    rooms: [all]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: coach
    purpose: Turns the agents' scorecards into agent changes, each replayed on the agent's past runs before it may ship.
    responsibilities: [read every scorecard monthly, open an agent change only for a real problem with its evidence and target score, never change itself]
    owns: {agent_change: its experiment passes and its target score holds for 14 days}
    harness: claude-code
    model: claude-subscription
    key: none
    prompts: prompts/coach.md           # MEM-11: its prompts, each change replay-tested
    jobs: [crew-coach]
    schedule: monthly
    roles: [reviewers]
    rooms: [all, ops]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: checker
    purpose: Decides from ground truth whether a shipped idea worked; applies the owner's autonomy rules.
    responsibilities: [run each shipped idea's success check, mark it proved or reopen it, start what a rule allows, pause a failing agent]
    owns: {}
    harness: script
    model: none
    key: none
    jobs: [crew-checker]
    schedule: hourly
    roles: [health]
    rooms: [all, health]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  # ---------- the roles software work needs (TRL-07, docs/SWARM-TRIALS.md): staffed by a plan, each in its lane ----------
  - id: analyst
    purpose: Turns a specification or documentation into numbered, testable requirements with their sources; reads specs, never code.
    responsibilities: [read the specification whole, write one requirement per testable rule with its source, mark what is optional]
    owns: {requirement: each one testable and traced to its source}
    harness: claude-code
    model: claude-subscription
    key: none
    jobs: []
    schedule: on demand
    roles: [code]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: []
    autonomy: {}
    instructions:
      - Read only the specification and documentation the task names; never read source code or test suites of any implementation.
      - Write each requirement as R-<area>-<n> in the form "When <condition>, the <system> shall <behaviour>", with the spec section it comes from.
      - Every rule of the specification becomes a requirement; mark optional parts as optional and keep examples as the requirement's evidence.
  - id: tester
    purpose: Writes acceptance tests from the requirements alone, before or beside the code, each test named after its requirement.
    responsibilities: [one or more tests per requirement, tests that fail on wrong behaviour, never touch the code under test]
    owns: {task: every requirement has a test}
    harness: claude-code
    model: claude-subscription
    key: none
    step_kind: build                     # its steps are builds in its lane (ops/conductor.py run_build)
    lane: [tests/acceptance/]
    jobs: []
    schedule: on demand
    roles: [tests]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: []
    autonomy: {}
    instructions:
      - Write tests from the requirements in your brief only; do not read the implementation's source, even if it is there.
      - Put every test under tests/acceptance/, named test_<requirement id>_<what>; the tests import the public interface the task names.
      - A test must fail on wrong behaviour; cover the boundaries and the error cases each requirement names.
  - id: breaker
    purpose: Tries to make the software fail (edge cases, property-based tests, odd inputs) and leaves each failure as a reproducing test.
    responsibilities: [attack the program through its interface, keep only real failures, give each a minimal reproducer]
    owns: {finding: each one reproduced by a test}
    harness: claude-code
    model: claude-subscription
    key: none
    step_kind: build
    lane: [tests/breaker/]
    jobs: []
    schedule: on demand
    roles: [tests, reviewers]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: []
    autonomy: {}
    instructions:
      - Use the program only through its public interface, like a user; judge its answers by the requirements and the specification.
      - Write tests under tests/breaker/ only; each failing test is one minimal reproducer of one real fault, with the requirement it breaks.
      - Keep a test only when the specification says the program is wrong; a test that passes documents an edge case you checked.
  - id: tracer
    purpose: Maps each requirement to the code and tests that fulfil it, with file and line evidence, and names the ones not met.
    responsibilities: [trace every requirement to code and tests, mark it met, partial, unmet or contradicted, list the gaps first]
    owns: {report: every requirement traced with evidence}
    harness: claude-code
    model: claude-subscription
    key: none
    jobs: []
    schedule: on demand
    roles: [code, reviewers]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: []
    autonomy: {}
    instructions:
      - For each requirement give the file and lines that implement it and the tests that check it, or say there are none.
      - Mark each one met, partial, unmet or contradicted; put the unmet and contradicted ones first, each with why.
  - id: judge
    purpose: Runs every test of the task's repository in the sandbox and sends failures back to the step that must fix them.
    responsibilities: [run all tests on the current main, report the counts, send failures back within the fix rounds]
    owns: {task: its tests pass}
    harness: script
    model: none
    key: none
    step_kind: check                     # ops/conductor.py run_check: no model; a check may loop back (TRL-08)
    jobs: []
    schedule: on demand
    roles: [tests]
    rooms: [all, code]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 5}
    tools: []
    autonomy: {}
  - id: presenter
    purpose: Writes the owner's report of a task from what every step did, the tests and the trace, plainly and with evidence.
    responsibilities: [say what was asked and what came of it point by point, name what went wrong and what is open, cite the evidence]
    owns: {report: the owner reads the outcome without asking}
    harness: claude-code
    model: claude-subscription
    key: none
    jobs: []
    schedule: on demand
    roles: [reviewers]
    rooms: [all]
    contact: ["*"]
    wake: never
    budgets: {wakes_per_day: 0, messages_per_hour: 10}
    tools: []
    autonomy: {}
    instructions:
      - Start with the outcome against the definition of done, point by point, with the evidence (test counts, files, the trace).
      - Then what went wrong and how it was handled, what is still open, and what needs the owner. No praise, no filler.
