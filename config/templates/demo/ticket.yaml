template: demo/ticket
about: A reported problem from its report to an accepted fix (the preview's demo; waits are minutes here, days in a real pack)
budget: {days: 1}
nodes:
  report: {block: start, title: A problem is reported, kind: item}
  intake: {block: agent, title: Read the report and ask what is missing, agent: analyst}
  reply: {block: wait, title: Wait for the reporter's answer, for: reporter, key: item, remind: [2m], timeout: 6m, then: triager}
  reproduce: {block: command, title: Reproduce it on the given input, kind: demo.reproduce}
  spec: {block: agent, title: Write the acceptance criteria, agent: analyst}
  approve: {block: gate, title: Approve the criteria, role: spec-approver}
  implement: {block: change, title: Implement the fix, agent: builder}
  regress: {block: command, title: Run the regression cases, kind: demo.regress, each: spec.items, pool: steps}
  review: {block: agent, title: Review the change, agent: reviewer}
  classify: {block: agent, title: Classify the differences, agent: judge, loop: {to: implement, max: 2}}
  deliver: {block: tracker, title: Post the branch and ask for feedback, kind: comment, role: delivery-approver}
  accepted: {block: end, title: The fix is delivered, kind: done}
edges:
  - [report, intake]
  - [intake, reply]
  - [reply, reproduce]
  - [reproduce, spec]
  - [spec, approve]
  - [approve, implement]
  - [implement, regress]
  - [implement, review]
  - [regress, classify]
  - [review, classify]
  - [classify, deliver]
  - [deliver, accepted]
