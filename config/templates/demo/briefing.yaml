template: demo/briefing
about: A morning briefing as a plan runs it (the preview's demo)
nodes:
  morning: {block: start, title: Every morning, kind: schedule, trigger: 'daily 07:00'}
  collect: {block: agent, title: Collect what is new on the topics, agent: desk}
  scout: {block: agent, title: Read the sources the collection found, agent: scout, each: collect.items}
  write: {block: agent, title: Write the briefing, agent: desk}
  check: {block: agent, title: Check facts and links, agent: judge, loop: {to: write, max: 1}}
  deliver: {block: agent, title: Deliver it to the app and the phone, agent: desk}
  sent: {block: end, title: The briefing is sent, kind: done}
edges:
  - [morning, collect]
  - [collect, scout]
  - [scout, write]
  - [write, check]
  - [check, deliver]
  - [deliver, sent]
