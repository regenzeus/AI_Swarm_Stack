# Temporal's dynamic config for the AI Stack's engine (GEN-33, docs/AI-STACK.md §3). The server reads it at start and
# again while it runs. Every value here is a limit the stack sets on purpose; anything not named keeps Temporal's default.
#
# limit: refuses, one workflow's history: Temporal fails a run past these; the graph runner continues as new long
# before (GEN-38), so they are the backstop, at Temporal's own defaults, named here so they are seen.
limit.historyCount.error:
  - value: 51200
limit.historySize.error:
  - value: 52428800
# The warnings come at a fifth of each, and the runner's continue-as-new is suggested from them.
limit.historyCount.warn:
  - value: 10240
limit.historySize.warn:
  - value: 10485760
