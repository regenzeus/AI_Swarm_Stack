template: toy/triage
about: A ticket is sorted into a bug or a question (the toy pack's exam template)
nodes:
  ticket: {block: start, title: A ticket arrives, kind: item}
  route: {block: branch, title: Bug or question, agent: 'toy:intake', brief: 'Answer with one of: bug, question'}
  bug: {block: end, title: A bug, kind: done}
  question: {block: end, title: A question, kind: done}
edges:
  - [ticket, route]
  - [route, bug, bug]
  - [route, question, question]
